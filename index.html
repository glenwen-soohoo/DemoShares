<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Shares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e5e5e5;
    --bg: #ffffff;
    --hover: #f7f7f7;
    --accent: #4A6AD3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }
  header {
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }
  ul.demos {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.demos li {
    border-bottom: 1px solid var(--border);
  }
  ul.demos a {
    display: block;
    padding: 20px 4px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s ease;
  }
  ul.demos a:hover {
    background: var(--hover);
  }
  .demo-name {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .demo-meta {
    font-size: 13px;
    color: var(--text-muted);
  }
  .demo-meta .arrow {
    color: var(--accent);
    margin-left: 4px;
  }
  .state {
    padding: 32px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
  }
  footer a {
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Demo Shares</h1>
    <p class="subtitle">內部 demo 與原型頁面集中區</p>
  </header>

  <ul class="demos" id="demoList">
    <li class="state" id="loading">載入中⋯</li>
  </ul>

  <footer>
    把新的 demo 放成一個資料夾（含 <code>index.html</code>），推到 GitHub 即可。
  </footer>
</div>

<script>
  const REPO_OWNER = 'glenwen-soohoo';
  const REPO_NAME = 'DemoShares';
  const SKIP = new Set(['.github', '.git', 'assets']);

  async function loadDemos() {
    const list = document.getElementById('demoList');
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const items = await res.json();
      const dirs = items
        .filter(it => it.type === 'dir' && !SKIP.has(it.name) && !it.name.startsWith('.'))
        .sort((a, b) => b.name.localeCompare(a.name));

      list.innerHTML = '';

      if (dirs.length === 0) {
        list.innerHTML = '<li class="state">目前還沒有 demo，把資料夾放進來就會出現在這裡。</li>';
        return;
      }

      for (const d of dirs) {
        const li = document.createElement('li');
        li.innerHTML = `
          <a href="./${encodeURIComponent(d.name)}/">
            <div class="demo-name">${d.name}</div>
            <div class="demo-meta">開啟 <span class="arrow">→</span></div>
          </a>
        `;
        list.appendChild(li);
      }
    } catch (err) {
      list.innerHTML = `<li class="state">無法載入清單（${err.message}）。請確認 repo 已 public。</li>`;
    }
  }

  loadDemos();
</script>
</body>
</html>
