$('#customerType').onchange=()=>{const other=$('#customerType').value==='other';$('#other-wrap').hidden=!other;$('#customerTypeOther').required=other;if(!other)$('#customerTypeOther').value=''};
const fill=s=>{for(const[k,v]of Object.entries(s)){const e=$('#'+k);if(e)e.value=v}$('#other-wrap').hidden=true;$('#customerTypeOther').required=false;$$('input[name=categoryIds]').forEach(e=>e.checked=true);$('#customerName').focus()};
$('#fillSample').onclick=()=>fill(SAMPLE);$('#fillNoAddr').onclick=()=>fill(SAMPLE_NO_ADDR);
$('#scenario').onchange=e=>{scenario=e.target.value;epoch++;block(false);if(!$('#apply-body')){const desired=scenario;formPage();$('#scenario').value=desired;$('#scenario').dispatchEvent(new Event('change'));return}$('#submit-application').disabled=false;$('#submit-error').textContent='';if(scenario==='closed'){$('#apply-body').hidden=true;let a=$('#apply-state');if(!a){a=document.createElement('div');a.id='apply-state';main.append(a)}a.className='result';a.setAttribute('role','status');a.innerHTML='<h2>目前暫停受理合作申請</h2><p class="lead">報價資料目前調整中，請稍後再來。</p>'}else{if($('#apply-state'))$('#apply-state').remove();$('#apply-body').hidden=false}};
const messages={rate:'申請次數已達上限，請一小時後再試。',closedOnSubmit:'目前暫停受理合作申請。',badData:'資料格式有誤，請確認各欄位後再送出。',unreachable:'系統暫時無法受理申請，請稍後再試。',expired:'送出失敗，請重新整理頁面後再試。'};
$('#application-form').onsubmit=async e=>{e.preventDefault();if($('#submit-application').disabled)return;const err=$('#submit-error');err.textContent='';const d=Object.fromEntries(new FormData(e.target));d.categoryIds=$$('input[name=categoryIds]:checked').map(e=>+e.value);Object.keys(d).forEach(k=>{if(typeof d[k]==='string')d[k]=d[k].trim()});
// 必填、E-Mail、電話格式由瀏覽器原生驗證；這裡只檢查統編與分類。統編選填，有填才檢查。
if(!validTax(d.taxId)){err.textContent='統一編號格式不正確，請確認。';return}
if(!d.categoryIds.length){err.textContent='請至少勾選一項報價單需求。';return}
const run=epoch;block(true);await sleep(350);if(run!==epoch)return;block(false);
if(messages[scenario]){err.textContent=messages[scenario];return}
write(KEY,d);try{localStorage.removeItem(BATCH)}catch{}main.innerHTML=`<div class="result" role="status"><h2>已收到您的申請！</h2><p class="sent-note">待業務確認後會回覆報價單於填寫之 Email</p></div>`;window.scrollTo(0,0)};
}
function fresh(){return {scenario:'normal',selected:[...app.categoryIds],phase:'pending',sentAt:null,supplementaryText:'',unavailable:[],quoteDate:DATE,validUntil:VALID}}
function save(){write(BATCH,batch)}
function seed(n){reviewError='';sending=false;epoch++;app=structuredClone(SAMPLE);write(KEY,app);batch=fresh();batch.scenario=n;scenario=n;
if(n==='sent'){batch.selected=[1,2,4,5];batch.phase='sent';batch.sentAt=SENT_AT}
if(n==='soup'){batch.selected=batch.selected.filter(id=>id!==3);batch.supplementaryText=SOUP_NOTE}
if(n==='failedPrev')batch.phase='failed';
if(n==='noStock'){batch.unavailable=[4];batch.selected=batch.selected.filter(id=>id!==4)}
if(n==='disabled')batch.phase='disabled';
if(n==='invalid')batch.phase='invalid';
save();reviewRender()}
function reviewPage(){batch=read(BATCH,null)||fresh();batch.supplementaryText??='';batch.unavailable??=[];scenario=batch.scenario||'normal';$('#tools').innerHTML=panel('review');$('#scenario').value=scenario;$('#scenario').onchange=e=>seed(e.target.value);reviewRender()}
function reviewRender(){window.B2BUI.renderReview({app,batch,templates:T,sending,error:reviewError,onSelect:ids=>{if(batch.phase==='sent')return;reviewError='';batch.selected=ids;save();reviewRender()},onSupplementaryChange:text=>{if(batch.phase==='sent')return;batch.supplementaryText=text.replace(/\r\n?/g,'\n').slice(0,2000);save();reviewRender()},onPreview:previewMail,onSend:send});$('#scenario').value=batch.phase==='sent'?'sent':scenario;save()}
function previewMail(){if(!batch.selected.length)return;window.B2BUI.renderMailPreview({app,batch:structuredClone(batch),templates:T,terms:TERMS,extraTerms:EXTRA_TERMS})}
// 寄出的模擬流程：按鈕轉圈約 1 秒，再依情境顯示結果框；失敗後按鈕仍可再按。
async function send(){if(sending||['sent','disabled','invalid'].includes(batch.phase)||!batch.selected.length)return;const run=++epoch;sending=true;reviewError='';reviewRender();await sleep(1000);if(run!==epoch)return;sending=false;
if(scenario==='failedNow')reviewError='寄送失敗。'+COPY_HINT;
else if(scenario==='tooLarge')reviewError='報價單附件合計超過 7MB，這次沒有寄出，請聯絡 IT。';
else{batch.phase='sent';batch.sentAt=SENT_AT}
save();reviewRender()}
function mailPage(kind){const notice=kind==='notice';batch=read(BATCH,null);const originalApp=structuredClone(app),originalBatch=batch?structuredClone(batch):null;
function renderMailScenario(mode='current'){let previewApp=originalApp,previewBatch=originalBatch;
if(mode==='noAddr')previewApp=structuredClone(SAMPLE_NO_ADDR);
if(mode==='soup'){previewApp=structuredClone(SAMPLE);previewBatch={selected:[1,2,4,5],supplementaryText:SOUP_NOTE,validUntil:VALID}}
const selected=previewBatch?.selected?.length?previewBatch.selected:previewApp.categoryIds,subject=notice?'【無毒農 B2B 合作申請】'+previewApp.customerName:'無毒農 B2B 報價單｜'+previewApp.customerName;window.B2BUI.renderMail({kind,app:previewApp,batch:previewBatch,templates:T,selected,subject,terms:TERMS,extraTerms:EXTRA_TERMS});}
renderMailScenario();$('#tools').innerHTML=panel(notice?'mail':'quotation');$('#scenario').onchange=e=>renderMailScenario(e.target.value);}

function quotePage(){const param=new URLSearchParams(location.search).get('categoryId');const id=+(param||1),category=T.find(x=>x.id===id)||T[0];$('#tools').innerHTML=panel('quote');window.B2BUI.renderQuote({app,category,terms:TERMS,date:DATE,templateName:TEMPLATE_NAME})}
const nav=$('.mobile-menu-toggle');if(nav)nav.onclick=()=>{const open=$('.baby-nav').classList.toggle('open');nav.setAttribute('aria-expanded',String(open));nav.textContent=open?'關閉選單':'選單'};
const page=document.body.dataset.page;if(page==='apply')formPage();if(page==='review')reviewPage();if(['notice','quotation'].includes(page))mailPage(page);if(page==='quote')quotePage();
window.DemoApp={getState:()=>batch?structuredClone(batch):null,scenario:seed,validTax};
})();
</script></body></html>
