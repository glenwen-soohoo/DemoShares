function info(){const f=[['客戶名稱',app.customerName],['客戶類型',TYPES[app.customerType]+(app.customerType==='other'?'・'+app.customerTypeOther:'')],['統一編號',app.taxId],['公司抬頭',app.companyTitle||'未填寫'],['聯繫窗口',app.contactName],['聯繫電話',app.contactPhone],['公司地址',app.address],['E-Mail',app.email],['備註',app.remark||'未填寫']];return '<dl class="definition">'+f.map(([n,v])=>`<div class="${n==='公司地址'||n==='備註'?'full':''}"><dt>${n}</dt><dd>${esc(v)}</dd></div>`).join('')+'</dl>'}
function fresh(){return {scenario:'normal',selected:[...app.templateIds],parts:[],phase:'pending',files:true,wait:false,sentAt:null,attempts:[],stage:'',supplementaryText:'',quoteDate:DATE,validUntil:VALID}}
function group(ids,large=false){const fs=T.filter(t=>ids.includes(t.id)).map(t=>({...t,size:large?t.size*2.6:t.size}));const sum=x=>x.reduce((a,t)=>a+t.size,0);if(sum(fs)<=7168)return[{no:1,status:'ready',files:fs}];for(let m=1;m<(1<<fs.length)-1;m++){const a=fs.filter((_,i)=>m&(1<<i)),b=fs.filter((_,i)=>!(m&(1<<i)));if(sum(a)<=7168&&sum(b)<=7168)return[{no:1,status:'ready',files:a},{no:2,status:'ready',files:b}]}return[]}
function state(){if(batch.parts.length&&batch.parts.every(p=>p.status==='accepted'))return'sent';if(['invalid','locked','disabled'].includes(batch.phase))return batch.phase;if(['preparing','mailing'].includes(batch.phase))return batch.phase;if(batch.parts.some(p=>p.status==='unknown'))return'unknown';if(!batch.files)return'expired';if(batch.parts.some(p=>p.status==='rejected'))return batch.parts.some(p=>p.status==='accepted')?'partial':'failed';return batch.parts.length?'ready':'pending'}
function save(){write(BATCH,batch)}
function seed(n){reviewError='';epoch++;app=structuredClone(SAMPLE);write(KEY,app);batch=fresh();batch.scenario=n;scenario=n;if(n==='soup'){batch.selected=batch.selected.filter(id=>id!==3);batch.supplementaryText=SOUP_NOTE;}if(n==='sent')batch.parts=group(batch.selected);if(['two','partial','unknown','waiting','unknownExpired','cleared'].includes(n))batch.parts=group(batch.selected,true);if(['partial','unknown','waiting','unknownExpired'].includes(n)){batch.parts.forEach((p,i)=>p.status=i===0?'accepted':n==='partial'?'rejected':'unknown');batch.attempts=batch.parts.map(()=>1);batch.phase='prepared';batch.wait=n==='waiting';if(n==='unknownExpired')batch.files=false}if(n==='two')batch.parts=[];if(n==='failed'){batch.parts=group(batch.selected);batch.parts[0].status='rejected';batch.attempts=[1]}if(n==='ready')batch.parts=group(batch.selected);if(n==='expired')batch.files=false;if(['sent','cleared'].includes(n)){batch.parts.forEach(p=>p.status='accepted');batch.sentAt='2026/11/16 10:42';batch.attempts=batch.parts.map(()=>1);batch.files=n!=='cleared'}if(['invalid','locked','disabled'].includes(n))batch.phase=n;save();reviewRender()}
function partHtml(){const labels={ready:'尚未寄送',mailing:'寄送中…',accepted:'已寄出',rejected:'寄送失敗',unknown:'寄送結果不明'};return '<div class="parts">'+batch.parts.map(p=>`<div class="part"><div class="part-header"><span class="part-name">第 ${p.no}／${batch.parts.length} 封</span><span class="part-result ${p.status}">${labels[p.status]}</span></div><span class="note">${p.files.length} 個附件・約 ${(p.files.reduce((a,t)=>a+t.size,0)/1024).toFixed(2)} MB</span><ul>${p.files.map(t=>'<li>'+t.name+'</li>').join('')}</ul>${p.status==='unknown'?`<div class="actions"><button class="button small" data-resolve="received" data-part="${p.no}" ${batch.wait?'disabled':''}>已收到此封副本</button><button class="button small" data-resolve="resend" data-part="${p.no}" ${batch.wait||!batch.files?'disabled':''}>確認未收到</button></div>${batch.wait?'<p class="note" style="margin-top:8px">寄送仍在確認中，請於 10:57 後再確認結果。</p>':!batch.files?'<p class="note" style="margin-top:8px">原檔已過保存期，仍可確認已收到的副本，無法重寄。</p>':''}`:''}</div>`).join('')+'</div>'}

function previewMail(){const parts=batch.parts.length?batch.parts:group(batch.selected,scenario==='two');if(!parts.length||!batch.selected.length){reviewError='請至少保留一份報價單';reviewRender();return}window.B2BUI.renderMailPreview({app,batch:structuredClone(batch),parts:structuredClone(parts),terms:TERMS})}
async function send(){if(['mailing','preparing','sent','unknown','expired','disabled','locked'].includes(state()))return;const run=++epoch;if(!batch.selected.length){reviewError='請至少保留一份報價單';reviewRender();return}const sleep=ms=>new Promise(r=>setTimeout(r,ms));if(!batch.parts.length){batch.frozenSupplementaryText=batch.supplementaryText||'';batch.phase='preparing';batch.stage='正在產生報價單與檢查附件大小。';save();reviewRender();await sleep(450);if(run!==epoch)return;batch.parts=group(batch.selected,scenario==='two');if(!batch.parts.length){batch.phase='pending';reviewRender();return}batch.attempts=batch.parts.map(()=>0);batch.stage=batch.parts.length===2?'附件已拆成兩封，將依序寄出。':'附件已準備完成。';batch.phase='prepared';save();reviewRender();await sleep(350);if(run!==epoch)return}for(const p of batch.parts){if(p.status==='accepted')continue;if(p.status==='unknown')break;batch.phase='mailing';p.status='mailing';batch.attempts[p.no-1]=(batch.attempts[p.no-1]||0)+1;batch.stage=`正在寄送第 ${p.no}／${batch.parts.length} 封。`;save();reviewRender();await sleep(500);if(run!==epoch)return;p.status='accepted';batch.phase='prepared';save();reviewRender()}if(batch.parts.every(p=>p.status==='accepted'))batch.sentAt='2026/11/16 10:42';batch.phase='prepared';save();reviewRender()}
function resolveDialog(mode,no){const p=batch.parts.find(p=>p.no===no);if(!p||p.status!=='unknown'||batch.wait||mode==='resend'&&!batch.files)return;window.B2BUI.renderConfirm({mode,no,count:batch.parts.length,onConfirm:()=>{p.status=mode==='received'?'accepted':'ready';batch.phase='prepared';if(batch.parts.every(p=>p.status==='accepted'))batch.sentAt='2026/11/16 10:57';save();reviewRender()}})}
function mailPage(kind){const notice=kind==='notice';batch=read(BATCH,null);const originalApp=structuredClone(app),originalBatch=batch?structuredClone(batch):null;
function renderMailScenario(mode='current'){let previewApp=originalApp,previewBatch=originalBatch;const part=+(new URLSearchParams(location.search).get('part')||1);
if(mode==='soup'){previewApp=structuredClone(SAMPLE);const note=SOUP_NOTE;previewBatch={selected:[1,2,4,5],supplementaryText:note,frozenSupplementaryText:note,validUntil:VALID,parts:group([1,2,4,5],false)};}
const parts=previewBatch?.parts?.length?previewBatch.parts:group(previewBatch?.selected?.length?previewBatch.selected:previewApp.templateIds,false),current=parts.find(p=>p.no===part)||parts[0],subject=notice?'【B2B 合作申請】'+previewApp.customerName:'無毒農粥寶寶 B2B 報價單｜'+previewApp.customerName+(parts.length>1?`（${current.no}/${parts.length}）`:'');window.B2BUI.renderMail({kind,app:previewApp,batch:previewBatch,templates:T,parts,current,subject,terms:TERMS});}
renderMailScenario();$('#tools').innerHTML=panel(notice?'mail':'quotation');if(!notice)$('#scenario').onchange=e=>renderMailScenario(e.target.value);}

function quotePage(){const id=+(new URLSearchParams(location.search).get('templateId')||1),template=T.find(x=>x.id===id)||T[0];window.B2BUI.renderQuote({app,id,template});$('#tools').innerHTML=panel('quote')}
const nav=$('.mobile-menu-toggle');if(nav)nav.onclick=()=>{const open=$('.baby-nav').classList.toggle('open');nav.setAttribute('aria-expanded',String(open));nav.textContent=open?'關閉選單':'選單'};
const page=document.body.dataset.page;if(page==='apply')formPage();if(page==='review')reviewPage();if(['notice','quotation'].includes(page))mailPage(page);if(page==='quote')quotePage();
window.DemoApp={getState:()=>batch?structuredClone(batch):null,scenario:seed,validTax};
})();
</script></body></html>
