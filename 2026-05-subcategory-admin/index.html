  "layoutConfiguration": {"menuItems":[{"key":1,"children":[{"title":"品牌理念","url":"/Home/AboutNew"},{"title":"團隊介紹","url":"/Home/AboutTeam"},{"title":"好農推薦","url":"/Activity/RecommendFarmer"},{"title":"安心檢驗日報","url":"/Home/DailyReport"},{"title":"企業送禮","url":"/Activity/CompanyGift"}],"title":"關於無毒農","url":"/Home/AboutNew"},{"key":2,"children":[{"title":"關於粥寶寶","url":"/BabyFood"},{"title":"購買粥寶寶","url":"/Products/Kitchenette"}],"title":"粥寶寶","url":"/BabyFood"},{"key":3,"children":[{"title":"關於益菓保","url":"/Eaglebabee"},{"title":"購買益菓保","url":"/Products/Eaglebabee"},{"title":"保健知識","url":"/Blog/BlogNew?CategoryId=4153"},{"title":"購物須知","url":"https://greenbox.tw/Blog/BlogPostNew/7766/"}],"title":"益菓保","url":"/Eaglebabee"},{"key":4,"children":[{"title":"關於綠時光","url":"/Activity/GreenSmoothie"},{"title":"購買綠時光","url":"/Products/GreenSmoothie"}],"title":"綠時光","url":"/Activity/GreenSmoothie","tag":"NEW!"},{"key":5,"children":[{"title":"新品快報","url":"/Products/ItemNew#new"},{"title":"人氣商品","url":"/Products/ItemNew#popular-items"},{"title":"在地小農","url":"/Products/ItemNew#hot"},{"title":"安心時蔬","url":"/Products/ItemNew#Safe-Vegetables"},{"title":"進口菁品","url":"/Products/ItemNew#import"},{"title":"嚴選好物","url":"/Products/ItemNew#pre-order"},{"title":"送禮專區","url":"/Products/ItemNew#gift"},{"title":"水產直送","url":"/Products/ItemNew#seafood"}],"title":"產地直送(免運)","url":"/Products/ItemNew"},{"key":6,"children":[{"title":"熱銷排行","url":"/Products/FrozenFood#best-sellers"},{"title":"端午專區","url":"/Products/FrozenFood#festival-dumplings"},{"title":"鎖管季","url":"/Products/FrozenFood#season"},{"title":"澎湖嚴選","url":"/Products/FrozenFood#penghu","tag":"Hot"}],"title":"冷凍超市","url":"/Products/FrozenFood"}]}

<script type="text/babel" data-presets="react">
const {
  Layout, Menu, Card, Tabs, Table, Button, Switch, Tag, Modal, Form, Input, Select,
  InputNumber, Space, Alert, ConfigProvider, Segmented, Typography, Divider,
  Radio, App: AntApp, message, theme, Badge, Checkbox, Tooltip, Drawer,
  Row, Col
} = antd;
const { Header, Sider, Content } = Layout;
const { Title, Text } = Typography;
const Icons = window.icons || {};
const {
  DashboardOutlined, ShoppingCartOutlined, AppstoreOutlined, FolderOpenOutlined,
  UserOutlined, BellOutlined, SettingOutlined, LogoutOutlined,
  PlusOutlined, SwapOutlined, HolderOutlined, EditOutlined, DeleteOutlined,
  SaveOutlined, CloseOutlined, LinkOutlined, EyeOutlined, StarFilled, InfoCircleOutlined
} = Icons;

const { useState, useMemo, useRef, useEffect } = React;

const REAL = JSON.parse(document.getElementById('real-data').textContent);
const PRODUCT_LINES = REAL.productLines;
// 規範：display=false 的 sort 一律為 null（「隱藏=無排序」），避免跟顯示中的 sort 數字重疊
const SUB_CATEGORIES_ALL = REAL.subCategories.map(r => r.display ? r : { ...r, sort: null });
const GREEN_SMOOTHIE_IDS_INIT = REAL.greenSmoothieIds;
const LAYOUT_CONFIG = REAL.layoutConfiguration;

// ============== 產線詳細頁 ==============
function ProductLineDetail({ line, data, setData, greenSmoothieIds, setGreenSmoothieIds }) {
  const [typeFilter, setTypeFilter] = useState('all');
  const [displayFilter, setDisplayFilter] = useState('all'); // 預設全部（隱藏的 sort=null 會排表尾，不會干擾顯示中）
  const [sortMode, setSortMode] = useState(false);
  const [sortDraft, setSortDraft] = useState(null);
  const [editing, setEditing] = useState(null);
  const [editVisible, setEditVisible] = useState(false);
  const [navPreviewOpen, setNavPreviewOpen] = useState(false);
  const [form] = Form.useForm();
  const dragRow = useRef(null);

  // 切產線時 reset
  useEffect(() => {
    setSortMode(false); setSortDraft(null);
    setTypeFilter('all'); setDisplayFilter('all');
  }, [line.key]);

  // 此產線的子分類。排序邏輯：display=true 優先（依 sort 升、id 升 tie-break），display=false 排最後（依 id 升）
  const myData = useMemo(() => {
    let baseRows = data.filter(r => r.cat === line.id);
    if (line.key === 'baby')  baseRows = baseRows.filter(r => !greenSmoothieIds.includes(r.id));
    if (line.key === 'green') baseRows = baseRows.filter(r =>  greenSmoothieIds.includes(r.id));
    return [...baseRows].sort((a, b) => {
      if (a.display !== b.display) return a.display ? -1 : 1;
      if (a.display) return (a.sort ?? Infinity) - (b.sort ?? Infinity) || a.id - b.id;
      return a.id - b.id;
    });
  }, [data, line.key, line.id, greenSmoothieIds]);

  const filtered = useMemo(() => {
    let rows = myData;
    if (typeFilter !== 'all') rows = rows.filter(r => r.type === Number(typeFilter));
    if (displayFilter === 'yes') rows = rows.filter(r => r.display);
    if (displayFilter === 'no')  rows = rows.filter(r => !r.display);
    return rows;
  }, [myData, typeFilter, displayFilter]);

  const list = sortMode ? sortDraft : filtered;

  // 進排序模式：鎖「全部類型 + 顯示中+隱藏」。隱藏的 sort 維持 null，但可順手切換上下架
  const enterSortMode = () => {
    setTypeFilter('all');
    setDisplayFilter('all');
    setSortDraft([...myData]);
    setSortMode(true);
  };
  const cancelSort = () => { setSortMode(false); setSortDraft(null); };
  const saveSort = () => {
    // 只重新編號 sortDraft 內「顯示中」的子分類；隱藏的 sort 統一設為 null
    const displayedInOrder = sortDraft.filter(r => r.display);
    const updateMap = new Map(displayedInOrder.map((r, i) => [r.id, i + 1]));
    const draftIds = new Set(sortDraft.map(r => r.id));
    const next = data.map(r => {
      if (!draftIds.has(r.id)) return r;
      const draftRow = sortDraft.find(x => x.id === r.id);
      return {
        ...r,
        display: draftRow.display,
        sort: draftRow.display ? updateMap.get(r.id) : null,
      };
    });
    setData(next);
    message.success('排序已儲存，已清除前台快取');
    setSortMode(false); setSortDraft(null);
  };

  // 排序模式下切換 display：只改 sortDraft 暫存，儲存後一併處理 sort 與快取
  const toggleDisplayInSort = (rowId, val) => {
    setSortDraft(sortDraft.map(r => r.id === rowId ? { ...r, display: val } : r));
  };

  const onDragStart = (e, idx) => { dragRow.current = idx; e.dataTransfer.effectAllowed = 'move'; };
  const onDragOver = (e, idx) => {
    e.preventDefault();
    if (dragRow.current === null || dragRow.current === idx) return;
    const next = [...sortDraft];
    const [moved] = next.splice(dragRow.current, 1);
    next.splice(idx, 0, moved);
    dragRow.current = idx;
    setSortDraft(next);
  };

  // 計算下一個自動分配的 ProductType（同產線 type=1 的 max pt + 1）
  const nextProductType = useMemo(() => {
    const sameTypeRows = data.filter(r => r.cat === line.id && r.type === 1 && r.pt != null);
    if (sameTypeRows.length === 0) return 0;
    return Math.max(...sameTypeRows.map(r => r.pt)) + 1;
  }, [data, line.id]);

  const openAdd = () => {
    setEditing(null);
    form.resetFields();
    form.setFieldsValue({
      type: 1, display: true, isPreOrder: false,
      isGreenSmoothie: line.key === 'green' ? true : false,
    });
    setEditVisible(true);
  };
  const openEdit = (row) => {
    setEditing(row);
    form.setFieldsValue({
      ...row,
      isGreenSmoothie: greenSmoothieIds.includes(row.id),
    });
    setEditVisible(true);
  };

  const submitForm = () => {
    form.validateFields().then(values => {
      const isNowGreenSmoothie = !!values.isGreenSmoothie;
      const pt = values.type === 1 ? (editing ? editing.pt : nextProductType) : null;
      const newDisplay = !!values.display;
      const oldDisplay = editing ? editing.display : false;
      const becomeShown = newDisplay && !oldDisplay; // 新增或從隱藏切到顯示
      const becomeHidden = !newDisplay && oldDisplay; // 從顯示切到隱藏

      // sort 規則：新上架（新增 or 隱藏→顯示）一律 sort=0，自動排到最前面，營運再用「調整排序」拖移到正確位置
      // 下架時 sort=null；其他情況維持原值
      let ownSort = editing ? editing.sort : null;
      if (becomeShown) ownSort = 0;
      else if (becomeHidden) ownSort = null;

      const cleaned = {
        name: values.name, type: values.type, en: values.en,
        desc: values.desc || '', isPreOrder: !!values.isPreOrder,
        display: newDisplay, pt, sort: ownSort,
      };

      if (editing) {
        setData(data.map(r => r.id === editing.id ? { ...r, ...cleaned } : r));
        if (line.showGreenSmoothieField) {
          const inWhitelist = greenSmoothieIds.includes(editing.id);
          if (isNowGreenSmoothie && !inWhitelist) {
            setGreenSmoothieIds([...greenSmoothieIds, editing.id]);
          } else if (!isNowGreenSmoothie && inWhitelist) {
            setGreenSmoothieIds(greenSmoothieIds.filter(id => id !== editing.id));
          }
        }
        message.success(becomeShown ? '已儲存並上架（排在最前面，可用「調整排序」拖移調整），前台快取已清除' :
                        becomeHidden ? '已儲存並下架，前台快取已清除' :
                        '已儲存子分類設定');
      } else {
        const newId = Date.now();
        const newRow = { ...cleaned, id: newId, cat: line.id };
        setData([...data, newRow]);
        if (line.showGreenSmoothieField && isNowGreenSmoothie) {
          setGreenSmoothieIds([...greenSmoothieIds, newId]);
        }
        message.success('已新增子分類（排在最前面，可用「調整排序」拖移調整），前台快取已清除');
      }
      setEditVisible(false);
    });
  };
  const handleDelete = () => {
    Modal.confirm({
      title: `確定要刪除「${editing.name}」嗎？`,
      content: '刪除後將無法復原，系統會自動清除前台快取。',
      okText: '刪除', okButtonProps: { danger: true }, cancelText: '取消',
      onOk: () => {
        setData(data.filter(r => r.id !== editing.id));
        setGreenSmoothieIds(greenSmoothieIds.filter(id => id !== editing.id));
        message.success('已刪除');
        setEditVisible(false);
      },
    });
  };
  const toggleDisplay = (row, val) => {
    setData(data.map(r => r.id === row.id ? { ...r, display: val } : r));
  };

  // 導航欄預覽：對應的 menuItems 主項目
  const navMain = useMemo(() => {
    if (!line.hasNavPreview) return null;
    return (LAYOUT_CONFIG.menuItems || []).find(m => m.key === line.navKey);
  }, [line]);

  // 導航欄預覽要列的子項目：永遠是「該產線所有顯示中」的子分類，不受 user filter 影響
  const navItems = useMemo(() => myData.filter(r => r.display), [myData]);

  const columns = [
    ...(sortMode ? [{ title: '', width: 40, render: () => <span className="drag-handle"><HolderOutlined /></span> }] : []),
    { title: '順序', dataIndex: 'sort', width: 60,
      render: (v, row) => {
        if (sortMode) {
          if (!row.display) return <Text type="secondary">—</Text>;
          // 排序模式：算當前 row 在 sortDraft 顯示中部分的位次
          const displayedList = (sortDraft || []).filter(r => r.display);
          const idx = displayedList.findIndex(r => r.id === row.id);
          return <Text strong style={{ color: '#1677ff' }}>{idx + 1}</Text>;
        }
        if (!row.display) return <Text type="secondary">—</Text>;
        return <Text strong style={{ color: '#1677ff' }}>{v}</Text>;
      }
    },
    {
      title: '子分類名稱',
      dataIndex: 'name',
      render: (v, row) => (
        <Space direction="vertical" size={0}>
          <Text strong>{v}</Text>
          {row.desc && <Text type="secondary" style={{ fontSize: 12 }}>{row.desc}</Text>}
        </Space>
      ),
    },
    {
      title: '類型', dataIndex: 'type', width: 130,
      render: (v, row) => v === 1
        ? <Tag color="blue">一般 #{row.pt}</Tag>
        : <Tag color="purple">關鍵字</Tag>,
    },
    { title: '英文錨點', dataIndex: 'en', width: 170, render: v => <Text style={{ fontSize: 13, fontFamily: "'Roboto Mono', monospace", color: '#555' }}>{v}</Text> },
    {
      title: '前台顯示', dataIndex: 'display', width: 100,
      render: (v, row) => {
        if (sortMode) {
          // 排序模式下可直接切換上下架，儲存時一併套用
          return <Switch size="small" checked={v}
            checkedChildren="顯示中" unCheckedChildren="隱藏"
            onChange={(val) => toggleDisplayInSort(row.id, val)} />;
        }
        return v
          ? <Tag style={{ background: '#52c41a', color: '#fff', border: 'none' }}>顯示中</Tag>
          : <Tag>隱藏</Tag>;
      },
    },
    {
      title: '操作', width: 80,
      render: (_, row) => (
        <Button type="link" size="small" icon={<EditOutlined />} disabled={sortMode} onClick={() => openEdit(row)}>編輯</Button>
      ),
    },
  ];

  return (
    <div>
      <div className="product-line-info">
        <div><div className="label">產線名稱</div><div className="value">{line.name}</div></div>
        <div><div className="label">Type</div><div className="value">#{line.productType}</div></div>
        <div><div className="label">對應前台 URL</div><div className="value" style={{ fontFamily: 'Roboto Mono, monospace', fontSize: 13 }}>
          <LinkOutlined /> {line.url}
        </div></div>
        <div><div className="label">子分類總數</div><div className="value">
          {myData.length} <Text type="secondary" style={{ fontSize: 12, fontWeight: 'normal' }}>（{myData.filter(r => r.display).length} 顯示中）</Text>
        </div></div>
        <div className="preview-btn-cell">
          {line.hasNavPreview && (
            <Button icon={<EyeOutlined />} onClick={() => setNavPreviewOpen(true)}>預覽導航欄</Button>
          )}
        </div>
      </div>

      <Space style={{ marginBottom: 12, display: 'flex', justifyContent: 'space-between', width: '100%', flexWrap: 'wrap' }}>
        <Space wrap>
          <Segmented options={[
            { label: `全部（${myData.length}）`, value: 'all' },
            { label: `一般（${myData.filter(r => r.type === 1).length}）`, value: '1' },
            { label: `關鍵字（${myData.filter(r => r.type === 2).length}）`, value: '2' },
          ]} value={typeFilter} onChange={setTypeFilter} disabled={sortMode} />
          <Segmented options={[
            { label: '顯示中+隱藏', value: 'all' },
            { label: '僅顯示中', value: 'yes' },
            { label: '僅隱藏', value: 'no' },
          ]} value={displayFilter} onChange={setDisplayFilter} disabled={sortMode} />
        </Space>
        <Space>
          <Button icon={<PlusOutlined />} type="primary" disabled={sortMode} onClick={openAdd}>新增子分類</Button>
          {!sortMode
            ? <Button icon={<SwapOutlined />} onClick={enterSortMode}>調整排序</Button>
            : (<Space>
                <Button icon={<CloseOutlined />} onClick={cancelSort}>取消</Button>
                <Button icon={<SaveOutlined />} type="primary" onClick={saveSort}>儲存排序</Button>
              </Space>)
          }
        </Space>
      </Space>

      <Table rowKey="id" columns={columns} dataSource={list}
        pagination={{ pageSize: 30, showSizeChanger: false }}
        size="middle"
        onRow={(_, idx) => sortMode ? ({
          draggable: true,
          onDragStart: (e) => onDragStart(e, idx),
          onDragOver: (e) => onDragOver(e, idx),
          onDragEnd: () => { dragRow.current = null; },
        }) : {}}
      />

      {/* 新增/編輯 Modal */}
      <Modal
        title={`${editing ? '編輯' : '新增'}子分類 — ${line.name}`}
        open={editVisible}
        onCancel={() => setEditVisible(false)}
        width={560}
        footer={
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <div>
              {editing && (
                <Button danger icon={<DeleteOutlined />} onClick={handleDelete}>刪除此子分類</Button>
              )}
            </div>
            <Space>
              <Button onClick={() => setEditVisible(false)}>取消</Button>
              <Button type="primary" onClick={submitForm}>{editing ? '儲存' : '新增'}</Button>
            </Space>
          </div>
        }
      >
        <Form form={form} layout="vertical" style={{ marginTop: 12 }}>
          <Form.Item name="name" label="子分類名稱" rules={[{ required: true, message: '必填' }, { max: 50 }]}>
            <Input placeholder="例：秋季吃鍋" />
          </Form.Item>

          <Row gutter={16}>
            <Col span={line.showGreenSmoothieField ? 14 : 24}>
              <Form.Item name="type" label="類型" rules={[{ required: true }]}
                extra={editing ? '已建立子分類無法修改類別。' : '建立後不可改動類別。'}>
                <Radio.Group disabled={!!editing}>
                  <Radio value={1}>一般子分類</Radio>
                  <Radio value={2}>關鍵字子分類</Radio>
                </Radio.Group>
              </Form.Item>
            </Col>
            {line.showGreenSmoothieField && (
              <Col span={10}>
                <Form.Item name="isGreenSmoothie" label="顯示位置" valuePropName="checked">
                  <Checkbox disabled={!editing && line.key === 'green'}>
                    <StarFilled style={{ color: '#52c41a' }} /> 顯示在綠時光頁
                  </Checkbox>
                </Form.Item>
              </Col>
            )}
          </Row>

          {!editing && (
            <Form.Item noStyle shouldUpdate={(p, c) => p.type !== c.type}>
              {({ getFieldValue }) => getFieldValue('type') === 1 && (
                <Form.Item label="Type2">
                  <Input value={nextProductType} disabled
                    addonAfter={<Text type="secondary" style={{ fontSize: 12 }}>系統自動分配（同產線 Type2 最大值 +1）</Text>} />
                </Form.Item>
              )}
            </Form.Item>
          )}

          <Form.Item name="en" label="英文錨點 (EnglishName)" rules={[
            { required: true, message: '必填，前台網址錨點用' },
            { pattern: /^[a-zA-Z0-9-]+$/, message: '只允許英文、數字、連字號' },
            {
              validator: async (_, value) => {
                if (!value) return;
                const dup = data.find(r =>
                  r.cat === line.id &&
                  r.id !== editing?.id &&
                  (r.en || '').toLowerCase() === value.toLowerCase()
                );
                if (dup) {
                  throw new Error(`此英文錨點已被「${dup.name}」(${dup.display ? '顯示中' : '隱藏'}) 使用，請改用其他名稱`);
                }
              }
            }
          ]}>
            <Input placeholder="例：fall-hotpot" />
          </Form.Item>

          <Form.Item name="desc" label="描述" extra="顯示在前台子分類名稱下方，可留空。">
            <Input placeholder="例：精選鍋物 6 折起" maxLength={100} showCount />
          </Form.Item>

          <Divider style={{ margin: '12px 0' }} />

          <Form.Item name="isPreOrder" label="預購商品" valuePropName="checked"
            extra="預購商品不可與一般商品子分類混合結帳。">
            <Switch checkedChildren="預購" unCheckedChildren="一般" />
          </Form.Item>

          <Form.Item name="display" label="前台顯示" valuePropName="checked">
            <Switch checkedChildren="顯示中" unCheckedChildren="隱藏" />
          </Form.Item>
        </Form>
      </Modal>

      {/* 導航欄預覽 Drawer */}
      <Drawer
        title={navMain ? `導航欄預覽 — ${navMain.title}` : '導航欄預覽'}
        placement="right"
        width={520}
        open={navPreviewOpen}
        onClose={() => setNavPreviewOpen(false)}
      >
        {navMain && (
          <>
            <div style={{ marginBottom: 12 }}>
              <Text strong style={{ fontSize: 15 }}>{navMain.title}</Text>
              {navMain.tag && <Tag color="red" style={{ marginLeft: 8 }}>{navMain.tag}</Tag>}
              <div style={{ fontFamily: 'Roboto Mono, monospace', fontSize: 12, color: '#888', marginTop: 4 }}>
                <LinkOutlined /> {navMain.url}
              </div>
            </div>
            <Divider style={{ margin: '12px 0' }} />
            <Text type="secondary" style={{ fontSize: 13 }}>子項目（共 {navItems.length} 個 / 顯示中）</Text>
            <div style={{ marginTop: 8 }}>
              {navItems.map((r, i) => (
                <div key={r.id} className="nav-preview-item">
                  <span className="sort-num">{i + 1}</span>
                  <Text strong style={{ flex: 1 }}>{r.name}</Text>
                  <Text style={{ fontFamily: 'Roboto Mono, monospace', fontSize: 12, color: '#888' }}>
                    {line.url}#{r.en}
                  </Text>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 16, padding: '10px 14px', background: '#fafafa', border: '1px solid #f0f0f0', borderRadius: 6, color: '#666', fontSize: 13 }}>
              此預覽自動從目前顯示中的子分類產生
            </div>
          </>
        )}
      </Drawer>
    </div>
  );
}

// ============== Layout ==============
function App() {
  const [collapsed, setCollapsed] = useState(false);
  const [currentTab, setCurrentTab] = useState('baby');
  const [data, setData] = useState(SUB_CATEGORIES_ALL);
  const [greenSmoothieIds, setGreenSmoothieIds] = useState(GREEN_SMOOTHIE_IDS_INIT);

  const sideMenuItems = [
    { key: 'home', icon: <DashboardOutlined />, label: '首頁' },
    { key: 'orders', icon: <ShoppingCartOutlined />, label: '訂單處理' },
    { key: 'products', icon: <AppstoreOutlined />, label: '商品管理' },
    { key: 'category', icon: <FolderOpenOutlined />, label: '分類與導航管理' },
    { key: 'members', icon: <UserOutlined />, label: '會員管理' },
    { key: 'events', icon: <BellOutlined />, label: '活動管理' },
    { key: 'settings', icon: <SettingOutlined />, label: '系統設定' },
  ];

  const topTabItems = PRODUCT_LINES.map(l => ({
    key: l.key,
    label: <span>
      {l.key === 'green' && <StarFilled style={{ color: '#52c41a', marginRight: 4 }} />}
      {l.name}
    </span>,
  }));

  const currentLine = PRODUCT_LINES.find(l => l.key === currentTab);

  return (
    <ConfigProvider
      theme={{
        token: {
          colorPrimary: '#1677ff',
          colorSuccess: '#3C8C3C',
          colorWarning: '#faad14',
          colorError: '#c62d1f',
          borderRadius: 6,
          fontFamily: "'Noto Sans TC', 'Microsoft JhengHei', -apple-system, sans-serif",
        },
      }}>
      <AntApp>
        <Layout style={{ minHeight: '100vh' }}>
          <Sider collapsible collapsed={collapsed} onCollapse={setCollapsed} theme="dark" width={240}>
            <div style={{ height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '1px solid #1f2937' }}>
              <span className="brand-logo" style={{ fontSize: collapsed ? 16 : 20 }}>{collapsed ? '無毒' : '無毒農'}</span>
            </div>
            <Menu theme="dark" mode="inline" selectedKeys={['category']} items={sideMenuItems} />
          </Sider>
          <Layout>
            <Header style={{ background: '#D7F4DA', padding: '0 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #d1d2cf' }}>
              <Text strong style={{ fontSize: 16, color: '#2a3542' }}>後台管理系統</Text>
              <Space size={20}>
                <Space size={6}><UserOutlined style={{ color: '#666' }} /><Text style={{ color: '#666' }}>王小明</Text></Space>
                <Button type="text" icon={<LogoutOutlined />} style={{ color: '#666' }}>登出</Button>
              </Space>
            </Header>
            <Content style={{ padding: 24, background: '#f5f5f5' }}>
              <div style={{ marginBottom: 16 }}>
                <Title level={3} style={{ margin: 0 }}>分類與導航管理</Title>
              </div>
              <Tabs activeKey={currentTab} onChange={setCurrentTab} size="large"
                items={topTabItems} style={{ marginBottom: 0 }}
                tabBarStyle={{ marginBottom: 0 }} />
              <Card style={{ borderTopLeftRadius: 0 }}>
                {currentLine && (
                  <ProductLineDetail key={currentTab} line={currentLine}
                    data={data} setData={setData}
                    greenSmoothieIds={greenSmoothieIds} setGreenSmoothieIds={setGreenSmoothieIds} />
                )}
              </Card>
            </Content>
          </Layout>
        </Layout>
      </AntApp>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
