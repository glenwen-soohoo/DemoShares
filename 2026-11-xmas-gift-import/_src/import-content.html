/* ── 預覽彈窗：上傳後先看要改什麼，按下確認才寫入 ─────────────────────── */
const ImportPreviewModal = ({ data, open, onCancel, onConfirm, confirming }) => {
  if (!data) return null;

  const addedCount = data.added.length + data.addedMore;
  const updatedCount = data.updated.length + data.updatedMore;
  const takenCount = data.taken.length;
  const willWrite = addedCount + updatedCount;

  const tabs = [];
  if (addedCount > 0) {
    tabs.push({
      key: 'added',
      label: `新增 ${addedCount}`,
      children: (
        <Table rowKey="no" size="small" columns={addedColumns} dataSource={data.added}
          pagination={false}
          footer={data.addedMore ? () => <span className="xi-hint">另有 {data.addedMore} 筆新增未列出</span> : undefined} />
      ),
    });
  }
  if (updatedCount > 0) {
    tabs.push({
      key: 'updated',
      label: `將更新 ${updatedCount}`,
      children: (
        <Table rowKey="no" size="small" columns={diffColumns} dataSource={data.updated}
          pagination={false}
          footer={data.updatedMore ? () => <span className="xi-hint">另有 {data.updatedMore} 筆變更未列出，確認後一併更新</span> : undefined} />
      ),
    });
  }
  if (takenCount > 0) {
    tabs.push({
      key: 'taken',
      label: `不套用更新 ${takenCount}`,
      children: (
        <div>
          <Alert type="warning" showIcon style={{ marginBottom: 12 }}
            message="這幾筆已經有人認購，檔案裡的內容不會寫入" />
          <Table rowKey="no" size="small" columns={diffColumns} dataSource={data.taken} pagination={false} />
        </div>
      ),
    });
  }
  if (data.identical > 0) {
    tabs.push({
      key: 'identical',
      label: `內容相同 ${data.identical}`,
      children: (
        <Alert type="success" showIcon
          message={`${data.identical} 筆與現有資料完全相同，不會重複建立，也不會寫入。`} />
      ),
    });
  }

  return (
    <Modal
      open={open}
      title="確認匯入內容"
      width={880}
      onCancel={onCancel}
      footer={[
        <Button key="cancel" onClick={onCancel}>取消，不寫入</Button>,
        <Button key="ok" type="primary" loading={confirming} disabled={willWrite === 0} onClick={onConfirm}>
          {willWrite === 0 ? '沒有要寫入的資料' : `確認寫入（更新 ${updatedCount}、新增 ${addedCount}）`}

          <span className="xi-scope">寫入範圍 <b>{CAMPAIGN.label}</b>（出貨日 {CAMPAIGN.ordersTime}）</span>

        </Col>
        <Col span={5}>
          <Card size="small">
            <Statistic title="新增" value={addedCount} valueStyle={addedCount ? { color: '#237804' } : undefined} />
          </Card>
        </Col>
        <Col span={5}>

            <Statistic title="將更新" value={updatedCount} valueStyle={updatedCount ? { color: '#d48806' } : undefined} />
          </Card>
        </Col>
        <Col span={5}>

  };

  const filteredItems = useMemo(() => ITEMS.filter((it) => {
    if (statusFilter !== 'all' && statusOf(it) !== statusFilter) return false;
    if (keyword.trim() && !it.Name.includes(keyword.trim())) return false;
    return true;
  }), [statusFilter, keyword]);

  const selectableCount = filteredItems.filter(canSelect).length;

  const columns = [
    { title: '狀態', width: 110, render: (_, r) => statusTag(statusOf(r)) },
    { title: '商品名稱', dataIndex: 'Name' },
    { title: '開賣時間', dataIndex: 'Start', width: 170 },
    { title: '庫存量', dataIndex: 'Origin', width: 100 },
    { title: '剩餘', dataIndex: 'Stock', width: 80 },
    { title: '商品編號', dataIndex: 'Pid', width: 100 },
    { title: '操作', width: 90, render: (_, r) => <Button size="small" onClick={() => setEditingItem(r)}>換圖</Button> },
  ];

  return (
    <ConfigProvider theme={theme}>
      <SummaryCards />

      {/* 批次作業：匯入整批小禮物、回收失敗名額 */}
      <Card size="small" style={{ marginBottom: 16 }}>
        <Space wrap>
          <Button icon={<UploadIcon />} loading={isImporting} onClick={runImport}>批次匯入小禮物</Button>
          <Tooltip title="沿用歷年的匯入檔（欄位：編號｜產品名稱｜開始販售時間｜產品圖檔名）。⛔ 圖片本身由技術端另外上傳，這裡只讀名單、並會檢查對應圖檔是否都已上傳。上傳後會先列出要新增與要更新的內容，確認才寫入。">
            <span style={{ color: 'rgba(0,0,0,.45)', display: 'inline-flex' }}><HelpIcon /></span>
          </Tooltip>
          <span className="xi-scope">寫入範圍 <b>{CAMPAIGN.label}</b>（出貨日 {CAMPAIGN.ordersTime}）</span>

          <Divider type="vertical" />

          <Popconfirm title="重新上架失敗名額"
            description="把付款失敗／逾期未付而卡住的名額釋放回架上，剩餘份數會一併重算。"
            okText="確定執行" cancelText="取消"
            onConfirm={() => message.success('已重新上架 4 筆失敗名額')}>
            <Button>重新上架失敗名額</Button>
          </Popconfirm>
        </Space>
      </Card>

      <Card size="small" style={{ marginBottom: 16 }}>
        <Space wrap>
          <Tooltip title="小禮物是「時間到自己出現」，不需要有人按上架。改開賣時間後前台下一次載入就生效，「立即上架」等於把時間設成現在。標「等待重新上架」的品項可以勾選，改開賣時間會同時把名額放回去。真的被認購的不可調整，勾選框會直接停用。單張圖片有誤可用「換圖」修正，不必重新匯入整批。">
            <span style={{ color: 'rgba(0,0,0,.45)', display: 'inline-flex' }}><HelpIcon /></span>
          </Tooltip>
          <Select value={statusFilter} onChange={setStatusFilter} style={{ width: 140 }}
            options={[
              { value: 'all', label: '全部' },
              { value: 'onShelf', label: '上架中' },
              { value: 'notStarted', label: '尚未開賣' },
              { value: 'taken', label: '已被認購' },
              { value: 'pendingRelist', label: '等待重新上架' },
              { value: 'hidden', label: '已下架' },
            ]} />
          <Input.Search placeholder="搜尋商品名稱或編號" allowClear value={keyword}
            onChange={(e) => setKeyword(e.target.value)} style={{ width: 240 }} />
          <Button disabled={!selectableCount}
            onClick={() => setSelectedKeys(filteredItems.filter(canSelect).map((it) => it.id))}>
            選取篩選結果（{selectableCount} 筆可調整）
          </Button>
          <Button disabled={!selectedKeys.length} onClick={() => setSelectedKeys([])}>清除選取</Button>
          <Button onClick={() => message.success('已重新載入')}>重新載入</Button>
        </Space>
      </Card>

      <Card size="small" style={{ marginBottom: 16 }}>
        <Space wrap>
          <strong>已選取 {selectedKeys.length} 筆</strong>
          <DatePicker showTime={{ format: 'HH:mm' }} format="YYYY/MM/DD HH:mm"
            value={startTime} onChange={setStartTime} placeholder="選擇開賣時間" />
          <Button type="primary" disabled={!selectedKeys.length || !startTime}
            onClick={() => message.success(`已將 ${selectedKeys.length} 筆改為此開賣時間`)}>
            改為此開賣時間
          </Button>
          <Button danger disabled={!selectedKeys.length}
            onClick={() => Modal.confirm({
              title: `確定讓這 ${selectedKeys.length} 筆立即上架？`,
              content: '開賣時間會設成現在，前台下一次載入就會出現。',
              okText: '立即上架', cancelText: '取消',
              onOk: () => message.success('已立即上架'),
            })}>
            立即上架
          </Button>
        </Space>
      </Card>

      <Table rowKey="id" size="small" columns={columns} dataSource={filteredItems}
        pagination={{ pageSize: 100, showSizeChanger: true, showTotal: () => `共 ${SUMMARY.Total} 筆` }}
        locale={{ emptyText: '沒有符合條件的小禮物' }}
        rowSelection={{
          selectedRowKeys: selectedKeys,
          onChange: setSelectedKeys,
          getCheckboxProps: (r) => ({ disabled: !canSelect(r) }),
        }} />

      <ImportPreviewModal data={previewData} open={previewOpen} confirming={confirming}
        onCancel={() => setPreviewOpen(false)} onConfirm={confirmImport} />

      <ImportResultModal data={resultData} open={resultData !== null} onClose={() => setResultData(null)} />

      <PictureModal item={editingItem} open={editingItem !== null} onClose={() => setEditingItem(null)} />

      {/* 驗證未過：整批擋下，一筆都沒進 */}
      <Modal open={errors !== null} title="匯入未完成，請修正以下項目後重新匯入"
        onCancel={() => setErrors(null)} onOk={() => setErrors(null)}
        okText="我知道了" cancelButtonProps={{ style: { display: 'none' } }} width={640}>
        <Alert type="warning" showIcon style={{ marginBottom: 12 }}
          message="這批完全沒有匯入。以下每一項都修正後，再上傳同一份檔案即可。" />
        <div style={{ maxHeight: 360, overflowY: 'auto' }}>
          <ul style={{ paddingLeft: 20, margin: 0 }}>
            {(errors ?? []).map((e, i) => <li key={i} style={{ marginBottom: 4 }}>{e}</li>)}
          </ul>
        </div>
      </Modal>

      <div className="xi-devpanel">
        <h4>情境切換</h4>
        <p>先選這次要上傳的檔案內容，再按「批次匯入小禮物」。</p>
        {SCENARIOS.map((s) => (
          <button key={s.key} className={scenario === s.key ? 'is-on' : ''}
            onClick={() => setScenario(s.key)}>{s.label}</button>
        ))}
      </div>
    </ConfigProvider>
  );
};

ReactDOM.createRoot(document.getElementById('gox-app')).render(<App />);
</script>
