      mk(C(-95, 1), '鱸魚片300g', '澎湖鱸魚片', { storage: '冷凍', qty: '1片', recv: D(-97), insp: D(-95), st: '完成', ps: '上架', done: D(-93), // 過期
        items: items(A('陰性'), B('陰性'), L('陰性'), null), mfg: D(-110), exp: D(-20) }),
      mk(C(-60, 1), '豬肉貢丸600g', '新竹豬肉貢丸', { storage: '冷凍', qty: '1包', recv: D(-61), insp: D(-60), st: '檢驗中', // 處理中但已過期（一直沒做完）

  // 大量：三個分頁都超過一頁（每頁 20 筆），用來看分頁與捲動

    codes.forEach(function (c, k) {
      if (live[c]) return;

      list.push(rec(compact(D(-back)) + '20', c, nameOf(c), { storage: '冷凍', qty: '1包', recv: D(-back - 2), insp: D(-back), st: '完成', ps: '上架', done: D(-back + 1),
        items: items(['大腸桿菌群', '陰性'], ['沙門氏菌', k === 3 ? '不合格' : '陰性'], ['李斯特菌', '陰性'], null), mfg: D(-back - 7), exp: D(90 + k) }));
    });

    for (var j = 0; j < 30; j++) {

        items: items(['大腸桿菌群', '陰性'], ['沙門氏菌', j % 9 === 4 ? '不合格' : '陰性'], ['李斯特菌', '陰性'], null),
        mfg: D(-b2 - 6), exp: j % 2 ? D(-b2 + 60) : D(200 - j) }));

  }

  var SCENARIOS = { empty: function () { return []; }, normal: scenarioNormal, many: scenarioMany };

  function load() {

  var state = load();

  // 回傳 false 表示瀏覽器儲存空間滿了（照片太多），呼叫端要提示
  function save() {

  // 手機拍的照片動輒 3～5MB，先縮到長邊 1280px 的 JPEG 再存（正式版是上傳到圖庫）

  function nextNo() {

    return prefix + pad(n + 1);
  }

  function create(barcode, name, photoSrcs) {
    var t = today();
    var r = rec(nextNo(), barcode, name, { storage: '冷凍', qty: '1包', recv: t, insp: t, st: '待檢驗',
      items: items(['大腸桿菌群'], ['沙門氏菌'], ['李斯特菌'], null) });

  // 從處理中切到「上架」或「不顯示」前要補齊的東西：四個日期都要有、選了項目的都要有結果（2026-10-05 定）

  function allowedNext(r) {

  }

  // 狀態標籤文字與按鈕文字（電腦版、手機版共用）

  function actionLabel(target) { return target === '處理中' ? '改回處理中' : target; }

  }

    ITEMS: ITEMS, RESULTS: RESULTS, STANDARDS: STANDARDS, STORAGES: STORAGES, INSPECT_STATUS: INSPECT_STATUS,

<script>

  function fitReport(root) {

    if (!fit) return;
    if (!fit.clientWidth) return;
    var paper = fit.firstChild, s = Math.min(1, fit.clientWidth / 794);  // paper 是 .rp-doc，內含一或兩頁

      mfgDate: day(-6), expDate: day(180), receivedDate: day(-3), inspectDate: insp, completedAt: day(-1),
      items: [{ item: '大腸桿菌群', result: '陰性' }, { item: '沙門氏菌', result: state === 'fail' ? '不合格' : '陰性' }, { item: '李斯特菌', result: '陰性' }, { item: '', result: '' }],
      photos: state === 'photos' ? PHOTOS.map(function (s) { return { src: s }; }) : []
    };
  }
  function recordFor(state, p) {
    if (state === 'none') return null;
    if (state === 'live') return INSP.shownForProduct(p.id);
    return sample(state, p);
  }
  return { build: buildMicro, fit: fitReport, STATES: STATES, recordFor: recordFor };
})();
</script>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var pid = parseInt(qs.get('pid'), 10) || INSP.PRODUCTS[0].id;
  // 從後台連過來（帶 pid）就照後台資料，否則預設「合格」
  var state = qs.get('pid') ? 'live' : 'pass';
  var FEE = { '冷凍專區': '冷凍運費', '快速到貨': '常溫運費', '粥寶寶專區': '冷凍運費', '產地直送': '常溫運費' };
  var sub = document.getElementById('scrReport');

  function render() {
    var p = INSP.product(pid) || INSP.PRODUCTS[0];
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pPrice').textContent = '$' + p.price;
    document.getElementById('pSpec').textContent = p.spec;
    document.getElementById('pFeeTitle').textContent = FEE[p.type] || '運費';
    document.getElementById('pDesc').textContent = '規格：' + p.spec;
    var r = INSP_REPORT.recordFor(state, p);
    var card = document.getElementById('reportCard');
    card.hidden = !r;
    if (r) {
      var fail = INSP.hasFail(r), tag = document.getElementById('rTag');
      tag.textContent = fail ? '不合格' : '合格';
      tag.className = 'report-tag' + (fail ? ' is-fail' : '');
      document.getElementById('rDate').textContent = '檢驗日期 ' + r.inspectDate.replace(/-/g, '/');
      document.getElementById('rBody').innerHTML = INSP_REPORT.build(r);
    } else {
      sub.classList.remove('is-open');
    }
    document.querySelectorAll('#devStates button').forEach(function (b) { b.classList.toggle('on', b.dataset.s === state); });
  }
  function fit() { INSP_REPORT.fit(document.getElementById('rBody')); }

  document.getElementById('reportCard').onclick = function () { sub.classList.add('is-open'); fit(); setTimeout(fit, 60); };
  document.getElementById('rBack').onclick = function () { sub.classList.remove('is-open'); };
  window.addEventListener('resize', fit);

  var list = document.getElementById('devStates');
  INSP_REPORT.STATES.forEach(function (st) {
    var b = document.createElement('button'); b.type = 'button'; b.dataset.s = st[0]; b.textContent = st[1];
    b.onclick = function () { state = st[0]; sub.classList.remove('is-open'); render(); };
    list.appendChild(b);
  });
  var dp = document.getElementById('devpanel');
  document.getElementById('devToggle').onclick = function () { dp.classList.toggle('collapsed'); this.textContent = dp.classList.contains('collapsed') ? '＋' : '－'; };
  window.addEventListener('insp-change', render);
  render();
})();
</script>
