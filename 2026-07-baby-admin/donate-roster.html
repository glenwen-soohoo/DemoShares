<!--
  DemoShares 交接對照 | 捐款名冊 (2026-07-baby-admin)
  真相來源：D:\GreenBox\fruit_web 分支 feature/DEV-3915-baby-react-refactor（4538c4a2c）
  ⚠ 這一頁是「現有後台」的新版 UI——後端已存在，欄位幾乎都對得到真名，可直接抄（非整頁新功能）。
  對應正式站（後台 GoX / SurveyBaby）：
    view       : HuashanCRM/Areas/GoX/Views/SurveyBaby/Donate.cshtml（＋ EditDonate.cshtml、BabyDonateReceipt.cshtml）
    controller : Areas/GoX/Controllers/SurveyBabyController.cs → Donate()（清單）／ExportDonate()（匯出）／BabyDonateReceipt()、SendBabyDonateReceipt()（收據）
    route      : /GoX/SurveyBaby/Donate
    VM         : GreenBox.Domain/ViewModels/Baby/DonateListViewModel.cs；查詢 Models/Baby/DonateSearchModel.cs
  這一頁的真實欄位名（demo → 真名）：
    訂單編號   → OrderNumber
    捐款人     → name / Nickname   ⚠ 個資，demo 用匿名化示意名，真資料是捐款人姓名
    手機       → Mobile（關鍵字可搜手機）
    捐贈院所   → Preschool_Name / School_Id（取自 Preschool 表）
    捐贈年月   → Search_Year / Search_Month（或 CreateTime）
    金額/箱數  → TotalPrice（金額真實，卡4-26 一律讀 Orders.TotalPrice）；箱數為金額÷單價換算
    付款方式   → PaymentType
    發票類型   → InvoiceType（二聯式／三聯式／捐物收據）；清單篩選＝InvoiceType radios。收據「寄送」是另一動作 ReceiptType（BabyDonateReceiptTypeEnum）＋ SendBabyDonateReceipt
    建立時間   → CreateTime
    來源管道   → ad_from（現有 Donate 清單即有此欄）
  新增（非示意，真資料可推導，只是現有清單還沒顯示）：
    專案類型   → 由 BabyProjectType 分類推導（Classify 依來源／ReceiverName）。現有 Donate 清單尚未顯示此欄 → 屬「新增顯示欄」，不是示意
  完整名稱對照見同資料夾 _交接對照.md
-->

<style>
/* ───── GoX Admin / base.css ─────
   後台殼共用 reset + 全域字型 + CSS 變數 token。
   color / spacing / radius 集中在 :root，後續元件一律 var(--gox-*) 取用，
   不要再回填 hex。 */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* ── 品牌綠 ── */
  --gox-green:           #4ba83b;   /* 主操作 / hover */
  --gox-green-hover:     #3d8c30;
  --gox-header-bg:       #D7F4DA;   /* header 淺綠底 */
  --gox-header-border:   #c2dfc4;

  /* ── 側欄深灰 ── */
  --gox-sider-bg:        #32323a;
  --gox-sider-sub-bg:    #28282e;
  --gox-sider-active-bg: #202025;
  --gox-sider-text:      #fff;
  --gox-sider-sub-text:  #cccccc;
  --gox-sider-active-text: bisque;

  /* ── 內容區 ── */
  --gox-content-bg:      #f1f2f7;
  --gox-card-bg:         #ffffff;
  --gox-card-border:     #e6e6e6;

  /* ── 文字 ── */
  --gox-text:            #333333;
  --gox-text-sub:        #666666;
  --gox-text-muted:      #888888;

  /* ── 語意色（補 antd primary #1677ff 之外）── */
  --gox-danger:          #dc4e43;   /* 主危險（與前台一致） */
  --gox-danger-soft:     #ff4d4f;   /* antd danger 替代值 */
  --gox-warning:         #fbbf24;
  --gox-info:            #2c98f0;
  --gox-success:         #52c41a;

  /* ── 元件尺寸 ── */
  --gox-header-h:        49px;
  --gox-sider-w:         160px;     /* Gift 170 + B2B 150 折衷 */
  --gox-radius:          4px;
  --gox-radius-lg:       6px;
  --gox-space-unit:      4px;

  /* ── 字型 / 字級 ── */
  --gox-font-family:     'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體',
                         -apple-system, BlinkMacSystemFont, sans-serif;
  --gox-font-size-base:  14px;
  --gox-font-size-sm:    13px;
  --gox-font-size-xs:    12px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
  color: var(--gox-text);
  background: var(--gox-content-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--gox-info); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 整個後台 wrapper（一定要包這層才能套色） */
.gox-page {
  min-height: 100vh;
  background: var(--gox-content-bg);
  color: var(--gox-text);
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
}

/* ───── GoX Admin / header.css ─────
   固定在頂端的淺綠 header：
     左：無毒農 logo（小張）
     中：breadcrumb（B2B管理 > 訂單管理）
     右：使用者快捷區（登出、通知；可選） */

.gox-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--gox-header-h);
  background: var(--gox-header-bg);
  border-bottom: 1px solid var(--gox-header-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: var(--gox-font-family);
}

.gox-header .gox-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.gox-header .gox-logo img {
  height: 28px;
  width: auto;
  max-width: 120px;
  display: block;
}

/* ── breadcrumb ── */
.gox-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gox-text-sub);
  font-size: 15px;
  flex: 1;
  min-width: 0;
}
.gox-breadcrumb a {
  color: var(--gox-green);
  text-decoration: none;
}
.gox-breadcrumb a:hover { text-decoration: underline; }
.gox-breadcrumb .sep {
  color: var(--gox-text-muted);
  font-size: 12px;
}
.gox-breadcrumb strong {
  color: #000;
  font-weight: 700;
}

/* ── 右側使用者快捷區（可選）── */
.gox-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  font-size: var(--gox-font-size-sm);
}
.gox-header-right .gox-user {
  color: var(--gox-text);
}
.gox-header-right .gox-icon-btn {
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--gox-text-sub);
  padding: 4px 8px;
  font-family: inherit;
  font-size: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--gox-radius);
  white-space: nowrap;
}
.gox-header-right .gox-user { white-space: nowrap; }
.gox-header-right .gox-icon-btn:hover {
  background: rgba(0, 0, 0, .05);
  color: var(--gox-text);
}

/* ───── GoX Admin / sidebar.css ─────
   左側深灰固定側欄。支援：
     - 一級項目（可帶 badge 紅點）
     - 可摺疊群組（▶ / ▼）
     - 二級項目（active 高亮）
     - disabled 樣式 */

.gox-sidebar {
  width: var(--gox-sider-w);
  flex-shrink: 0;
  background: var(--gox-sider-bg);
  color: var(--gox-sider-text);
  padding: 8px 0;
  font-size: var(--gox-font-size-sm);
  overflow-y: auto;
  position: sticky;
  top: var(--gox-header-h);
  height: calc(100vh - var(--gox-header-h));
  font-family: var(--gox-font-family);
}

/* ── 一級項目 / 群組標題 ── */
.gox-sidebar .gox-menu-item,
.gox-sidebar .gox-menu-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  color: var(--gox-sider-text);
  background: transparent;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: var(--gox-font-size-sm);
  font-family: inherit;
  line-height: 1.5;
  user-select: none;
}
.gox-sidebar .gox-menu-item:hover,
.gox-sidebar .gox-menu-title:hover {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}

/* disabled（demo 未開放的入口） */
.gox-sidebar .gox-menu-item.is-disabled {
  cursor: default;
  color: #888;
}
.gox-sidebar .gox-menu-item.is-disabled:hover {
  background: transparent;
  color: #888;
}

/* 箭頭（▶ / ▼） */
.gox-sidebar .gox-arrow {
  display: inline-block;
  width: 12px;
  font-size: 9px;
  flex-shrink: 0;
  transition: transform .15s;
}

/* badge 紅點 */
.gox-sidebar .gox-badge {
  margin-left: auto;
  background: var(--gox-danger);
  color: #fff;
  border-radius: 9999px;
  padding: 0 6px;
  font-size: 11px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

/* ── 摺疊群組 ── */
.gox-sidebar .gox-menu-group.is-open .gox-menu-title {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}
.gox-sidebar .gox-menu-children {
  background: var(--gox-sider-sub-bg);
}

/* 二級項目 */
.gox-sidebar .gox-menu-child {
  display: block;
  padding: 8px 14px 8px 32px;
  color: var(--gox-sider-sub-text);
  text-decoration: none;
  font-size: var(--gox-font-size-sm);
}
.gox-sidebar .gox-menu-child:hover {
  background: #252530;
  color: var(--gox-sider-active-text);
  text-decoration: none;
}
.gox-sidebar .gox-menu-child.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text);
  font-weight: 600;
}

/* ───── GoX Admin / content.css ─────
   內容區共用元件：
     .gox-content / .gox-card / button / form / table / modal / tab / switch / icon-btn
   全部用 :root 變數，不直接寫 hex。 */

/* ── 主體佈局：header 下方的 sidebar + content ── */
.gox-body {
  display: flex;
  min-height: calc(100vh - var(--gox-header-h));
}
.gox-content {
  flex: 1;
  min-width: 0;          /* 讓子層 table overflow 正常 */
  padding: 16px;
  overflow-x: auto;
  background: var(--gox-content-bg);
}

/* ─────────────────────────────────────────────────
   Toolbox：工具型頁面的主要工作區容器
   預設 960px 限寬置中（表單、設定、編輯頁讀起來舒服）
   修飾詞依內容寬度需求調整
   ─────────────────────────────────────────────────
   何時用：
     - 系統設定、個人資料、單筆編輯、單一表單
     - 內容上下流式排列、欄位不多
   何時不用：
     - 列表頁（要滿寬度顯示表格）
     - 看板、儀表板（多欄並列）
     - 包含寬表格的編輯頁（會被切掉）
   範例：
     <main class="gox-content">
       <div class="gox-toolbox">  ← 用這個
         <h2>系統設定</h2>
         <div class="gox-card">…</div>
       </div>
     </main>
*/
.gox-toolbox {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.gox-toolbox.is-narrow { max-width: 720px; }   /* 表單少欄位、登入頁、設定密碼 */
.gox-toolbox.is-wide   { max-width: 1200px; }  /* 多欄表單、含中型表格 */
.gox-toolbox.is-fluid  { max-width: none; }    /* 內容太擠時退回滿寬 */

/* ─────────────────────────────────────────────────
   Card：後台主要的「白卡片」容器
   ───────────────────────────────────────────────── */
.gox-card {
  background: var(--gox-card-bg);
  border: 1px solid var(--gox-card-border);
  border-radius: var(--gox-radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.gox-card-title {
  margin: 0;
  padding: 12px 16px;
  background: var(--gox-card-bg);
  border-bottom: 1px solid var(--gox-card-border);
  font-size: 16px;
  font-weight: 600;
  color: var(--gox-text);
}
.gox-card-title.is-green {            /* 綠色強調標題（如「贈品設定」） */
  background: var(--gox-green);
  color: #fff;
  border-bottom: 0;
}
.gox-card-body { padding: 16px; }
.gox-card-body.is-table-padding { padding: 0; }     /* table 自己有 padding 時用 */

/* 卡片頂端列：左標題 / 右操作按鈕 */
.gox-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─────────────────────────────────────────────────
   Button
   ───────────────────────────────────────────────── */
.gox-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  line-height: 1.5;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.gox-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* 主操作 — 品牌綠 */
.gox-btn-primary {
  background: var(--gox-green);
  color: #fff;
  border-color: var(--gox-green);
}
.gox-btn-primary:hover:not(:disabled) { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }

/* 次操作 — 白底邊框 */
.gox-btn-default {
  background: #fff;
  color: var(--gox-text);
  border-color: #ccc;
}
.gox-btn-default:hover:not(:disabled) { background: #f5f5f5; border-color: var(--gox-green); color: var(--gox-green); }

/* 危險 */
.gox-btn-danger {
  background: #fff;
  color: var(--gox-danger);
  border-color: var(--gox-danger);
}
.gox-btn-danger:hover:not(:disabled) { background: var(--gox-danger); color: #fff; }

/* 列表內小按鈕（檢視 / 編輯 / 刪除） */
.gox-btn-op {
  display: inline-block;
  margin-right: 4px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  color: var(--gox-text);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.gox-btn-op:hover { background: #f5f5f5; text-decoration: none; }

/* ─────────────────────────────────────────────────
   Form
   ───────────────────────────────────────────────── */
.gox-form-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.gox-form-row > label {
  min-width: 110px;
  color: var(--gox-text);
  font-weight: 500;
}
.gox-input,
.gox-select,
.gox-textarea {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  background: #fff;
  color: var(--gox-text);
  line-height: 1.5;
  min-height: 32px;
  box-sizing: border-box;
}
.gox-input:focus,
.gox-select:focus,
.gox-textarea:focus {
  outline: 2px solid var(--gox-green);
  outline-offset: -1px;
  border-color: var(--gox-green);
}
.gox-input:disabled,
.gox-select:disabled,
.gox-textarea:disabled {
  background: #f5f5f5;
  color: #999;
  cursor: not-allowed;
}
.gox-textarea { min-height: 80px; resize: vertical; }

.gox-radio-group, .gox-checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.gox-hint {
  color: var(--gox-text-muted);
  font-size: var(--gox-font-size-xs);
}

/* ─────────────────────────────────────────────────
   Table
   ───────────────────────────────────────────────── */
.gox-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--gox-font-size-sm);
  background: #fff;
}
.gox-table th {
  background: #fafafa;
  border-bottom: 1px solid var(--gox-card-border);
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--gox-text-sub);
  white-space: nowrap;
}
.gox-table td {
  padding: 12px 8px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.gox-table tr:hover td { background: #fafafa; }
.gox-table .cell-center { text-align: center; }
.gox-table .cell-right { text-align: right; }
.gox-table .cell-ops { white-space: nowrap; }
.gox-table .row-error td { background: #fff1f0; }
.gox-table .row-error:hover td { background: #ffe0de; }

/* ─────────────────────────────────────────────────
   Tab（頁籤）
   ───────────────────────────────────────────────── */
.gox-tab-group {
  display: inline-flex;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  overflow: hidden;
}
.gox-tab-btn {
  padding: 6px 20px;
  background: #fff;
  border: 0;
  cursor: pointer;
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  border-right: 1px solid #ccc;
  color: var(--gox-text);
}
.gox-tab-btn:last-child { border-right: 0; }
.gox-tab-btn.is-active {
  background: var(--gox-info);
  color: #fff;
}

/* ─────────────────────────────────────────────────
   Modal
   ───────────────────────────────────────────────── */
.gox-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.gox-modal-overlay.is-hidden { display: none; }
[hidden] { display: none !important; }
.gox-modal-box {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  min-width: 480px;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.gox-modal-box h4 { margin: 0 0 16px; font-size: 16px; }
.gox-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

/* ─────────────────────────────────────────────────
   Switch / Tag
   ───────────────────────────────────────────────── */
.gox-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  border-radius: 9999px;
  border: 0;
  padding: 0;
  margin: 0;
  background: #d1d5db;
  cursor: pointer;
  transition: background .18s ease;
  vertical-align: middle;
}
.gox-switch.is-on { background: var(--gox-green); }
.gox-switch.is-disabled { opacity: .5; cursor: not-allowed; }
.gox-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .18s ease;
}
.gox-switch.is-on::after { transform: translateX(18px); }

.gox-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  font-weight: 600;
  background: #f0f0f0;
  color: var(--gox-text-sub);
  border: 1px solid #e0e0e0;
}
.gox-tag.is-success { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
.gox-tag.is-info    { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-warning { background: #fffbe6; color: #d4b106; border-color: #ffe58f; }
.gox-tag.is-danger  { background: #fff1f0; color: var(--gox-danger); border-color: #ffccc7; }

/* 溫層快速 tag（兩專案都會用） */
.gox-tag.is-frozen  { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-ambient { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }


/* ─────────────────────────────────────────────────
   Icon button（鉛筆 / 確認 / 取消）
   ───────────────────────────────────────────────── */
.gox-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--gox-radius);
  cursor: pointer;
  color: var(--gox-text-sub);
  font-size: 12px;
  font-family: inherit;
  transition: all .15s;
}
.gox-icon-btn:hover {
  background: #f0f4f8;
  color: var(--gox-info);
  border-color: #bcd4ea;
}
.gox-icon-btn.is-confirm { background: var(--gox-green); color: #fff; border-color: var(--gox-green); }
.gox-icon-btn.is-confirm:hover { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }
.gox-icon-btn.is-cancel  { background: #fff; color: #999; border-color: #ccc; }
.gox-icon-btn.is-cancel:hover  { background: #f5f5f5; color: var(--gox-danger); border-color: var(--gox-danger); }

</style>

<script>
(function(){
  'use strict';
  const PT={ '一般捐款':'#5f6b7a|#eef1f5','安心蔬果':'#5a8a3c|#f3f8ee','愛心稻田':'#8a7a2e|#f8f4e6','圓夢計畫':'#7a6aa8|#f5f1fb','聖誕傳情':'#b05c86|#fbf0f5','豆漿鮮奶':'#a8803f|#faf3e8','工程公益修繕':'#5278a8|#eef4fb','快篩試劑':'#4e8a90|#eef7f7','寶寶粥':'#c2703a|#fbf0e8' };
  function ptag(t){ const [fg,bg]=(PT[t]||'#555|#eee').split('|'); return `<span class="ptag" style="color:${fg};background:${bg};border-color:${fg}55;">${t}</span>`; }
  const TYPES=Object.keys(PT);
  // 真實育幼院名稱（取自資料庫 Preschool 表）
  const PRES=['聖方濟育幼院','雲林縣信義育幼院','財團法人新北市榮光育幼院','天主教善牧基金會 花蓮兒童之家','家扶基金會 大同育幼院','臺北市私立伯大尼兒少家園'];
  // 捐款人為個資，demo 用匿名化示意名
  const PAYS=['信用卡','ATM轉帳','定期定額','劃撥']; const NAMES=['王小明','陳怡君','林志豪','張淑芬','黃建宏','行動家股份有限公司'];
  const INVS=['二聯式','三聯式','捐物收據'];
  const ROWS=[];
  for(let i=0;i<26;i++){ const type=TYPES[i%TYPES.length]; const box=[1,2,3,5][i%4]; const price=[599,650,720,880][i%4];
    const nm=NAMES[i%NAMES.length];
    ROWS.push({ no:'DEMO-'+(1001+i), name:nm, mobile:'09'+String(12345678+i*1111111).slice(0,8), type, pres:PRES[i%PRES.length], amount:box*price, box, pay:PAYS[i%PAYS.length], invoice:INVS[i%3], time:'2026-07-'+String(2+(i%26)).padStart(2,'0'),
      sn:String(1150700001+i), taxid:nm.includes('公司')?'27415566':'' }); }
  document.querySelector('#f-type').insertAdjacentHTML('beforeend', TYPES.map(t=>`<option>${t}</option>`).join(''));
  document.querySelector('#f-month').insertAdjacentHTML('beforeend', ['2026-07','2026-06','2026-05'].map(m=>`<option>${m}</option>`).join(''));
  const sel=new Set(); const v=s=>document.querySelector(s).value;

  function filtered(){ const ft=v('#f-type'),fm=v('#f-month'),fp=v('#f-pay'),fi=v('#f-inv'),kw=v('#f-kw').trim();
    return ROWS.filter(r=>(!ft||r.type===ft)&&(!fm||r.time.startsWith(fm))&&(!fp||r.pay===fp)&&(!fi||r.invoice===fi)&&(!kw||(r.no+r.name+r.mobile).includes(kw))); }
  function render(){ const list=filtered(); document.querySelector('#d-count').textContent=list.length;
    document.querySelector('#d-tbody').innerHTML=list.map(r=>`<tr>
      <td><input type="checkbox" class="ck" value="${r.no}" ${sel.has(r.no)?'checked':''}></td>
      <td>${r.no}</td><td>${r.name}</td><td>${r.mobile}</td>
      <td class="cell-right stack"><div class="money">$${r.amount.toLocaleString()}</div><div class="box">${r.box} 箱</div></td>
      <td>${r.pres}</td><td>${ptag(r.type)}</td><td>${r.pay}</td>
      <td>${r.invoice}</td>
      <td>${r.time}</td>
      <td class="cell-ops"><a href="#" class="gox-btn-op" data-print="${r.no}">列印</a><a href="#" class="gox-btn-op" data-view="${r.no}">檢視</a></td>
    </tr>`).join('')||`<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--gox-text-muted);">查無捐款紀錄</td></tr>`;
    syncSel(); }
  function syncSel(){ document.querySelector('#sel-n').textContent=sel.size; document.querySelector('#sel-bar').style.display=sel.size?'flex':'none';
    const bs=[...document.querySelectorAll('.ck')]; document.querySelector('#ck-all').checked=bs.length&&bs.every(b=>b.checked); }

  document.querySelector('#btn-search').addEventListener('click',render);
  document.querySelector('#btn-reset').addEventListener('click',()=>{ ['#f-type','#f-month','#f-pay','#f-inv','#f-kw'].forEach(s=>document.querySelector(s).value=''); render(); });
  document.querySelector('#f-kw').addEventListener('keydown',e=>{ if(e.key==='Enter') render(); });
  document.querySelector('#ck-all').addEventListener('change',e=>{ filtered().forEach(r=>{ e.target.checked?sel.add(r.no):sel.delete(r.no); }); render(); });
  document.addEventListener('change',e=>{ const c=e.target.closest('.ck'); if(!c)return; c.checked?sel.add(c.value):sel.delete(c.value); syncSel(); });
  document.querySelector('#btn-clear').addEventListener('click',()=>{ sel.clear(); render(); });
  const byNo=no=>ROWS.find(r=>r.no===no);
  const RBLOB='https://fruitbox.blob.core.windows.net/pagematerials/baby/print';
  function receiptHTML(r){ return `
    <div class="rcpt">
      <div class="rcpt-top">
        <div class="rcpt-org">
          <div class="rcpt-org-name">中華民國等家寶寶社會福利協會</div>
          <div class="rcpt-org-line">地址：106臺北市大安區復興南路一段321號7樓-1　電話：02-2771-3010</div>
          <div class="rcpt-org-line">網址：https://greenbox.tw/Baby</div>
          <div class="rcpt-org-line">E-mail：babygreenbox@greenbox.tw</div>
          <div class="rcpt-org-line">統一編號：75972723　立案字號：台內團字第1070087702號</div>
          <div class="rcpt-org-line">勸募字號：衛部救字第 1151362501 號</div>
          <div class="rcpt-title">捐款收據</div>
        </div>
        <img class="rcpt-logo" src="${RBLOB}/baby-logo-for-receipt.png" alt="等家寶寶協會">
      </div>
      <table class="rcpt-t">
        <tr><td style="width:50%;">捐贈者姓名：${r.name}</td><td style="width:50%;">收據號：${r.sn}</td></tr>
        <tr><td colspan="2">金額：${r.amount.toLocaleString()}</td></tr>
        <tr><td colspan="2">捐贈日期：${r.time}</td></tr>
        <tr><td colspan="2">統一編號：${r.taxid||''}</td></tr>
        <tr><td colspan="2">備註：</td></tr>
      </table>
      <div class="rcpt-sign">
        <div class="rcpt-sign-c">理事長：曾逸峰<img src="${RBLOB}/enzo.png" alt=""></div>
        <div class="rcpt-sign-c">經手人：曾逸峰<img src="${RBLOB}/enzo.png" alt=""></div>
        <div class="rcpt-sign-c" style="text-align:right;"><img class="seal" src="${RBLOB}/等家寶寶協會.png" alt="協會印"></div>
      </div>
    </div>`; }
  function printArea(){ let pa=document.querySelector('#print-area'); if(!pa){ pa=document.createElement('div'); pa.id='print-area'; document.body.appendChild(pa); } return pa; }
  function doPrint(nos){ const rs=nos.map(byNo).filter(Boolean); if(!rs.length){ window.gox.toast('沒有可列印的收據'); return; }
    printArea().innerHTML=rs.map(receiptHTML).join('<div class="rcpt-break"></div>'); window.print(); }
  let viewNo=null;
  function openView(no){ const r=byNo(no); if(!r)return; viewNo=no;
    document.querySelector('#mv-body').innerHTML=`<table class="mv-t">
      <tr><td>訂單編號</td><td>${r.no}</td></tr>
      <tr><td>捐款人</td><td>${r.name}</td></tr>
      <tr><td>手機</td><td>${r.mobile}</td></tr>
      <tr><td>專案類型</td><td>${ptag(r.type)}</td></tr>
      <tr><td>捐贈院所</td><td>${r.pres}</td></tr>
      <tr><td>金額 / 箱數</td><td>$${r.amount.toLocaleString()}（${r.box} 箱）</td></tr>
      <tr><td>付款方式</td><td>${r.pay}</td></tr>
      <tr><td>發票類型</td><td>${r.invoice}</td></tr>
      <tr><td>建立時間</td><td>${r.time}</td></tr>
    </table>`;
    window.gox.openModal('#modal-view'); }
  function exportCSV(){ const list=filtered(); const head=['訂單編號','捐款人','手機','金額','箱數','捐贈院所','專案類型','付款方式','發票類型','建立時間'];
    const esc=s=>`"${String(s).replace(/"/g,'""')}"`;
    const lines=[head.join(',')].concat(list.map(r=>[r.no,r.name,r.mobile,r.amount,r.box,r.pres,r.type,r.pay,r.invoice,r.time].map(esc).join(',')));
    const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`捐款名冊_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    window.gox.toast(`已匯出 ${list.length} 筆（CSV）`); }

  document.querySelector('#btn-export').addEventListener('click', exportCSV);
  document.querySelector('#btn-print').addEventListener('click',()=>{ if(!sel.size){ window.gox.toast('請先勾選要列印的收據'); return; } doPrint([...sel]); });
  document.querySelector('#btn-mail').addEventListener('click',()=>window.gox.toast(`已排程寄出 ${sel.size} 張收據 Email`));
  document.querySelector('#mv-print').addEventListener('click',()=>{ if(viewNo) doPrint([viewNo]); });
  document.addEventListener('click',e=>{ const p=e.target.closest('[data-print]'),vv=e.target.closest('[data-view]');
    if(p){ e.preventDefault(); doPrint([p.dataset.print]); } if(vv){ e.preventDefault(); openView(vv.dataset.view); } });
  render();
})();
</script>

<script>
/* ───── GoX Admin / gox-interactions.js ─────
   後台殼共用的「元件級互動」。
   由 build_prototype.py 自動內聯到輸出 HTML，呼叫者寫對 class 就會動。

   覆蓋範圍（你不用為這些再寫 JS）：
     - .gox-switch         click  → toggle .is-on
     - .gox-tab-btn        click  → 同 .gox-tab-group 內切 .is-active
     - .gox-menu-title     click  → toggle 父 .gox-menu-group .is-open + 箭頭
     - [data-gox-open]     click  → 顯示 #target modal（移除 .is-hidden）
     - [data-gox-close]    click  → 隱藏所屬 .gox-modal-overlay
     - .gox-modal-overlay  click  → 點背景關（除非有 data-gox-no-overlay-close）
     - .gox-icon-btn.is-confirm/.is-cancel click → 觸發 [data-gox-target] 的 confirm/cancel CustomEvent
     - .gox-menu-child     click  → 同 .gox-sidebar 內切 .is-active

   不覆蓋（你要自己寫）：
     - 篩選 / 排序 / 搜尋
     - 狀態機（pending → confirmed → done 之類）
     - 跨元件聯動
     - 表單送出 / 假 API 回傳
   ➜ 在 content_html 裡寫 <script>，用 DOMContentLoaded 包起來。
*/
(function () {
  'use strict';

  function on(el, ev, fn) { el.addEventListener(ev, fn); }
  function delegate(root, ev, selector, fn) {
    on(root, ev, (e) => {
      const t = e.target.closest(selector);
      if (t && root.contains(t)) fn(e, t);
    });
  }

  function init() {
    const root = document;

    // ── Switch ─────────────────────────────────
    delegate(root, 'click', '.gox-switch', (e, el) => {
      if (el.classList.contains('is-disabled')) return;
      el.classList.toggle('is-on');
      el.dispatchEvent(new CustomEvent('gox:switch', {
        bubbles: true,
        detail: { on: el.classList.contains('is-on') },
      }));
    });

    // ── Tab group ───────────────────────────────
    delegate(root, 'click', '.gox-tab-group .gox-tab-btn', (e, btn) => {
      const group = btn.closest('.gox-tab-group');
      group.querySelectorAll('.gox-tab-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const key = btn.dataset.tab;
      group.dispatchEvent(new CustomEvent('gox:tab', {
        bubbles: true,
        detail: { tab: key, btn },
      }));
      // 若有 data-tab，自動切 [data-tab-panel] 顯示
      if (key) {
        const scope = btn.closest('[data-tab-scope]') || document;
        scope.querySelectorAll('[data-tab-panel]').forEach((p) => {
          p.hidden = p.dataset.tabPanel !== key;
        });
      }
    });

    // ── Sidebar menu group 摺疊 ──────────────────
    delegate(root, 'click', '.gox-menu-title', (e, btn) => {
      const group = btn.closest('.gox-menu-group');
      if (!group) return;
      group.classList.toggle('is-open');
      const arrow = btn.querySelector('.gox-arrow');
      if (arrow) arrow.textContent = group.classList.contains('is-open') ? '▼' : '▶';
    });

    // ── Sidebar menu child active ────────────────
    delegate(root, 'click', '.gox-sidebar .gox-menu-child', (e, link) => {
      // 不阻止預設行為（讓 href 還能跳）；但若是 href="#" 純 demo，做 active 切換
      if (link.getAttribute('href') === '#') e.preventDefault();
      const side = link.closest('.gox-sidebar');
      side.querySelectorAll('.gox-menu-child.is-active').forEach((a) => a.classList.remove('is-active'));
      link.classList.add('is-active');
    });

    // ── Modal open ──────────────────────────────
    delegate(root, 'click', '[data-gox-open]', (e, btn) => {
      const sel = btn.dataset.goxOpen;
      const target = sel && document.querySelector(sel);
      if (target) target.classList.remove('is-hidden');
    });

    // ── Modal close（按鈕） ─────────────────────
    delegate(root, 'click', '[data-gox-close]', (e, btn) => {
      const modal = btn.closest('.gox-modal-overlay');
      if (modal) modal.classList.add('is-hidden');
    });

    // ── Modal close（點背景） ───────────────────
    delegate(root, 'click', '.gox-modal-overlay', (e, overlay) => {
      if (overlay.dataset.goxNoOverlayClose !== undefined) return;
      if (e.target === overlay) overlay.classList.add('is-hidden');
    });

    // ── ESC 關 modal ────────────────────────────
    on(document, 'keydown', (e) => {
      if (e.key !== 'Escape') return;
      const opens = document.querySelectorAll('.gox-modal-overlay:not(.is-hidden)');
      opens.forEach((m) => {
        if (m.dataset.goxNoOverlayClose === undefined) m.classList.add('is-hidden');
      });
    });

    // ── Icon button confirm / cancel ─────────────
    delegate(root, 'click', '.gox-icon-btn.is-confirm, .gox-icon-btn.is-cancel', (e, btn) => {
      const kind = btn.classList.contains('is-confirm') ? 'confirm' : 'cancel';
      const targetSel = btn.dataset.goxTarget;
      const target = targetSel ? document.querySelector(targetSel) : btn.closest('[data-gox-editable]');
      if (target) {
        target.dispatchEvent(new CustomEvent('gox:' + kind, { bubbles: true }));
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露給頁面級腳本使用（如「按下查詢」這種頁面級互動）
  window.gox = window.gox || {};
  window.gox.openModal  = (sel) => { const t = document.querySelector(sel); if (t) t.classList.remove('is-hidden'); };
  window.gox.closeModal = (sel) => { const t = document.querySelector(sel); if (t) t.classList.add('is-hidden'); };
  window.gox.toast = (msg) => {
    // 簡易 toast（自動消失）
    let host = document.querySelector('#gox-toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'gox-toast-host';
      host.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
      document.body.appendChild(host);
    }
    const t = document.createElement('div');
    t.className = 'gox-toast';
    t.textContent = msg;
    t.style.cssText = 'background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.2);';
    host.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
    setTimeout(() => t.remove(), 2200);
  };
})();

</script>
