<html lang="zh-Hant-TW">
<head>

    sprite-journey(new).html、sprite-states(new).html

<meta charset="UTF-8">
<title>無毒農小精靈 demo 索引</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; padding:56px 20px; font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
        font-size:16px; line-height:1.7; color:#1a1a1a; background:#fafbfb; }
  .wrap{ max-width:960px; margin:0 auto; }
  h1{ font-size:30px; margin:0 0 4px; color:#4ba83b; }
  .sub{ color:#999; font-size:14px; margin:0 0 32px; }

  .side{ margin-bottom:40px; }
  .side>h2{ font-size:20px; font-weight:700; color:#1a1a1a; margin:0 0 16px; padding-left:12px; border-left:4px solid #4ba83b; }

  .entries{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .entries{ grid-template-columns:1fr; } }

  .entry{ display:flex; flex-direction:column; background:#fff; border:1px solid #e0e4e6; border-radius:4px;
          padding:20px; text-decoration:none; color:inherit; transition:border-color .15s, box-shadow .15s, transform .15s; }
  .entry.ready:hover{ border-color:#4ba83b; box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .entry .name{ font-size:16px; font-weight:700; color:#4ba83b; margin-bottom:4px; }
  .entry .desc{ font-size:13px; color:#595757; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>無毒農小精靈・demo</h1>
  <p class="sub">2026-11｜購物流程陪伴型小精靈・UX 概念</p>

  <div class="side">
    <h2>概念 demo</h2>
    <div class="entries">
      <a class="entry ready" href="sprite-journey(new).html">
        <span class="name">購物旅程｜互動 demo</span>
        <span class="desc">跟著購物流程走一遍，右下角小精靈回饋加購、湊免運、下單；開發者面板可切各情境。</span>
      </a>
      <a class="entry ready" href="sprite-states(new).html">
        <span class="name">狀態圖鑑｜11 個狀態</span>
        <span class="desc">每個狀態的出場時機、對應姿勢、對話與 P0/P1/P2 優先級一覽。</span>
      </a>
    </div>
  </div>
</div>
