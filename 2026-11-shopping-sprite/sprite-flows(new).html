<style>
:root{
  --green:#4ba83b; --green-strong:#22ac38; --gold:#caa940; --red:#dc4e43; --orange:#e67e22;
  --text:#33435a; --muted:#8a94a3; --line:#e4e7ec; --bg:#f6f8f4; --radius:4px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'Noto Sans TC',sans-serif;color:var(--text);background:var(--bg);line-height:1.6;}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 72px;}
h1{font-size:24px;margin:0 0 4px;}
.lead{color:var(--muted);margin:0 0 24px;max-width:760px;}

/* 三階段總覽 */
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
.ph-card{display:block;background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:8px;padding:16px;text-decoration:none;color:inherit;}
.ph-card.ph2{border-top-color:var(--orange);}
.ph-card.ph3{border-top-color:var(--gold);}
.ph-card:hover{border-color:var(--green);}
.ph-no{font-size:12px;font-weight:700;color:var(--muted);}
.ph-name{font-size:17px;font-weight:700;margin:0 0 4px;}
.ph-need{font-size:13px;color:var(--muted);margin-bottom:8px;}
.ph-count{font-size:13px;margin-bottom:8px;}
.ph-count b{font-size:20px;color:var(--text);}
.ph-states{display:flex;flex-wrap:wrap;gap:4px;}
.ph-states span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:9999px;padding:0 8px;}
.ph-states span.up{border-style:dashed;}

/* 圖例 */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:32px;font-size:13px;}
.lg{display:flex;align-items:center;gap:8px;}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;}
.sw.sw-user{background:#cdd4de;}
.sw.p0{background:#eaf6e8;border:1px solid var(--green-strong);}
.sw.p1{background:#fef3e0;border:1px solid var(--orange);}
.sw.p2{background:#eef1f5;border:1px solid var(--muted);}
.sw.logic{background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);}

/* 階段段落 */
.phase{margin-bottom:48px;scroll-margin-top:16px;}
.phase-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--green);}
.phase.ph2 .phase-head{border-bottom-color:var(--orange);}
.phase.ph3 .phase-head{border-bottom-color:var(--gold);}
.phase-head h2{font-size:20px;margin:0;}
.phase-head .need{font-size:13px;color:var(--muted);}

/* 旅程卡 */
.journey{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 24px 24px;margin-bottom:20px;}
.jtitle{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.jnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--text);color:#fff;font-size:12px;font-weight:700;flex:none;}
.jctx{color:var(--muted);font-size:13px;margin:4px 0 16px 32px;}

/* 流程 */
.flow{display:flex;flex-direction:column;}
.conn{height:20px;width:2px;background:var(--line);margin:4px 0 4px 24px;position:relative;}
.conn::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #cdd4de;}
.user{background:var(--bg);border:1px solid var(--line);border-left:4px solid #aab3c0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500;}
.endn{background:#fff;border:1px dashed #cdd4de;color:var(--muted);font-size:13px;border-radius:8px;padding:8px 12px;}
.noten{background:#f0f7ef;border:1px solid #d6e9d2;color:#3d6b34;font-size:13px;border-radius:8px;padding:8px 12px;}
.blabel{font-size:12px;color:var(--muted);margin:0 0 8px 0;}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.path{border:1px dashed var(--line);border-radius:8px;padding:12px;background:#fcfdfc;min-width:0;}
.cond{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:9999px;padding:2px 12px;display:inline-block;margin-bottom:8px;}

/* 圓圓寶發話列：左邊對話窗、右邊推薦邏輯或要用的資料 */
.say-row{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}
.say-row.solo{grid-template-columns:320px;}
.path .say-row,.path .say-row.solo{grid-template-columns:1fr;}
.state-chip{font-size:12px;color:var(--muted);margin-bottom:4px;}
.state-chip b{color:var(--text);font-weight:700;}
.stage{background:#eef1ec;border-radius:8px;padding:16px 12px 8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.stage .av3d{width:136px;height:128px;cursor:pointer;}
.stage.quiet .av3d{opacity:.55;}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:10;}

/* 對話窗本體：跟互動 demo 同一套樣式 */
.bubble{width:100%;max-width:272px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(51,67,90,.16);padding:12px 12px 12px;position:relative;margin-right:8px;}
.bubble::after{content:'';position:absolute;right:28px;bottom:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);}
.b-head{display:flex;align-items:flex-start;gap:8px;}
.b-msg{font-size:14px;line-height:1.5;flex:1;}
.b-msg b{color:var(--orange);}
.b-close{color:var(--muted);font-size:16px;line-height:1;padding:0 2px;}
.b-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--radius);margin-bottom:4px;}
.b-tag.p0{background:#eaf6e8;color:var(--green-strong);}
.b-tag.p1{background:#fef3e0;color:var(--orange);}
.b-tag.p2{background:#eef1f5;color:var(--muted);}
.b-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.b-btn{border:1px solid var(--green);background:#fff;color:var(--green);font-size:12px;font-weight:500;padding:4px 12px;border-radius:9999px;}
.b-btn.primary{background:var(--green);color:#fff;}
.b-recs{display:flex;gap:8px;margin-top:8px;}
.b-rec{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:4px 4px 8px;text-align:center;position:relative;min-width:0;}
.b-rec img{width:36px;height:36px;object-fit:contain;}
.b-rec .rn{font-size:11px;display:block;line-height:1.4;}
.b-rec .rp{font-size:11px;color:var(--red);font-weight:700;display:block;}
.b-rec .ra{display:inline-block;margin-top:4px;font-size:11px;color:#fff;background:var(--green);border-radius:9999px;padding:0 8px;}
.b-rec .badge{position:absolute;top:4px;left:4px;font-size:10px;background:var(--orange);color:#fff;border-radius:2px;padding:0 4px;}
.b-cart{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px;background:var(--bg);border-radius:var(--radius);}
.b-cart img{width:32px;height:32px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
.b-cart span{font-size:12px;color:var(--muted);}
.quiet-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed #cdd4de;border-radius:8px;padding:4px 8px;margin-right:8px;}
.quiet-note .restore{color:var(--green);font-weight:700;margin-left:4px;text-decoration:underline;}

/* 推薦邏輯／要用的資料 */
.side{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:12px 16px;font-size:13px;}
.side.data{border-left-color:#aab3c0;}
.side .st{font-size:13px;font-weight:700;margin-bottom:8px;}
.side dl{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;margin:0;}
.side dt{color:var(--muted);font-weight:500;}
.side dd{margin:0;}
.side .why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);}

@media(max-width:860px){
  .overview{grid-template-columns:1fr;}
  .say-row,.say-row.solo{grid-template-columns:1fr;}
  .branches{grid-template-columns:1fr;}
}
</style>

  <h1>圓圓寶 · 旅程流程圖</h1>
  <p class="lead">把圓圓寶在購物流程裡的每一條旅程畫出來，每個發話點都是它實際會跳出的對話窗。會推商品的地方，旁邊寫推薦邏輯：從哪挑、濾掉什麼、怎麼排。旅程依「要用到什麼資料才做得出來」分成三個階段。</p>

  <div class="overview" id="overview"></div>

  <div class="legend">
    <span class="lg"><span class="sw sw-user"></span>客人的動作</span>
    <span class="lg"><span class="sw p0"></span>即時回饋（P0 必出）</span>
    <span class="lg"><span class="sw p1"></span>貼心提醒（P1 該出）</span>
    <span class="lg"><span class="sw p2"></span>順便一提（P2 能省則省）</span>
    <span class="lg"><span class="sw logic"></span>推薦邏輯／要用的資料</span>
  </div>

  <div id="phases"></div>
</div>

function bubbleHtml(s){
  let h=`<div class="bubble"><div class="b-head"><div class="b-msg"><span class="b-tag ${s.pri}">${TAG[s.pri]}</span><br>${s.msg}</div><span class="b-close">&times;</span></div>`;
  if(s.recs) h+=`<div class="b-recs">${s.recs.map(k=>{const p=P[k];return `<div class="b-rec">${s.badge?`<span class="badge">${s.badge}</span>`:''}<img src="${p.img}" alt=""><span class="rn">${p.name}</span><span class="rp">$${p.price}</span><span class="ra">加入</span></div>`}).join('')}</div>`;
  if(s.cart) h+=`<div class="b-cart">${s.cart.map(k=>`<img src="${P[k].img}" alt="">`).join('')}<span>共 ${s.cartCount} 樣</span></div>`;
  if(s.btns) h+=`<div class="b-actions">${s.btns.map(([t,pr])=>`<span class="b-btn ${pr?'primary':''}">${t}</span>`).join('')}</div>`;
  return h+'</div>';
}
function sideHtml(sd){
  if(!sd) return '';
  return `<div class="side ${sd.data?'data':''}"><div class="st">${sd.title}</div><dl>${sd.rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${sd.why?`<div class="why">${sd.why}</div>`:''}</div>`;
}
function stepHtml(s){
  if(s.t==='user') return `<div class="user">${s.text}</div>`;
  if(s.t==='end')  return `<div class="endn">${s.text}</div>`;
  if(s.t==='note') return `<div class="noten">${s.text}</div>`;
  if(s.t==='quiet') return `<div class="say-row solo"><div><div class="state-chip">狀態：<b>${s.state}</b></div><div class="stage quiet"><div class="quiet-note">${s.note}</div><div class="av3d" data-a="${ACT[s.state]||'idle'}"></div></div></div></div>`;
  if(s.t==='say') return `<div class="say-row ${s.side?'':'solo'}"><div><div class="state-chip">狀態：<b>${s.state}</b></div><div class="stage">${bubbleHtml(s)}<div class="av3d" data-a="${ACT[s.state]||'idle'}"></div></div></div>${sideHtml(s.side)}</div>`;
  if(s.t==='branch') return `${s.label?`<div class="blabel">${s.label}</div>`:''}<div class="branches">${s.paths.map(p=>`<div class="path"><span class="cond">${p.cond}</span>${flowHtml(p.steps)}</div>`).join('')}</div>`;
  return '';
}
function flowHtml(steps){
  return `<div class="flow">${steps.map((s,i)=>(i?'<div class="conn"></div>':'')+stepHtml(s)).join('')}</div>`;
}

<script type="module">
// 每個對話窗旁的圓圓寶都由 3D 基準模型播放該狀態的動作：捲到時播一次，點圓圓寶重播
import { THREE, YYB, Player, makeScene, makeCamera } from './yyb/yyb.js';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0x000000, 0);
const views = [...document.querySelectorAll('.av3d')].map(el => {
  const scene = makeScene(), cam = makeCamera(1), yyb = new YYB(); scene.add(yyb.group);
  cam.position.set(0, 2.6, 11); cam.lookAt(0, 1.62, 0);
  const player = new Player(yyb), a = el.dataset.a; player.play(a); player.t = 99; player.update(0);
  el.addEventListener('click', () => player.play(a));
  return { el, a, scene, cam, player, played: false };
});
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = views.find(x => x.el === e.target); if (e.isIntersecting && v && !v.played) { v.played = true; v.player.play(v.a); }
}), { threshold: 0.8 });
views.forEach(v => io.observe(v.el));
function resize() { renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', resize); resize();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
  const H = innerHeight;
  for (const v of views) {
    const r = v.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H || r.width === 0) continue;
    v.player.update(dt);
    const b = H - r.bottom;
    renderer.setViewport(r.left, b, r.width, r.height); renderer.setScissor(r.left, b, r.width, r.height);
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix(); renderer.render(v.scene, v.cam);
  }
});
</script>
