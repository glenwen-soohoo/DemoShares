<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<!--
  DemoShares 交接對照 | 產地直送商品頁改版 demo・portal 入口
  portal 無對應正式站 view（純 demo 索引頁，工程不需照抄）。
  連到的子頁（各頁檔頭有自己的對照）：
    前台：direct-product-detail(ItemDetail).html
    後台：direct-product-edit(Edit18).html
  需求與缺口清單見 Obsidian：GreenBox/02_一般需求/202611_產地直送商品頁改版/
-->
<meta charset="UTF-8">
<title>產地直送商品頁改版 demo 索引</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; padding:56px 20px; font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
        font-size:16px; line-height:1.7; color:#1a1a1a; background:#fafbfb; }
  .wrap{ max-width:960px; margin:0 auto; }
  h1{ font-size:30px; margin:0 0 4px; color:#4ba83b; }
  .sub{ color:#999; font-size:14px; margin:0 0 32px; }

  .side{ margin-bottom:40px; }
  .side>h2{ font-size:20px; font-weight:700; color:#1a1a1a; margin:0 0 16px; padding-left:12px; border-left:4px solid #4ba83b; }

  .entries{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .entries{ grid-template-columns:1fr; } }

  .entry{ display:flex; flex-direction:column; background:#fff; border:1px solid #e0e4e6; border-radius:4px;
          padding:20px; text-decoration:none; color:inherit; transition:border-color .15s, box-shadow .15s, transform .15s; }
  .entry:hover{ border-color:#4ba83b; box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .entry .name{ font-size:16px; font-weight:700; color:#4ba83b; margin-bottom:4px; }
  .entry .desc{ font-size:13px; color:#595757; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>產地直送商品頁改版・demo</h1>
  <p class="sub">2026-11</p>

  <div class="side">
    <h2>前台</h2>
    <div class="entries">
      <a class="entry" href="direct-product-detail(ItemDetail).html">
        <span class="name">商品頁｜現況 1:1</span>
        <span class="desc">線上商品頁的 markup，直接連真站 14 支樣式檔。還沒有這次需求的新區塊，是疊新功能的底。</span>
      </a>
    </div>
  </div>

  <div class="side">
    <h2>後台</h2>
    <div class="entries">
      <a class="entry" href="direct-product-edit(Edit18).html">
        <span class="name">產品編輯頁｜現況 1:1</span>
        <span class="desc">Edit18 的「產品基本資訊」卡逐字還原，連那一頁實際載的 10 支樣式檔。還沒有新區塊。</span>
      </a>
    </div>
  </div>

  <div class="side">
    <h2>第一版（已歸檔）</h2>
    <div class="entries">
      <a class="entry" href="direct-product-detail-v1(archived).html">
        <span class="name">商品頁｜第一版的重點區與九個情境</span>
        <span class="desc">外殼與色票是設計示意稿不是真站值，所以重做。重點區與測試台的互動邏輯留在這裡。</span>
      </a>
      <a class="entry" href="direct-product-edit-v1(archived).html">
        <span class="name">產品編輯頁｜第一版的三個新欄位</span>
        <span class="desc">產季 12 格、大小對照、重點區預覽的互動邏輯留在這裡，疊回新版時可以抄。</span>
      </a>
    </div>
  </div>
</div>
</body>
</html>
