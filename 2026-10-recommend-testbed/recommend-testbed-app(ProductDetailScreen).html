const CROSS = {
  產地直送: ['冷凍超市', '粥寶寶'],
  冷凍超市: ['產地直送', '粥寶寶'],
  粥寶寶: ['產地直送', '冷凍超市'],
  益菓保: ['粥寶寶', '產地直送'],
};

<script>
const S={line:'粥寶寶',logged:true,order:'addon',cross:2,rebuy:true,count:6,edge:'normal'};
const PANEL=[
 ['line','產線',[['產地直送','產地直送'],['冷凍超市','冷凍超市'],['粥寶寶','粥寶寶'],['益菓保','益菓保']]],
 ['logged','登入狀態',[[true,'已登入'],[false,'未登入']]],
 ['order','版位順序',[['addon','加購品在上'],['rec','猜你喜歡在上']]],
 ['cross','推別條產線',[[0,'只推自己'],[2,'最多 2 個'],[99,'不限']]],
 ['rebuy','「可以再買」',[[true,'開'],[false,'關']]],
 ['count','推幾個',[[4,'4'],[6,'6'],[10,'10']]],
 ['edge','例外情境',[['normal','正常'],['timeout','逾時'],['empty','沒結果']]],
];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const pic=(p,c)=>`<img class="${c||''}" src="${CDN}${p}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;noimg&quot;>商品圖</div>'">`;

function renderPanel(){
  const bd=document.getElementById('tbpBody');bd.innerHTML='';
  PANEL.forEach(([k,label,opts])=>{
    const f=el('div','f');f.appendChild(el('span',null,label));
    const seg=el('div','seg');
    opts.forEach(([v,t])=>{const b=el('button',S[k]===v?'on':null,t);b.onclick=()=>{S[k]=v;renderPanel();render();};seg.appendChild(b);});
    f.appendChild(seg);bd.appendChild(f);
  });
  const w=!S.logged?'未登入：不呼叫推薦，區塊標題變成「為您推薦」，顯示本產線熱門。'
    :S.edge==='timeout'?'推薦逾時（3 秒）：降級顯示本產線熱門，App 其他部分不受影響。'
    :S.edge==='empty'?'推薦回來是空的：行為跟逾時一樣，降級不留白。':null;
  if(w)bd.appendChild(el('div','tip',w));
  bd.appendChild(el('div','tip','手機框外的面板不是 App 畫面的一部分。用真手機打開這一頁，框會自動滿版、面板不顯示。'));
}
function recs(){
  const d=DATA[S.line];
  const own=d.items.filter(x=>!x.addon).map(x=>({...x,line:S.line}));
  const nCross=S.cross===0?0:(S.cross===99?Math.floor(S.count/2):S.cross);
  const cross=S.cross?CROSS[S.line].flatMap(l=>DATA[l].items.filter(x=>!x.addon).map(x=>({...x,line:l}))).filter(x=>!x.bought).slice(0,nCross):[];
  const rebuy=S.logged&&S.rebuy?own.filter(x=>x.bought>0).sort((a,b)=>(b.due?1:0)-(a.due?1:0)).slice(0,5):[];
  const ids=new Set(rebuy.map(x=>x.id));
  const discover=[...own.filter(x=>!x.bought&&!ids.has(x.id)).slice(0,Math.max(0,S.count-cross.length)),...cross];
  return {rebuy,discover};
}
function tagOf(it,kind){
  if(kind==='rebuy')return it.due?['該補貨了','#fff6e0']:['常買','#fdeef0'];
  if(it.line!==S.line)return ['熱門','#f1f2f7'];
  return ['一起買','#e9f4e5'];
}
function rail(list,kind){
  const r=el('div','ap-rail');
  list.forEach(it=>{
    const [tag,bg]=tagOf(it,kind);
    const c=el('div','ap-card');
    c.innerHTML=`${pic(it.pic)}<div class="ap-card-bd"><div class="ap-card-nm">${it.name}</div>
      <div><span class="ap-tag" style="background:${bg};color:#5a6372">${tag}</span></div>
      <div class="ap-card-pr">$${it.price.toLocaleString()} <span style="font-size:11px;font-weight:400">起</span></div></div>`;
    r.appendChild(c);
  });
  return r;
}
function render(){
  const d=DATA[S.line],a=d.anchor;
  document.getElementById('frame').style.setProperty('--line',LINE_COLOR[S.line]);
  document.getElementById('apBar').textContent=S.line;
  document.getElementById('apPrice').textContent='$'+a.price.toLocaleString();
  const sc=document.getElementById('apScroll');sc.innerHTML='';
  sc.appendChild(el('div',null,pic(a.pic,'ap-hero')));
  sc.appendChild(el('div','ap-body',`<h2 class="ap-name">${a.name}</h2>
    <div class="ap-meta">溫層配送：<b>${a.temp}</b><br>共 ${a.specs} 種規格可選<br>原產地：台灣</div>`));

  const addon=el('section','ap-sec');
  addon.innerHTML=`<h2>加價購</h2><div class="ap-addon"><div class="ap-addon-hd">優惠加購商品</div>
    ${ADDONS[S.line].map(x=>`<div class="ap-addon-row"><input type="checkbox">${pic(x.pic)}
      <div class="ap-addon-nm">${x.name}</div><div class="ap-addon-pr">$${x.price.toLocaleString()}</div></div>`).join('')}</div>`;

  let rec=null;
  if(S.line!=='益菓保'){
    rec=el('section','ap-sec');
    rec.appendChild(el('h2',null,'猜你會喜歡'));
    if(!S.logged||S.edge!=='normal'){
      rec.querySelector('h2').textContent='為您推薦';
      rec.appendChild(rail(d.items.filter(x=>!x.addon).slice(0,4).map(x=>({...x,line:S.line,bought:0})),'hot'));
    }else{
      const {rebuy,discover}=recs();
      if(rebuy.length){rec.appendChild(el('p',null,'您常買・可以再買'));rec.appendChild(rail(rebuy,'rebuy'));}
      if(discover.length){rec.appendChild(el('p',null,'買這個的客人也常買'));rec.appendChild(rail(discover,'discover'));}
    }
  }
  (S.order==='addon'?[addon,rec]:[rec,addon]).forEach(b=>{if(b)sc.appendChild(b);});
  sc.appendChild(el('div','ap-omit','商品描述 ／ 貼心叮嚀 ／ 評論（相同版型，略）'));
}
renderPanel();render();
</script>
