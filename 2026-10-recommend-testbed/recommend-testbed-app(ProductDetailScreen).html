  .ap-rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;

  .ap-card.is-sk{border-color:#f0f1f3}

<script>
/* 規則已經定案為「拿到什麼用什麼」，所以面板只剩顯示相關的開關。
   推薦怎麼算、推幾個、推不推別條產線，全部由推薦服務決定，App 端不過濾也不重排。 */
const S = {
  line: '粥寶寶',
  logged: true,
  addonCount: 6,
  edge: 'normal',
  limit: 18,     // 跟服務要幾個（規格：預設 10、上限 20，這裡撐滿好看版面）
  addonOpen: false,
};

const PANEL = [
  ['line', '產線', [['產地直送', '產地直送'], ['冷凍超市', '冷凍超市'], ['粥寶寶', '粥寶寶'], ['益菓保', '益菓保']]],
  ['logged', '登入狀態', [[true, '已登入'], [false, '未登入']]],
  ['addonCount', '這個商品有幾個加價購', { min: 0, max: 10 }],
  ['edge', '例外情境', [['normal', '正常'], ['loading', '載入中'], ['timeout', '推薦拿不到'], ['noimg', '商品缺圖']]],
];

function addonHint(n) {
  if (n === 0) return '購買區不出現加價購';
  if (n <= 2) return n + ' 筆，直接全部顯示';
  return '預設顯示 2 筆，其餘 ' + (n - 2) + ' 筆收在「更多加價購商品」裡';
}

const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const pic = (p, c) => '<img class="' + (c || '') + '" src="' + CDN + p + '" alt="" loading="lazy"'
  + ' onerror="this.outerHTML=\'<div class=&quot;noimg&quot;>商品圖</div>\'">';

function renderPanel() {
  const bd = document.getElementById('tbpBody');
  bd.innerHTML = '';
  PANEL.forEach(([k, label, opts]) => {
    const f = el('div', 'f');
    f.appendChild(el('span', null, label));
    if (Array.isArray(opts)) {
      const seg = el('div', 'seg');
      opts.forEach(([v, t]) => {
        const b = el('button', S[k] === v ? 'on' : null, t);
        b.onclick = () => { S[k] = v; renderPanel(); render(); };
        seg.appendChild(b);
      });
      f.appendChild(seg);
    } else {
      const r = el('input');
      r.type = 'range'; r.min = opts.min; r.max = opts.max; r.value = S[k];
      r.oninput = () => { S[k] = Number(r.value); S.addonOpen = false; renderPanel(); render(); };
      f.appendChild(r);
      f.appendChild(el('div', 'hint', S[k] + ' 個 ／ ' + addonHint(S[k])));
    }
    bd.appendChild(f);
  });

  const w = S.edge === 'loading'
    ? '推薦還沒回來：骨架佔住的高度跟填完一模一樣，所以推薦進來時版面不會跳（原始需求 §2.4，非同步是必須）。商品頁其他部分不等推薦。'
    : !S.logged ? '未登入訪客：不呼叫推薦，區塊標題換成「為您推薦」，顯示既有的那份本產線清單。'
    : S.edge === 'timeout' ? '推薦逾時或沒有結果：兩種畫面一樣，都降級成本產線熱門，不留白。'
    : S.edge === 'noimg' ? '部分商品缺圖：卡片換成灰底佔位，高度不變。' : null;
  if (w) bd.appendChild(el('div', 'tip', w));
  bd.appendChild(el('div', 'tip', '手機框外的面板不是 App 畫面的一部分。用真手機打開這一頁，框會自動滿版、面板不顯示。'));
}

/* 這一頁有幾個加價購由滑桿決定。真資料每條產線只有 4~6 個，
   要湊到 10 就把清單循環接下去，id 會重複所以另外給 _key */
function addonsForPage() {
  const src = ADDONS[S.line] || [];
  const n = Math.max(0, Math.min(10, S.addonCount));
  if (!src.length || n === 0) return [];
  return Array.from({ length: n }, (_, i) => ({ ...src[i % src.length], _key: i }));
}

/* 推薦：照服務端回什麼就顯示什麼。本產線排前面不是 App 在篩，
   是服務端的共購分數自然讓同類商品浮上來（原始需求 §0.1 模式 B） */
function computeRecs() {
  const lines = [S.line, ...Object.keys(DATA).filter((L) => L !== S.line)];
  const pool = lines.flatMap((L) => DATA[L].items.filter((x) => !x.addon).map((x) => ({ ...x, line: L })));
  const own = pool.filter((x) => x.line === S.line);
  const rebuy = S.logged ? own.filter((x) => x.bought > 0).slice(0, 5) : [];  // 服務端上限就是 5
  const ids = new Set(rebuy.map((x) => x.id));
  const discover = pool.filter((x) => !x.bought && !ids.has(x.id)).slice(0, S.limit - rebuy.length);
  const all = [...rebuy, ...discover];
  if (S.edge === 'noimg') all.forEach((x, i) => { if (i % 3 === 1) x._noimg = true; });
  return all;
}
const hotItems = () => DATA[S.line].items.filter((x) => !x.addon).slice(0, 6)
  .map((x) => ({ ...x, line: S.line, bought: 0 }));

/* 瀏覽紀錄：跟網頁版同一份假資料邏輯，標籤是「多久以前看的」 */
function historyItems() {
  const skip = new Set([DATA[S.line].anchor.id]);
  const pool = [];
  [S.line, ...Object.keys(DATA).filter((L) => L !== S.line)].forEach((L) => {
    DATA[L].items.forEach((x) => { if (!x.addon && !skip.has(x.id)) pool.push({ ...x, line: L }); });
  });
  const AGO = ['剛剛', '2 小時前', '今天稍早', '昨天', '昨天', '2 天前',
    '3 天前', '3 天前', '4 天前', '5 天前', '6 天前', '上週'];
  return pool.slice(0, AGO.length).map((x, i) => ({ ...x, _ago: AGO[i] }));
}

/* 標籤兩色：買過的用產線主色，其餘灰色（跟網頁版同一個定案） */
function tagOf(it, kind) {
  if (kind === 'history') return [it._ago, false];
  if (it.bought > 0) return ['常買', true];
  if (it.line !== S.line) return ['熱門', false];
  return ['同類熱門', false];
}
function railCard(it, kind) {
  const [tag, mine] = tagOf(it, kind);
  const style = mine
    ? 'background:color-mix(in srgb, ' + LINE_COLOR[S.line] + ' 16%, #fff);color:' + LINE_COLOR[S.line]
    : 'background:rgba(255,255,255,.92);color:#6b7585';
  const c = el('div', 'ap-card');
  const imgHtml = it._noimg ? '<div class="noimg">商品圖</div>' : pic(it.pic);
  c.innerHTML = '<div class="ap-imgwrap">' + imgHtml
    + '<span class="ap-tag" style="' + style + '">' + tag + '</span></div>'
    + '<div class="ap-card-bd"><div class="ap-card-nm">' + it.name + '</div>'
    + '<div class="ap-card-pr">$' + it.price.toLocaleString()
    + '<span style="font-size:11px;font-weight:400"> 起</span></div></div>';
  return c;
}
function rail(list, kind) {
  const r = el('div', 'ap-rail');
  list.forEach((it) => r.appendChild(railCard(it, kind)));
  return r;
}
function skeletonRail() {
  const r = el('div', 'ap-rail');
  // 用真卡片當骨架，所以高度一定跟填完一樣；CSS 再把字染透明、底染灰
  const dummy = { name: '佔位商品名稱佔位商品名稱佔位', price: 0, pic: '', line: S.line, bought: 0, _noimg: true };
  for (let i = 0; i < 4; i += 1) {
    const c = railCard(dummy, 'rec');
    c.classList.add('is-sk');
    r.appendChild(c);
  }
  return r;
}
function section(title, node) {
  const sec = el('section', 'ap-sec');
  sec.appendChild(el('h2', null, title));
  sec.appendChild(node);
  return sec;
}

/* 勾起來的加價購另外存（_key → 件數），按下加入菜籃才一起進菜籃。
   每項限購 3 件，所以存的是數量不是布林 */
const ADDON_PICK = new Map();
let CART_N = 0;

function addonStrip() {
  const items = addonsForPage();
  if (!items.length) return null;
  const shown = S.addonOpen ? items.length : Math.min(2, items.length);
  const box = el('div', 'ap-addon');
  box.innerHTML = '<div class="ap-addon-hd">加價購商品<span class="note">勾選後與主商品一併結帳</span></div>';

  items.forEach((it, i) => {
    const on = ADDON_PICK.has(it._key);
    const qty = ADDON_PICK.get(it._key) || 1;
    const row = el('label', 'ap-addon-row' + (on ? ' checked' : ''));
    if (i >= shown) row.hidden = true;
    row.innerHTML = '<input type="checkbox"' + (on ? ' checked' : '') + '>'
      + pic(it.pic)
      + '<div class="ap-addon-nm">' + it.name + '</div>'
      + '<select class="ap-addon-qty">'
      + [1, 2, 3].map((q) => '<option' + (q === qty ? ' selected' : '') + '>' + q + '</option>').join('')
      + '</select>'
      + '<div class="ap-addon-pr">'
      + (it.orig ? '<span class="orig">$' + it.orig.toLocaleString() + '</span>' : '')
      + '<span class="now">$' + it.price.toLocaleString() + '</span></div>';
    const sel = row.querySelector('.ap-addon-qty');
    row.querySelector('input').onchange = (e) => {
      if (e.target.checked) ADDON_PICK.set(it._key, Number(sel.value));
      else ADDON_PICK.delete(it._key);
      row.classList.toggle('checked', e.target.checked);
      paintBuyBtn();
    };
    // 數量下拉是自己的控制，點它不該連帶勾選整列
    sel.onclick = (e) => e.stopPropagation();
    sel.onchange = (e) => {
      e.stopPropagation();
      if (ADDON_PICK.has(it._key)) ADDON_PICK.set(it._key, Number(sel.value));
    };
    box.appendChild(row);
  });

  if (items.length > 2) {
    const more = el('button', 'ap-addon-more',
      S.addonOpen ? '▴ 收合加價購商品' : '▾ 更多加價購商品（還有 ' + (items.length - 2) + ' 項）');
    more.type = 'button';
    more.onclick = () => { S.addonOpen = !S.addonOpen; render(); };
    box.appendChild(more);
  }
  return box;
}

/* 加入菜籃不是開關：按第二次是再加一次，不是移除，文案也始終是「加入菜籃」
   （真站 ItemDetail.cshtml:1276 的 checkAndAddToCart 沒有任何移除分支） */
function paintBuyBtn() {
  const n = ADDON_PICK.size;
  document.getElementById('apBuy').textContent = '加入菜籃' + (n ? '（含 ' + n + ' 項加購）' : '');
}
function toast(msg) {
  const sc = document.getElementById('apScroll');
  const old = sc.querySelector('.ap-toast');
  if (old) old.remove();
  const t = el('div', 'ap-toast', msg);
  sc.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function render() {
  const d = DATA[S.line];
  const a = d.anchor;
  document.getElementById('frame').style.setProperty('--line', LINE_COLOR[S.line]);
  document.getElementById('apBar').textContent = S.line;
  document.getElementById('apPrice').textContent = '$' + a.price.toLocaleString();

  const sc = document.getElementById('apScroll');
  sc.innerHTML = '';
  sc.appendChild(el('div', null, pic(a.pic, 'ap-hero')));
  sc.appendChild(el('div', 'ap-body', '<h2 class="ap-name">' + a.name + '</h2>'
    + '<div class="ap-meta">溫層配送：<b>' + a.temp + '</b><br>共 ' + a.specs + ' 種規格可選<br>原產地：台灣</div>'));

  const strip = addonStrip();
  if (strip) sc.appendChild(section('加價購', strip));

  // 猜你喜歡：一塊。四條產線都有（益菓保不顯示的舊例外不沿用，新機制統一）
  const degraded = !S.logged || S.edge === 'timeout';
  if (S.edge === 'loading') {
    sc.appendChild(section('猜你喜歡', skeletonRail()));
  } else {
    sc.appendChild(section(degraded ? '為您推薦' : '猜你喜歡',
      rail(degraded ? hotItems() : computeRecs(), 'rec')));
  }

  sc.appendChild(el('div', 'ap-omit', '商品描述 ／ 貼心叮嚀（WebView，相同版型，略）'));
  sc.appendChild(section('瀏覽紀錄', rail(historyItems(), 'history')));
  sc.appendChild(el('div', 'ap-omit', '商品評論（相同版型，略）'));

  paintBuyBtn();
}

document.getElementById('apBuy').onclick = () => {
  const picks = addonsForPage().filter((x) => ADDON_PICK.has(x._key));
  const add = 1 + picks.reduce((s, x) => s + (ADDON_PICK.get(x._key) || 1), 0);
  CART_N += add;
  const cnt = document.getElementById('apCnt');
  cnt.hidden = false;
  cnt.textContent = CART_N;
  toast(picks.length ? '已加入菜籃（含 ' + picks.length + ' 項加購）' : '已加入菜籃');
};

renderPanel();
render();
</script>
</body>
</html>
