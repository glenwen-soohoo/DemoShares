<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>加購設定・編輯 — 後台 demo</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ───── GoX Admin / base.css ─────
   後台殼共用 reset + 全域字型 + CSS 變數 token。
   color / spacing / radius 集中在 :root，後續元件一律 var(--gox-*) 取用，
   不要再回填 hex。 */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* ── 品牌綠 ── */
  --gox-green:           #4ba83b;   /* 主操作 / hover */
  --gox-green-hover:     #3d8c30;
  --gox-header-bg:       #D7F4DA;   /* header 淺綠底 */
  --gox-header-border:   #c2dfc4;

  /* ── 側欄深灰 ── */
  --gox-sider-bg:        #32323a;
  --gox-sider-sub-bg:    #28282e;
  --gox-sider-active-bg: #202025;
  --gox-sider-text:      #fff;
  --gox-sider-sub-text:  #cccccc;
  --gox-sider-active-text: bisque;

  /* ── 內容區 ── */
  --gox-content-bg:      #f1f2f7;
  --gox-card-bg:         #ffffff;
  --gox-card-border:     #e6e6e6;

  /* ── 文字 ── */
  --gox-text:            #333333;
  --gox-text-sub:        #666666;
  --gox-text-muted:      #888888;

  /* ── 語意色（補 antd primary #1677ff 之外）── */
  --gox-danger:          #dc4e43;   /* 主危險（與前台一致） */
  --gox-danger-soft:     #ff4d4f;   /* antd danger 替代值 */
  --gox-warning:         #fbbf24;
  --gox-info:            #2c98f0;
  --gox-success:         #52c41a;

  /* ── 元件尺寸 ── */
  --gox-header-h:        49px;
  --gox-sider-w:         160px;     /* Gift 170 + B2B 150 折衷 */
  --gox-radius:          4px;
  --gox-radius-lg:       6px;
  --gox-space-unit:      4px;

  /* ── 字型 / 字級 ── */
  --gox-font-family:     'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體',
                         -apple-system, BlinkMacSystemFont, sans-serif;
  --gox-font-size-base:  14px;
  --gox-font-size-sm:    13px;
  --gox-font-size-xs:    12px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
  color: var(--gox-text);
  background: var(--gox-content-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--gox-info); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 整個後台 wrapper（一定要包這層才能套色） */
.gox-page {
  min-height: 100vh;
  background: var(--gox-content-bg);
  color: var(--gox-text);
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
}

/* ───── GoX Admin / header.css ─────
   固定在頂端的淺綠 header：
     左：無毒農 logo（小張）
     中：breadcrumb（B2B管理 > 訂單管理）
     右：使用者快捷區（登出、通知；可選） */

.gox-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--gox-header-h);
  background: var(--gox-header-bg);
  border-bottom: 1px solid var(--gox-header-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: var(--gox-font-family);
}

.gox-header .gox-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.gox-header .gox-logo img {
  height: 28px;
  width: auto;
  max-width: 120px;
  display: block;
}

/* ── breadcrumb ── */
.gox-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gox-text-sub);
  font-size: 15px;
  flex: 1;
  min-width: 0;
}
.gox-breadcrumb a {
  color: var(--gox-green);
  text-decoration: none;
}
.gox-breadcrumb a:hover { text-decoration: underline; }
.gox-breadcrumb .sep {
  color: var(--gox-text-muted);
  font-size: 12px;
}
.gox-breadcrumb strong {
  color: #000;
  font-weight: 700;
}

/* ── 右側使用者快捷區（可選）── */
.gox-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  font-size: var(--gox-font-size-sm);
}
.gox-header-right .gox-user {
  color: var(--gox-text);
}
.gox-header-right .gox-icon-btn {
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--gox-text-sub);
  padding: 4px 8px;
  font-family: inherit;
  font-size: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--gox-radius);
  white-space: nowrap;
}
.gox-header-right .gox-user { white-space: nowrap; }
.gox-header-right .gox-icon-btn:hover {
  background: rgba(0, 0, 0, .05);
  color: var(--gox-text);
}

/* ───── GoX Admin / sidebar.css ─────
   左側深灰固定側欄。支援：
     - 一級項目（可帶 badge 紅點）
     - 可摺疊群組（▶ / ▼）
     - 二級項目（active 高亮）
     - disabled 樣式 */

.gox-sidebar {
  width: var(--gox-sider-w);
  flex-shrink: 0;
  background: var(--gox-sider-bg);
  color: var(--gox-sider-text);
  padding: 8px 0;
  font-size: var(--gox-font-size-sm);
  overflow-y: auto;
  position: sticky;
  top: var(--gox-header-h);
  height: calc(100vh - var(--gox-header-h));
  font-family: var(--gox-font-family);
}

/* ── 一級項目 / 群組標題 ── */
.gox-sidebar .gox-menu-item,
.gox-sidebar .gox-menu-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  color: var(--gox-sider-text);
  background: transparent;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: var(--gox-font-size-sm);
  font-family: inherit;
  line-height: 1.5;
  user-select: none;
}
.gox-sidebar .gox-menu-item:hover,
.gox-sidebar .gox-menu-title:hover {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}

/* disabled（demo 未開放的入口） */
.gox-sidebar .gox-menu-item.is-disabled {
  cursor: default;
  color: #888;
}
.gox-sidebar .gox-menu-item.is-disabled:hover {
  background: transparent;
  color: #888;
}

/* 一級項目 active（無子項目、可直接點的頁面，例如「獨立平台」）
   字色用 !important 壓過腳本給一級項的 inline color:inherit，對齊二級 active 的 bisque */
.gox-sidebar .gox-menu-item.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text) !important;
  font-weight: 600;
}

/* 箭頭（▶ / ▼） */
.gox-sidebar .gox-arrow {
  display: inline-block;
  width: 12px;
  font-size: 9px;
  flex-shrink: 0;
  transition: transform .15s;
}

/* badge 紅點 */
.gox-sidebar .gox-badge {
  margin-left: auto;
  background: var(--gox-danger);
  color: #fff;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 11px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

/* ── 摺疊群組 ── */
.gox-sidebar .gox-menu-group.is-open .gox-menu-title {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}
.gox-sidebar .gox-menu-children {
  background: var(--gox-sider-sub-bg);
}

/* 二級項目 */
.gox-sidebar .gox-menu-child {
  display: block;
  padding: 8px 14px 8px 32px;
  color: var(--gox-sider-sub-text);
  text-decoration: none;
  font-size: var(--gox-font-size-sm);
}
.gox-sidebar .gox-menu-child:hover {
  background: #252530;
  color: var(--gox-sider-active-text);
  text-decoration: none;
}
.gox-sidebar .gox-menu-child.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text);
  font-weight: 600;
}

/* ───── GoX Admin / content.css ─────
   內容區共用元件：
     .gox-content / .gox-card / button / form / table / modal / tab / switch / icon-btn
   全部用 :root 變數，不直接寫 hex。 */

/* ── 主體佈局：header 下方的 sidebar + content ── */
.gox-body {
  display: flex;
  min-height: calc(100vh - var(--gox-header-h));
}
.gox-content {
  flex: 1;
  min-width: 0;          /* 讓子層 table overflow 正常 */
  padding: 16px;
  overflow-x: auto;
  background: var(--gox-content-bg);
}

/* ─────────────────────────────────────────────────
   Toolbox：工具型頁面的主要工作區容器
   預設 960px 限寬置中（表單、設定、編輯頁讀起來舒服）
   修飾詞依內容寬度需求調整
   ─────────────────────────────────────────────────
   何時用：
     - 系統設定、個人資料、單筆編輯、單一表單
     - 內容上下流式排列、欄位不多
   何時不用：
     - 列表頁（要滿寬度顯示表格）
     - 看板、儀表板（多欄並列）
     - 包含寬表格的編輯頁（會被切掉）
   範例：
     <main class="gox-content">
       <div class="gox-toolbox">  ← 用這個
         <h2>系統設定</h2>
         <div class="gox-card">…</div>
       </div>
     </main>
*/
.gox-toolbox {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.gox-toolbox.is-narrow { max-width: 720px; }   /* 表單少欄位、登入頁、設定密碼 */
.gox-toolbox.is-wide   { max-width: 1200px; }  /* 多欄表單、含中型表格 */
.gox-toolbox.is-fluid  { max-width: none; }    /* 內容太擠時退回滿寬 */

/* ─────────────────────────────────────────────────
   Card：後台主要的「白卡片」容器
   ───────────────────────────────────────────────── */
.gox-card {
  background: var(--gox-card-bg);
  border: 1px solid var(--gox-card-border);
  border-radius: var(--gox-radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.gox-card-title {
  margin: 0;
  padding: 12px 16px;
  background: var(--gox-card-bg);
  border-bottom: 1px solid var(--gox-card-border);
  font-size: 16px;
  font-weight: 600;
  color: var(--gox-text);
}
.gox-card-title.is-green {            /* 綠色強調標題（如「贈品設定」） */
  background: var(--gox-green);
  color: #fff;
  border-bottom: 0;
}
.gox-card-body { padding: 16px; }
.gox-card-body.is-table-padding { padding: 0; }     /* table 自己有 padding 時用 */

/* 卡片頂端列：左標題 / 右操作按鈕 */
.gox-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─────────────────────────────────────────────────
   Button
   ───────────────────────────────────────────────── */
.gox-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  line-height: 1.5;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.gox-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* 主操作 — 品牌綠 */
.gox-btn-primary {
  background: var(--gox-green);
  color: #fff;
  border-color: var(--gox-green);
}
.gox-btn-primary:hover:not(:disabled) { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }

/* 次操作 — 白底邊框 */
.gox-btn-default {
  background: #fff;
  color: var(--gox-text);
  border-color: #ccc;
}
.gox-btn-default:hover:not(:disabled) { background: #f5f5f5; border-color: var(--gox-green); color: var(--gox-green); }

/* 危險 */
.gox-btn-danger {
  background: #fff;
  color: var(--gox-danger);
  border-color: var(--gox-danger);
}
.gox-btn-danger:hover:not(:disabled) { background: var(--gox-danger); color: #fff; }

/* 列表內小按鈕（檢視 / 編輯 / 刪除） */
.gox-btn-op {
  display: inline-block;
  margin-right: 4px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  color: var(--gox-text);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.gox-btn-op:hover { background: #f5f5f5; text-decoration: none; }

/* ─────────────────────────────────────────────────
   Form
   ───────────────────────────────────────────────── */
.gox-form-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.gox-form-row > label {
  min-width: 110px;
  color: var(--gox-text);
  font-weight: 500;
}
.gox-input,
.gox-select,
.gox-textarea {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  background: #fff;
  color: var(--gox-text);
  line-height: 1.5;
  min-height: 32px;
  box-sizing: border-box;
}
.gox-input:focus,
.gox-select:focus,
.gox-textarea:focus {
  outline: 2px solid var(--gox-green);
  outline-offset: -1px;
  border-color: var(--gox-green);
}
.gox-input:disabled,
.gox-select:disabled,
.gox-textarea:disabled {
  background: #f5f5f5;
  color: #999;
  cursor: not-allowed;
}
.gox-textarea { min-height: 80px; resize: vertical; }

.gox-radio-group, .gox-checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.gox-hint {
  color: var(--gox-text-muted);
  font-size: var(--gox-font-size-xs);
}

/* ─────────────────────────────────────────────────
   Table
   ───────────────────────────────────────────────── */
.gox-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--gox-font-size-sm);
  background: #fff;
}
.gox-table th {
  background: #fafafa;
  border-bottom: 1px solid var(--gox-card-border);
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--gox-text-sub);
  white-space: nowrap;
}
.gox-table td {
  padding: 12px 8px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.gox-table tr:hover td { background: #fafafa; }
.gox-table .cell-center { text-align: center; }
.gox-table .cell-right { text-align: right; }
.gox-table .cell-ops { white-space: nowrap; }
.gox-table .row-error td { background: #fff1f0; }
.gox-table .row-error:hover td { background: #ffe0de; }

/* ─────────────────────────────────────────────────
   Tab（頁籤）
   ───────────────────────────────────────────────── */
.gox-tab-group {
  display: inline-flex;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  overflow: hidden;
}
.gox-tab-btn {
  padding: 6px 20px;
  background: #fff;
  border: 0;
  cursor: pointer;
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  border-right: 1px solid #ccc;
  color: var(--gox-text);
}
.gox-tab-btn:last-child { border-right: 0; }
.gox-tab-btn.is-active {
  background: var(--gox-info);
  color: #fff;
}

/* ─────────────────────────────────────────────────
   Modal
   ───────────────────────────────────────────────── */
.gox-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.gox-modal-overlay.is-hidden { display: none; }
[hidden] { display: none !important; }
.gox-modal-box {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  min-width: 480px;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.gox-modal-box h4 { margin: 0 0 16px; font-size: 16px; }
.gox-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

/* ─────────────────────────────────────────────────
   Switch / Tag
   ───────────────────────────────────────────────── */
.gox-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  border-radius: 11px;
  border: 0;
  padding: 0;
  margin: 0;
  background: #d1d5db;
  cursor: pointer;
  transition: background .18s ease;
  vertical-align: middle;
}
.gox-switch.is-on { background: var(--gox-green); }
.gox-switch.is-disabled { opacity: .5; cursor: not-allowed; }
.gox-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .18s ease;
}
.gox-switch.is-on::after { transform: translateX(18px); }

.gox-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  font-weight: 600;
  background: #f0f0f0;
  color: var(--gox-text-sub);
  border: 1px solid #e0e0e0;
}
.gox-tag.is-success { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
.gox-tag.is-info    { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-warning { background: #fffbe6; color: #d4b106; border-color: #ffe58f; }
.gox-tag.is-danger  { background: #fff1f0; color: var(--gox-danger); border-color: #ffccc7; }

/* 溫層快速 tag（兩專案都會用） */
.gox-tag.is-frozen  { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-ambient { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }

/* ─────────────────────────────────────────────────
   Icon button（鉛筆 / 確認 / 取消）
   ───────────────────────────────────────────────── */
.gox-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--gox-radius);
  cursor: pointer;
  color: var(--gox-text-sub);
  font-size: 12px;
  font-family: inherit;
  transition: all .15s;
}
.gox-icon-btn:hover {
  background: #f0f4f8;
  color: var(--gox-info);
  border-color: #bcd4ea;
}
.gox-icon-btn.is-confirm { background: var(--gox-green); color: #fff; border-color: var(--gox-green); }
.gox-icon-btn.is-confirm:hover { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }
.gox-icon-btn.is-cancel  { background: #fff; color: #999; border-color: #ccc; }
.gox-icon-btn.is-cancel:hover  { background: #f5f5f5; color: var(--gox-danger); border-color: var(--gox-danger); }

/* ─────────────────────────────────────────────────
   通用工具 class
   ───────────────────────────────────────────────── */
/* 顯示 / 隱藏切換用。以前每個產出頁都自己再宣告一次，收進來統一提供。 */
.is-hidden { display: none; }

</style>
</head>
<body>
<div class="gox-page">

  .as-wrap{ display:flex; flex-direction:column; gap:16px; }

  .as-titlesub{ font-size:12px; font-weight:400; color:var(--gox-text-muted); margin-left:8px; }
  /* 讓卡片內的搜尋下拉不被卡片 overflow 裁掉（此頁卡片內無表格，可安全 visible）*/

  .as-mainid{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .as-mainid .nm{ font-size:15px; font-weight:700; }
  .as-mainid .meta{ font-size:13px; color:var(--gox-text-sub); font-variant-numeric:tabular-nums; }

  /* 加購品 item block（兩視角共用）：左＝內容(綠框資訊列＋欄位)、右＝動作(改編/上下架/移除) */
  .as-ib{ display:flex; flex-direction:column; gap:14px; border:1px solid var(--gox-card-border); border-radius:var(--gox-radius-lg); background:#fff; padding:14px; }
  .as-ib.is-bare{ border:0; padding:0; background:transparent; }   /* 加購品視角：卡片內唯一區塊，不要外框 */

  .as-ib-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }        /* 綠框＋按鈕同一排、垂直置中 */
  .as-ib-head .as-summary{ flex:1; min-width:240px; margin-bottom:0; }
  .as-acts{ display:flex; align-items:center; gap:12px; flex:none; }
  .as-acts .tg{ display:flex; align-items:center; gap:6px; }
  .as-swlabel{ font-size:12.5px; color:var(--gox-text-sub); min-width:2.2em; }

  .as-summary{ display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; background:#f2f8ee; border:1px solid #dcebd0; border-radius:var(--gox-radius); padding:9px 12px; margin-bottom:14px; }
  .as-badge{ font-size:11.5px; font-weight:700; color:var(--gox-text-sub); background:#fff; border:1px solid var(--gox-card-border); border-radius:var(--gox-radius); padding:2px 7px; flex:none; font-variant-numeric:tabular-nums; }
  .as-summary .nm{ font-size:14.5px; font-weight:700; color:var(--gox-text); }
  .as-summary .spec{ font-size:12.5px; color:var(--gox-text-sub); }
  .as-summary .calc{ margin-left:auto; font-size:13px; color:var(--gox-text-sub); font-variant-numeric:tabular-nums; }
  .as-summary .calc s{ color:var(--gox-text-muted); }
  .as-summary .calc .as-final{ color:var(--gox-text); font-weight:700; font-size:15px; }   /* 後台不強調折購感：折後用深色 */
  .as-summary .calc .as-save{ color:var(--gox-text-muted); margin-left:4px; }               /* 省 X 用灰字 */
  .as-summary.is-invalid{ background:#fff1f0; border-color:#ffccc7; }
  .as-summary.is-invalid .as-final,.as-summary.is-invalid .as-save{ color:var(--gox-danger); }

  .as-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  @media (max-width:820px){ .as-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .as-field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .as-field > span{ font-size:12px; font-weight:600; color:var(--gox-text-sub); display:flex; align-items:center; gap:8px; }
  .as-seg{ display:flex; border:1px solid #ccc; border-radius:var(--gox-radius); overflow:hidden; }
  .as-seg button{ flex:1; border:0; background:#fff; color:var(--gox-text-sub); font-size:12.5px; font-weight:600; padding:7px 6px; cursor:pointer; font-family:inherit; }
  .as-seg button + button{ border-left:1px solid #ccc; }
  .as-seg button.is-active{ background:var(--gox-green); color:#fff; }
  .as-valwrap{ display:flex; align-items:center; gap:6px; }
  .as-valwrap .gox-input{ flex:1; min-width:0; font-variant-numeric:tabular-nums; }
  .as-unit{ font-size:12.5px; color:var(--gox-text-sub); flex:none; white-space:nowrap; }
  .as-daterange{ display:flex; align-items:center; gap:6px; }
  .as-daterange .gox-input{ flex:1; min-width:0; font-variant-numeric:tabular-nums; }
  .as-daterange .as-sep{ color:var(--gox-text-muted); flex:none; }
  .as-eff{ display:inline-block; font-size:11px; font-weight:700; border-radius:4px; padding:1px 7px; }
  .as-eff.active{ background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
  .as-eff.wait{ background:#fffbe6; color:#d4b106; border:1px solid #ffe58f; }
  .as-eff.expired{ background:#f5f5f5; color:#999; border:1px solid #e0e0e0; }

  /* 掛載主商品：簡單列 */
  .as-list{ display:flex; flex-direction:column; gap:10px; }
  .as-maprow{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
              border:1px solid var(--gox-card-border); border-radius:var(--gox-radius-lg); background:#fff; padding:12px 14px; }
  .as-maprow.is-off{ opacity:.55; }
  .as-idblock{ display:flex; align-items:center; gap:10px; min-width:0; }
  .as-idblock .as-badge{ background:#f1f2f7; }
  .as-sname{ font-size:14px; font-weight:700; color:var(--gox-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .as-rowacts{ display:flex; align-items:center; gap:10px; flex:none; }
  .as-switch{ display:inline-flex; align-items:center; gap:5px; border:1px solid #ccc; background:#fff; color:var(--gox-info);
              border-radius:var(--gox-radius); padding:4px 10px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .as-switch:hover{ border-color:var(--gox-info); background:#f0f7ff; }
  .as-switch svg{ width:13px; height:13px; }

  /* 加入列：打字搜尋 autocomplete */
  .as-addrow{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .ac{ position:relative; flex:1; max-width:440px; }
  .ac-input{ width:100%; }
  .ac-list{ position:absolute; z-index:40; left:0; right:0; top:calc(100% + 4px); background:#fff; border:1px solid #d3dad2; border-radius:6px;
            box-shadow:0 6px 20px rgba(0,0,0,.14); max-height:240px; overflow-y:auto; display:none; }
  .ac-list.is-open{ display:block; }
  .ac-item{ padding:8px 12px; font-size:13px; cursor:pointer; line-height:1.5; display:flex; gap:8px; align-items:baseline; }
  .ac-item:hover{ background:#f3faf1; }
  .ac-item b{ color:var(--gox-text); }
  .ac-item .code{ color:var(--gox-text-muted); font-size:12px; margin-left:auto; font-variant-numeric:tabular-nums; }
  .ac-empty{ padding:10px 12px; font-size:13px; color:var(--gox-text-muted); }

  .as-savebar{ position:sticky; bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
               background:#fff; border:1px solid var(--gox-card-border); border-radius:var(--gox-radius-lg); box-shadow:0 -1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.08); padding:12px 18px; }
  .as-savebar a.gox-btn{ text-decoration:none; }
  .as-status{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--gox-text-sub); }
  .as-dot{ width:7px; height:7px; border-radius:50%; background:var(--gox-text-muted); flex:none; }

  .as-status.is-invalid{ color:var(--gox-danger); } .as-status.is-invalid .as-dot{ background:var(--gox-danger); }

 <div class="as-wrap">

<script>
(function(){
  var TODAY='2026-09-16';
  var money=function(n){ return '$'+Math.round(n).toLocaleString('en-US'); };
  var esc=function(s){ return String(s); };
  var ADDONS={
    99753:{prod:'316 不鏽鋼保溫瓶', spec:'單瓶 500ml', orig:399, mode:'fixed', val:50, s:'2026-09-01', e:'2026-09-30', up:true},
    101509:{prod:'手沖濾掛咖啡', spec:'10 入袋裝', orig:299, mode:'percent', val:0.8, s:'', e:'', up:true},
    36007:{prod:'冷壓初榨苦茶油', spec:'250ml 玻璃瓶', orig:420, mode:'fixed', val:60, s:'2026-10-01', e:'2026-10-31', up:true},
    24011:{prod:'有機黑芝麻粉', spec:'300g 罐裝', orig:280, mode:'fixed', val:40, s:'2026-08-01', e:'2026-08-31', up:false}
  };
  var MAINS={ 40894:{name:'台灣蜜棗禮盒 3斤裝'}, 55210:{name:'日曬紅龍果原箱'}, 61120:{name:'冬季草莓禮盒（已下架）'}, 47788:{name:'當季鮮採蔬菜箱'} };
  var pairs=[ {a:99753,m:40894,on:true},{a:99753,m:55210,on:true},{a:99753,m:61120,on:false},
              {a:101509,m:40894,on:true},{a:36007,m:40894,on:true} ];
  var view={type:'addon', id:99753};

  function finalOf(a){ return a.mode==='fixed'?a.orig-a.val:Math.round(a.orig*a.val); }
  function mainsOf(aid){ return pairs.filter(function(p){return p.a==aid;}); }
  function addonsOf(mid){ return pairs.filter(function(p){return p.m==mid;}); }
  function effStatus(a){
    var s=(a.s&&a.s!=='不指定')?a.s:'', e=(a.e&&a.e!=='不指定')?a.e:'';
    if(s && TODAY<s) return {t:'尚未生效', c:'wait'};
    if(e && TODAY>e) return {t:'已失效', c:'expired'};
    return {t:'套用中', c:'active'};
  }
  function switchBtn(kind,id,label){
    return '<button class="as-switch" data-to-'+kind+'="'+id+'" title="改為編輯此'+label+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16H3v4M17 8h4V4M4 20l6-6M20 4l-6 6"/></svg>改編此'+label+'</button>';
  }

  // 加購品 item block（兩視角共用）。isSubject＝加購品視角的主體（右側放上下架）；否則放改編/啟用/移除
  function addonBlock(aid, pair, isSubject){
    var a=ADDONS[aid], fin=finalOf(a), bad=fin<=0, st=effStatus(a), unit=a.mode==='fixed'?'元':'（0～1）';
    var acts = isSubject
      ? '<div class="tg"><button class="gox-switch '+(a.up?'is-on':'')+'" data-up="'+aid+'"></button><span class="as-swlabel">'+(a.up?'上架':'下架')+'</span></div>'
      : switchBtn('addon',aid,'加購品')
        + '<div class="tg"><button class="gox-switch '+(pair.on?'is-on':'')+'" data-toggle="'+pair.a+'-'+pair.m+'"></button><span class="as-swlabel">'+(pair.on?'啟用':'停用')+'</span></div>'
        + '<button class="gox-icon-btn is-cancel" data-rm="'+pair.a+'-'+pair.m+'" title="移除">✕</button>';
    var off = !isSubject && !pair.on;
    return '<div class="as-ib'+(off?' is-off':'')+(isSubject?' is-bare':'')+'" data-addon="'+aid+'">'
      + '<div class="as-ib-head"><div class="as-summary'+(bad?' is-invalid':'')+'"><span class="as-badge">規格ID '+aid+'</span><span class="nm">'+esc(a.prod)+'</span><span class="spec">'+esc(a.spec)+'</span>'
      + '<span class="calc">原價 <s>'+money(a.orig)+'</s> → 折後 <b class="as-final">'+money(fin)+'</b><span class="as-save">'+(bad?'折後 ≤ $0':'省 '+money(a.orig-fin))+'</span></span></div>'
      + '<div class="as-acts">'+acts+'</div></div>'
      + '<div class="as-grid">'
        + '<div class="as-field"><span>折抵方式</span><div class="as-seg" data-seg><button class="'+(a.mode==='fixed'?'is-active':'')+'" data-mode="fixed">固定金額</button><button class="'+(a.mode==='percent'?'is-active':'')+'" data-mode="percent">百分比</button></div></div>'
        + '<div class="as-field"><span>折扣數值</span><div class="as-valwrap"><input class="gox-input as-val" value="'+a.val+'"><span class="as-unit">'+unit+'</span></div></div>'
        + '<div class="as-field" style="grid-column:span 2;"><span>生效期間 <span class="as-eff '+st.c+'">'+st.t+'</span></span><div class="as-daterange"><input class="gox-input as-s" value="'+(a.s||'不指定')+'"><span class="as-sep">→</span><input class="gox-input as-e" value="'+(a.e||'不指定')+'"></div></div>'
      + '</div></div>';
  }
  function acRow(kind){
    var ph = kind==='main'?'打字搜尋主商品名稱或 ID 加入…':'打字搜尋加購品名稱或規格 ID 加入…';
    return '<div class="as-addrow"><div class="ac" data-add="'+kind+'"><input class="gox-input ac-input" placeholder="'+ph+'" autocomplete="off"><div class="ac-list"></div></div></div>';
  }

  function render(){
    var html='';
    if(view.type==='addon'){
      html+='<div class="gox-card"><div class="gox-card-title">加購品折扣設定<span class="as-titlesub">此加購品一套折扣，掛到哪些主商品都共用</span></div><div class="gox-card-body">'
        + addonBlock(view.id, null, true) + '</div></div>';
      var rows=mainsOf(view.id);
      html+='<div class="gox-card"><div class="gox-card-title">掛載主商品<span class="as-titlesub">此加購品要出現在哪些主商品下</span></div><div class="gox-card-body"><div class="as-list">';
      html+= rows.map(function(p){
        return '<div class="as-maprow'+(p.on?'':' is-off')+'"><div class="as-idblock"><span class="as-badge">主商品ID '+p.m+'</span><span class="as-sname">'+MAINS[p.m].name+'</span></div>'
          + '<div class="as-rowacts">'+switchBtn('main',p.m,'主商品')
          + '<button class="gox-switch '+(p.on?'is-on':'')+'" data-toggle="'+p.a+'-'+p.m+'"></button><span class="as-swlabel">'+(p.on?'啟用':'停用')+'</span>'
          + '<button class="gox-icon-btn is-cancel" data-rm="'+p.a+'-'+p.m+'" title="移除">✕</button></div></div>';
      }).join('') || '<div style="color:var(--gox-text-muted);font-size:13px;padding:4px 0;">尚未掛載任何主商品</div>';
      html+=acRow('main')+'</div></div>';
    } else {
      var m=MAINS[view.id];
      html+='<div class="gox-card"><div class="gox-card-title">主商品</div><div class="gox-card-body">'
        + '<div class="as-mainid"><span class="nm">'+m.name+'</span><span class="meta">主商品ID '+view.id+'</span></div></div></div>';
      var rows=addonsOf(view.id);
      html+='<div class="gox-card"><div class="gox-card-title">此主商品的加購品<span class="as-titlesub">折扣為各加購品共用，改動會同步影響它掛的其它主商品</span></div><div class="gox-card-body"><div class="as-list">';
      html+= rows.map(function(p){ return addonBlock(p.a, p, false); }).join('')
        || '<div style="color:var(--gox-text-muted);font-size:13px;padding:4px 0;">此主商品尚未有加購品</div>';
      html+=acRow('addon')+'</div></div>';
    }
    document.getElementById('editor').innerHTML=html;
    refreshSave();
  }

  function updatePreview(block){
    var aid=block.dataset.addon, a=ADDONS[aid], fin=finalOf(a), bad=fin<=0;
    block.querySelector('.as-unit').textContent = a.mode==='fixed'?'元':'（0～1）';
    var sm=block.querySelector('.as-summary'); sm.classList.toggle('is-invalid', bad);
    sm.querySelector('.as-final').textContent=money(fin);
    sm.querySelector('.as-save').textContent= bad?'折後 ≤ $0':'省 '+money(a.orig-fin);
    var st=effStatus(a), tag=block.querySelector('.as-eff'); tag.className='as-eff '+st.c; tag.textContent=st.t;
  }
  function refreshSave(){
    var bad=!!document.querySelector('.as-summary.is-invalid');
    var s=document.getElementById('save-status'), b=document.getElementById('btn-save');
    if(bad){ s.className='as-status is-invalid'; s.innerHTML='<span class="as-dot"></span>折後金額 ≤ $0，無法儲存'; b.disabled=true; }
    else if(s.className.indexOf('is-saved')<0){ s.className='as-status'; s.innerHTML='<span class="as-dot"></span>尚未儲存'; b.disabled=false; }
  }

  function acCands(ac){
    var q=ac.querySelector('.ac-input').value.trim();
    if(ac.dataset.add==='main'){
      var at=mainsOf(view.id).map(function(p){return p.m;});
      return Object.keys(MAINS).filter(function(m){ return at.indexOf(Number(m))<0 && (!q||MAINS[m].name.indexOf(q)>=0||m.indexOf(q)>=0); })
        .map(function(m){ return {id:m, label:MAINS[m].name, code:'ID '+m}; });
    } else {
      var aa=addonsOf(view.id).map(function(p){return p.a;});
      return Object.keys(ADDONS).filter(function(x){ return aa.indexOf(Number(x))<0 && (!q||(ADDONS[x].prod+ADDONS[x].spec).indexOf(q)>=0||x.indexOf(q)>=0); })
        .map(function(x){ return {id:x, label:ADDONS[x].prod+' '+ADDONS[x].spec, code:'規格ID '+x}; });
    }
  }
  function openAc(ac){
    var list=ac.querySelector('.ac-list'), cs=acCands(ac);
    list.innerHTML = cs.length ? cs.map(function(c){ return '<div class="ac-item" data-acpick="'+c.id+'"><b>'+c.label+'</b><span class="code">'+c.code+'</span></div>'; }).join('') : '<div class="ac-empty">找不到符合的項目</div>';
    list.classList.add('is-open');
  }

  document.addEventListener('click', function(e){
    var seg=e.target.closest('[data-seg] button');
    if(seg){ var block=seg.closest('.as-ib'); ADDONS[block.dataset.addon].mode=seg.getAttribute('data-mode');
      block.querySelectorAll('[data-seg] button').forEach(function(b){b.classList.remove('is-active');}); seg.classList.add('is-active');
      updatePreview(block); refreshSave(); return; }
    var toM=e.target.closest('[data-to-main]'); if(toM){ view={type:'main', id:Number(toM.getAttribute('data-to-main'))}; render(); return; }
    var toA=e.target.closest('[data-to-addon]'); if(toA){ view={type:'addon', id:Number(toA.getAttribute('data-to-addon'))}; render(); return; }
    var rm=e.target.closest('[data-rm]'); if(rm){ var k=rm.getAttribute('data-rm').split('-'); pairs=pairs.filter(function(p){return !(p.a==k[0]&&p.m==k[1]);}); render(); return; }
    var pick=e.target.closest('[data-acpick]');
    if(pick){ var ac=pick.closest('.ac'); var id=Number(pick.getAttribute('data-acpick'));
      if(ac.dataset.add==='main') pairs.push({a:view.id, m:id, on:true}); else pairs.push({a:id, m:view.id, on:true});
      window.gox&&window.gox.toast('已加入'); render(); return; }
    if(e.target.closest('#btn-save')){ var s=document.getElementById('save-status'); s.className='as-status is-saved'; s.innerHTML='<span class="as-dot"></span>已儲存（'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'）'; window.gox&&window.gox.toast('已儲存加購設定'); return; }
  });
  document.addEventListener('input', function(e){
    if(e.target.classList.contains('ac-input')){ openAc(e.target.closest('.ac')); return; }
    if(e.target.classList.contains('as-val')){ var b=e.target.closest('.as-ib'); ADDONS[b.dataset.addon].val=parseFloat(e.target.value)||0; updatePreview(b); refreshSave(); }
    if(e.target.classList.contains('as-s')){ var b2=e.target.closest('.as-ib'); ADDONS[b2.dataset.addon].s=e.target.value; updatePreview(b2); }
    if(e.target.classList.contains('as-e')){ var b3=e.target.closest('.as-ib'); ADDONS[b3.dataset.addon].e=e.target.value; updatePreview(b3); }
  });
  document.addEventListener('focusin', function(e){ if(e.target.classList.contains('ac-input')) openAc(e.target.closest('.ac')); });
  document.addEventListener('focusout', function(e){ if(e.target.classList.contains('ac-input')){ var ac=e.target.closest('.ac'); setTimeout(function(){ var l=ac.querySelector('.ac-list'); if(l) l.classList.remove('is-open'); },150); } });
  document.addEventListener('gox:switch', function(e){
    var t=e.target.getAttribute('data-toggle'), up=e.target.getAttribute('data-up');
    if(up){ ADDONS[up].up=e.detail.on; var lb=e.target.parentNode.querySelector('.as-swlabel'); if(lb) lb.textContent=e.detail.on?'上架':'下架'; return; }
    if(!t) return; var k=t.split('-');
    var p=pairs.find(function(x){return x.a==k[0]&&x.m==k[1];}); if(p) p.on=e.detail.on;
    var label=e.target.parentNode.querySelector('.as-swlabel'); if(label) label.textContent=e.detail.on?'啟用':'停用';
    var mr=e.target.closest('.as-maprow'); if(mr) mr.classList.toggle('is-off', !e.detail.on);
    var ib=e.target.closest('.as-ib'); if(ib) ib.classList.toggle('is-off', !e.detail.on);
  });

  render();
})();
</script>

<script>
/* ───── GoX Admin / gox-interactions.js ─────
   後台殼共用的「元件級互動」。
   由 build_prototype.py 自動內聯到輸出 HTML，呼叫者寫對 class 就會動。

   覆蓋範圍（你不用為這些再寫 JS）：
     - .gox-switch         click  → toggle .is-on
     - .gox-tab-btn        click  → 同 .gox-tab-group 內切 .is-active
     - .gox-menu-title     click  → toggle 父 .gox-menu-group .is-open + 箭頭
     - [data-gox-open]     click  → 顯示 #target modal（移除 .is-hidden）
     - [data-gox-close]    click  → 隱藏所屬 .gox-modal-overlay
     - .gox-modal-overlay  click  → 點背景關（除非有 data-gox-no-overlay-close）
     - .gox-icon-btn.is-confirm/.is-cancel click → 觸發 [data-gox-target] 的 confirm/cancel CustomEvent
     - .gox-menu-child     click  → 同 .gox-sidebar 內切 .is-active

   不覆蓋（你要自己寫）：
     - 篩選 / 排序 / 搜尋
     - 狀態機（pending → confirmed → done 之類）
     - 跨元件聯動
     - 表單送出 / 假 API 回傳
   ➜ 在 content_html 裡寫 <script>，用 DOMContentLoaded 包起來。
*/
(function () {
  'use strict';

  function on(el, ev, fn) { el.addEventListener(ev, fn); }
  function delegate(root, ev, selector, fn) {
    on(root, ev, (e) => {
      const t = e.target.closest(selector);
      if (t && root.contains(t)) fn(e, t);
    });
  }

  function init() {
    const root = document;

    // ── Switch ─────────────────────────────────
    delegate(root, 'click', '.gox-switch', (e, el) => {
      if (el.classList.contains('is-disabled')) return;
      el.classList.toggle('is-on');
      el.dispatchEvent(new CustomEvent('gox:switch', {
        bubbles: true,
        detail: { on: el.classList.contains('is-on') },
      }));
    });

    // ── Tab group ───────────────────────────────
    delegate(root, 'click', '.gox-tab-group .gox-tab-btn', (e, btn) => {
      const group = btn.closest('.gox-tab-group');
      group.querySelectorAll('.gox-tab-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const key = btn.dataset.tab;
      group.dispatchEvent(new CustomEvent('gox:tab', {
        bubbles: true,
        detail: { tab: key, btn },
      }));
      // 若有 data-tab，自動切 [data-tab-panel] 顯示
      if (key) {
        const scope = btn.closest('[data-tab-scope]') || document;
        scope.querySelectorAll('[data-tab-panel]').forEach((p) => {
          p.hidden = p.dataset.tabPanel !== key;
        });
      }
    });

    // ── Sidebar menu group 摺疊 ──────────────────
    delegate(root, 'click', '.gox-menu-title', (e, btn) => {
      const group = btn.closest('.gox-menu-group');
      if (!group) return;
      group.classList.toggle('is-open');
      const arrow = btn.querySelector('.gox-arrow');
      if (arrow) arrow.textContent = group.classList.contains('is-open') ? '▼' : '▶';
    });

    // ── Sidebar menu child active ────────────────
    delegate(root, 'click', '.gox-sidebar .gox-menu-child', (e, link) => {
      // 不阻止預設行為（讓 href 還能跳）；但若是 href="#" 純 demo，做 active 切換
      if (link.getAttribute('href') === '#') e.preventDefault();
      const side = link.closest('.gox-sidebar');
      side.querySelectorAll('.gox-menu-child.is-active').forEach((a) => a.classList.remove('is-active'));
      link.classList.add('is-active');
    });

    // ── Modal open ──────────────────────────────
    delegate(root, 'click', '[data-gox-open]', (e, btn) => {
      const sel = btn.dataset.goxOpen;
      const target = sel && document.querySelector(sel);
      if (target) target.classList.remove('is-hidden');
    });

    // ── Modal close（按鈕） ─────────────────────
    delegate(root, 'click', '[data-gox-close]', (e, btn) => {
      const modal = btn.closest('.gox-modal-overlay');
      if (modal) modal.classList.add('is-hidden');
    });

    // ── Modal close（點背景） ───────────────────
    delegate(root, 'click', '.gox-modal-overlay', (e, overlay) => {
      if (overlay.dataset.goxNoOverlayClose !== undefined) return;
      if (e.target === overlay) overlay.classList.add('is-hidden');
    });

    // ── ESC 關 modal ────────────────────────────
    on(document, 'keydown', (e) => {
      if (e.key !== 'Escape') return;
      const opens = document.querySelectorAll('.gox-modal-overlay:not(.is-hidden)');
      opens.forEach((m) => {
        if (m.dataset.goxNoOverlayClose === undefined) m.classList.add('is-hidden');
      });
    });

    // ── Icon button confirm / cancel ─────────────
    delegate(root, 'click', '.gox-icon-btn.is-confirm, .gox-icon-btn.is-cancel', (e, btn) => {
      const kind = btn.classList.contains('is-confirm') ? 'confirm' : 'cancel';
      const targetSel = btn.dataset.goxTarget;
      const target = targetSel ? document.querySelector(targetSel) : btn.closest('[data-gox-editable]');
      if (target) {
        target.dispatchEvent(new CustomEvent('gox:' + kind, { bubbles: true }));
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露給頁面級腳本使用（如「按下查詢」這種頁面級互動）
  window.gox = window.gox || {};
  window.gox.openModal  = (sel) => { const t = document.querySelector(sel); if (t) t.classList.remove('is-hidden'); };
  window.gox.closeModal = (sel) => { const t = document.querySelector(sel); if (t) t.classList.add('is-hidden'); };
  window.gox.toast = (msg) => {
    // 簡易 toast（自動消失）
    let host = document.querySelector('#gox-toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'gox-toast-host';
      host.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
      document.body.appendChild(host);
    }
    const t = document.createElement('div');
    t.className = 'gox-toast';
    t.textContent = msg;
    t.style.cssText = 'background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.2);';
    host.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
    setTimeout(() => t.remove(), 2200);
  };
})();

</script>

</body>
</html>
