<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>產線加購品設定 — 後台 demo</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ───── GoX Admin / base.css ─────
   後台殼共用 reset + 全域字型 + CSS 變數 token。
   color / spacing / radius 集中在 :root，後續元件一律 var(--gox-*) 取用，
   不要再回填 hex。 */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* ── 品牌綠 ── */
  --gox-green:           #4ba83b;   /* 主操作 / hover */
  --gox-green-hover:     #3d8c30;
  --gox-header-bg:       #D7F4DA;   /* header 淺綠底 */
  --gox-header-border:   #c2dfc4;

  /* ── 側欄深灰 ── */
  --gox-sider-bg:        #32323a;
  --gox-sider-sub-bg:    #28282e;
  --gox-sider-active-bg: #202025;
  --gox-sider-text:      #fff;
  --gox-sider-sub-text:  #cccccc;
  --gox-sider-active-text: bisque;

  /* ── 內容區 ── */
  --gox-content-bg:      #f1f2f7;
  --gox-card-bg:         #ffffff;
  --gox-card-border:     #e6e6e6;

  /* ── 文字 ── */
  --gox-text:            #333333;
  --gox-text-sub:        #666666;
  --gox-text-muted:      #888888;

  /* ── 語意色（補 antd primary #1677ff 之外）── */
  --gox-danger:          #dc4e43;   /* 主危險（與前台一致） */
  --gox-danger-soft:     #ff4d4f;   /* antd danger 替代值 */
  --gox-warning:         #fbbf24;
  --gox-info:            #2c98f0;
  --gox-success:         #52c41a;

  /* ── 元件尺寸 ── */
  --gox-header-h:        49px;
  --gox-sider-w:         160px;     /* Gift 170 + B2B 150 折衷 */
  --gox-radius:          4px;
  --gox-radius-lg:       6px;
  --gox-space-unit:      4px;

  /* ── 字型 / 字級 ── */
  --gox-font-family:     'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體',
                         -apple-system, BlinkMacSystemFont, sans-serif;
  --gox-font-size-base:  14px;
  --gox-font-size-sm:    13px;
  --gox-font-size-xs:    12px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
  color: var(--gox-text);
  background: var(--gox-content-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--gox-info); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 整個後台 wrapper（一定要包這層才能套色） */
.gox-page {
  min-height: 100vh;
  background: var(--gox-content-bg);
  color: var(--gox-text);
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
}

/* ───── GoX Admin / header.css ─────
   固定在頂端的淺綠 header：
     左：無毒農 logo（小張）
     中：breadcrumb（B2B管理 > 訂單管理）
     右：使用者快捷區（登出、通知；可選） */

.gox-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--gox-header-h);
  background: var(--gox-header-bg);
  border-bottom: 1px solid var(--gox-header-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: var(--gox-font-family);
}

.gox-header .gox-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.gox-header .gox-logo img {
  height: 28px;
  width: auto;
  max-width: 120px;
  display: block;
}

/* ── breadcrumb ── */
.gox-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gox-text-sub);
  font-size: 15px;
  flex: 1;
  min-width: 0;
}
.gox-breadcrumb a {
  color: var(--gox-green);
  text-decoration: none;
}
.gox-breadcrumb a:hover { text-decoration: underline; }
.gox-breadcrumb .sep {
  color: var(--gox-text-muted);
  font-size: 12px;
}
.gox-breadcrumb strong {
  color: #000;
  font-weight: 700;
}

/* ── 右側使用者快捷區（可選）── */
.gox-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  font-size: var(--gox-font-size-sm);
}
.gox-header-right .gox-user {
  color: var(--gox-text);
}
.gox-header-right .gox-icon-btn {
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--gox-text-sub);
  padding: 4px 8px;
  font-family: inherit;
  font-size: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--gox-radius);
  white-space: nowrap;
}
.gox-header-right .gox-user { white-space: nowrap; }
.gox-header-right .gox-icon-btn:hover {
  background: rgba(0, 0, 0, .05);
  color: var(--gox-text);
}

/* ───── GoX Admin / sidebar.css ─────
   左側深灰固定側欄。支援：
     - 一級項目（可帶 badge 紅點）
     - 可摺疊群組（▶ / ▼）
     - 二級項目（active 高亮）
     - disabled 樣式 */

.gox-sidebar {
  width: var(--gox-sider-w);
  flex-shrink: 0;
  background: var(--gox-sider-bg);
  color: var(--gox-sider-text);
  padding: 8px 0;
  font-size: var(--gox-font-size-sm);
  overflow-y: auto;
  position: sticky;
  top: var(--gox-header-h);
  height: calc(100vh - var(--gox-header-h));
  font-family: var(--gox-font-family);
}

/* ── 一級項目 / 群組標題 ── */
.gox-sidebar .gox-menu-item,
.gox-sidebar .gox-menu-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  color: var(--gox-sider-text);
  background: transparent;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: var(--gox-font-size-sm);
  font-family: inherit;
  line-height: 1.5;
  user-select: none;
}
.gox-sidebar .gox-menu-item:hover,
.gox-sidebar .gox-menu-title:hover {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}

/* disabled（demo 未開放的入口） */
.gox-sidebar .gox-menu-item.is-disabled {
  cursor: default;
  color: #888;
}
.gox-sidebar .gox-menu-item.is-disabled:hover {
  background: transparent;
  color: #888;
}

/* 一級項目 active（無子項目、可直接點的頁面，例如「獨立平台」）
   字色用 !important 壓過腳本給一級項的 inline color:inherit，對齊二級 active 的 bisque */
.gox-sidebar .gox-menu-item.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text) !important;
  font-weight: 600;
}

/* 箭頭（▶ / ▼） */
.gox-sidebar .gox-arrow {
  display: inline-block;
  width: 12px;
  font-size: 9px;
  flex-shrink: 0;
  transition: transform .15s;
}

/* badge 紅點 */
.gox-sidebar .gox-badge {
  margin-left: auto;
  background: var(--gox-danger);
  color: #fff;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 11px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

/* ── 摺疊群組 ── */
.gox-sidebar .gox-menu-group.is-open .gox-menu-title {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}
.gox-sidebar .gox-menu-children {
  background: var(--gox-sider-sub-bg);
}

/* 二級項目 */
.gox-sidebar .gox-menu-child {
  display: block;
  padding: 8px 14px 8px 32px;
  color: var(--gox-sider-sub-text);
  text-decoration: none;
  font-size: var(--gox-font-size-sm);
}
.gox-sidebar .gox-menu-child:hover {
  background: #252530;
  color: var(--gox-sider-active-text);
  text-decoration: none;
}
.gox-sidebar .gox-menu-child.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text);
  font-weight: 600;
}

/* ───── GoX Admin / content.css ─────
   內容區共用元件：
     .gox-content / .gox-card / button / form / table / modal / tab / switch / icon-btn
   全部用 :root 變數，不直接寫 hex。 */

/* ── 主體佈局：header 下方的 sidebar + content ── */
.gox-body {
  display: flex;
  min-height: calc(100vh - var(--gox-header-h));
}
.gox-content {
  flex: 1;
  min-width: 0;          /* 讓子層 table overflow 正常 */
  padding: 16px;
  overflow-x: auto;
  background: var(--gox-content-bg);
}

/* ─────────────────────────────────────────────────
   Toolbox：工具型頁面的主要工作區容器
   預設 960px 限寬置中（表單、設定、編輯頁讀起來舒服）
   修飾詞依內容寬度需求調整
   ─────────────────────────────────────────────────
   何時用：
     - 系統設定、個人資料、單筆編輯、單一表單
     - 內容上下流式排列、欄位不多
   何時不用：
     - 列表頁（要滿寬度顯示表格）
     - 看板、儀表板（多欄並列）
     - 包含寬表格的編輯頁（會被切掉）
   範例：
     <main class="gox-content">
       <div class="gox-toolbox">  ← 用這個
         <h2>系統設定</h2>
         <div class="gox-card">…</div>
       </div>
     </main>
*/
.gox-toolbox {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.gox-toolbox.is-narrow { max-width: 720px; }   /* 表單少欄位、登入頁、設定密碼 */
.gox-toolbox.is-wide   { max-width: 1200px; }  /* 多欄表單、含中型表格 */
.gox-toolbox.is-fluid  { max-width: none; }    /* 內容太擠時退回滿寬 */

/* ─────────────────────────────────────────────────
   Card：後台主要的「白卡片」容器
   ───────────────────────────────────────────────── */
.gox-card {
  background: var(--gox-card-bg);
  border: 1px solid var(--gox-card-border);
  border-radius: var(--gox-radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.gox-card-title {
  margin: 0;
  padding: 12px 16px;
  background: var(--gox-card-bg);
  border-bottom: 1px solid var(--gox-card-border);
  font-size: 16px;
  font-weight: 600;
  color: var(--gox-text);
}
.gox-card-title.is-green {            /* 綠色強調標題（如「贈品設定」） */
  background: var(--gox-green);
  color: #fff;
  border-bottom: 0;
}
.gox-card-body { padding: 16px; }
.gox-card-body.is-table-padding { padding: 0; }     /* table 自己有 padding 時用 */

/* 卡片頂端列：左標題 / 右操作按鈕 */
.gox-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─────────────────────────────────────────────────
   Button
   ───────────────────────────────────────────────── */
.gox-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  line-height: 1.5;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.gox-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* 主操作 — 品牌綠 */
.gox-btn-primary {
  background: var(--gox-green);
  color: #fff;
  border-color: var(--gox-green);
}
.gox-btn-primary:hover:not(:disabled) { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }

/* 次操作 — 白底邊框 */
.gox-btn-default {
  background: #fff;
  color: var(--gox-text);
  border-color: #ccc;
}
.gox-btn-default:hover:not(:disabled) { background: #f5f5f5; border-color: var(--gox-green); color: var(--gox-green); }

/* 危險 */
.gox-btn-danger {
  background: #fff;
  color: var(--gox-danger);
  border-color: var(--gox-danger);
}
.gox-btn-danger:hover:not(:disabled) { background: var(--gox-danger); color: #fff; }

/* 列表內小按鈕（檢視 / 編輯 / 刪除） */
.gox-btn-op {
  display: inline-block;
  margin-right: 4px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  color: var(--gox-text);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.gox-btn-op:hover { background: #f5f5f5; text-decoration: none; }

/* ─────────────────────────────────────────────────
   Form
   ───────────────────────────────────────────────── */
.gox-form-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.gox-form-row > label {
  min-width: 110px;
  color: var(--gox-text);
  font-weight: 500;
}
.gox-input,
.gox-select,
.gox-textarea {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  background: #fff;
  color: var(--gox-text);
  line-height: 1.5;
  min-height: 32px;
  box-sizing: border-box;
}
.gox-input:focus,
.gox-select:focus,
.gox-textarea:focus {
  outline: 2px solid var(--gox-green);
  outline-offset: -1px;
  border-color: var(--gox-green);
}
.gox-input:disabled,
.gox-select:disabled,
.gox-textarea:disabled {
  background: #f5f5f5;
  color: #999;
  cursor: not-allowed;
}
.gox-textarea { min-height: 80px; resize: vertical; }

.gox-radio-group, .gox-checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.gox-hint {
  color: var(--gox-text-muted);
  font-size: var(--gox-font-size-xs);
}

/* ─────────────────────────────────────────────────
   Table
   ───────────────────────────────────────────────── */
.gox-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--gox-font-size-sm);
  background: #fff;
}
.gox-table th {
  background: #fafafa;
  border-bottom: 1px solid var(--gox-card-border);
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--gox-text-sub);
  white-space: nowrap;
}
.gox-table td {
  padding: 12px 8px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.gox-table tr:hover td { background: #fafafa; }
.gox-table .cell-center { text-align: center; }
.gox-table .cell-right { text-align: right; }
.gox-table .cell-ops { white-space: nowrap; }
.gox-table .row-error td { background: #fff1f0; }
.gox-table .row-error:hover td { background: #ffe0de; }

/* ─────────────────────────────────────────────────
   Tab（頁籤）
   ───────────────────────────────────────────────── */
.gox-tab-group {
  display: inline-flex;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  overflow: hidden;
}
.gox-tab-btn {
  padding: 6px 20px;
  background: #fff;
  border: 0;
  cursor: pointer;
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  border-right: 1px solid #ccc;
  color: var(--gox-text);
}
.gox-tab-btn:last-child { border-right: 0; }
.gox-tab-btn.is-active {
  background: var(--gox-info);
  color: #fff;
}

/* ─────────────────────────────────────────────────
   Modal
   ───────────────────────────────────────────────── */
.gox-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.gox-modal-overlay.is-hidden { display: none; }
[hidden] { display: none !important; }
.gox-modal-box {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  min-width: 480px;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.gox-modal-box h4 { margin: 0 0 16px; font-size: 16px; }
.gox-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

/* ─────────────────────────────────────────────────
   Switch / Tag
   ───────────────────────────────────────────────── */
.gox-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  border-radius: 11px;
  border: 0;
  padding: 0;
  margin: 0;
  background: #d1d5db;
  cursor: pointer;
  transition: background .18s ease;
  vertical-align: middle;
}
.gox-switch.is-on { background: var(--gox-green); }
.gox-switch.is-disabled { opacity: .5; cursor: not-allowed; }
.gox-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .18s ease;
}
.gox-switch.is-on::after { transform: translateX(18px); }

.gox-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  font-weight: 600;
  background: #f0f0f0;
  color: var(--gox-text-sub);
  border: 1px solid #e0e0e0;
}
.gox-tag.is-success { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
.gox-tag.is-info    { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-warning { background: #fffbe6; color: #d4b106; border-color: #ffe58f; }
.gox-tag.is-danger  { background: #fff1f0; color: var(--gox-danger); border-color: #ffccc7; }

/* 溫層快速 tag（兩專案都會用） */
.gox-tag.is-frozen  { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-ambient { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }

/* ─────────────────────────────────────────────────
   Icon button（鉛筆 / 確認 / 取消）
   ───────────────────────────────────────────────── */
.gox-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--gox-radius);
  cursor: pointer;
  color: var(--gox-text-sub);
  font-size: 12px;
  font-family: inherit;
  transition: all .15s;
}
.gox-icon-btn:hover {
  background: #f0f4f8;
  color: var(--gox-info);
  border-color: #bcd4ea;
}
.gox-icon-btn.is-confirm { background: var(--gox-green); color: #fff; border-color: var(--gox-green); }
.gox-icon-btn.is-confirm:hover { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }
.gox-icon-btn.is-cancel  { background: #fff; color: #999; border-color: #ccc; }
.gox-icon-btn.is-cancel:hover  { background: #f5f5f5; color: var(--gox-danger); border-color: var(--gox-danger); }

/* ─────────────────────────────────────────────────
   通用工具 class
   ───────────────────────────────────────────────── */
/* 顯示 / 隱藏切換用。以前每個產出頁都自己再宣告一次，收進來統一提供。 */
.is-hidden { display: none; }

</style>
</head>
<body>
<div class="gox-page">

  現有真名：id=productDetailId, pid=productId, name, spec=detail(+amt 規格量,module 單位),
  price=原價, disc=discountPrice(優惠價,實體DiscPrice), stock=剩餘數量(＝OriginAmt庫存量−SoldAmt銷售量,非原始庫存), temp=temperatureType(溫層),
  display=上架, minPrice=minimumPrice(滿額限購), limit=limit(限購數量,另有 totalLimit),
  vip=vipLevelId, firstBuy, shipping=isShipping(含運), img=coverImg；產線=ProductCategoryEnum/categoryType。
  真實欄位皆在 react-component-export extraProductsSetting/Setting.tsx IProductDetail。
  新功能(待新建)：subs=限定子分類→新表 ExtraProductSubCategory.SubCategoryType(=Product.Type2)；
  清單本體→新表 ExtraProduct(ProductCategory,ProductDetailId,Sort)；儲存契約/CartSubCategoryTypes 見工程規格 §3/§5。
  Demo 假資料：每產線子分類、規格ID 90001+/產品ID 30001+、20 筆商品名皆為示意；真實子分類只有 5 個且動態撈 ProductSubCategory。 -->

    return '<div class="la-subs">'+r.subs.map(function(s){return '<span class="la-subtag">'+s+'</span>';}).join('')+'</div>';
  }

  // ── 產線頁籤 ──
  $('la-tabs').innerHTML=LINES.map(function(l){ return '<button data-line="'+l[0]+'"'+(l[0]===line?' class="is-on"':'')+'>'+l[1]+'</button>'; }).join('');
  $('la-tabs').addEventListener('click', function(e){ var b=e.target.closest('[data-line]'); if(!b)return;
    line=b.getAttribute('data-line'); selected.clear();
    $('la-tabs').querySelectorAll('button').forEach(function(x){x.classList.toggle('is-on', x.getAttribute('data-line')===line);});
    renderChips(); render();
  });

  // ── 篩選 chips（依產線動態）──
  function renderChips(){
    filter.clear();
    $('la-chips').innerHTML=subcatsOfLine().map(function(s){ return '<button class="la-chip" data-sub="'+s+'">'+s+'</button>'; }).join('');
    $('la-clear').hidden=true;
  }
  $('la-chips').addEventListener('click', function(e){ var b=e.target.closest('[data-sub]'); if(!b)return;
    var s=b.getAttribute('data-sub'); if(filter.has(s))filter.delete(s); else filter.add(s);
    b.classList.toggle('is-on', filter.has(s)); $('la-clear').hidden=!filter.size; render();
  });
  $('la-clear').addEventListener('click', function(){ filter.clear(); this.hidden=true;
    $('la-chips').querySelectorAll('.la-chip').forEach(function(x){x.classList.remove('is-on');}); render();
  });
  $('la-hideoff').addEventListener('change', function(){ hideOff=this.checked; render(); });

  // ── 加入（可貼多筆規格ID，用空格／換行／逗號分隔；搜尋只是把 ID 帶進欄位，不直接加入）──
  var ac=$('la-ac'), acIn=$('la-ac-input'), acList=$('la-ac-list');
  var SEP=/[\s,，、]+/;
  function tokens(){ return acIn.value.split(SEP).map(function(t){return t.trim();}).filter(Boolean); }
  function lastToken(){ var v=acIn.value.replace(/[，、]/g,' '); var m=v.split(/[\s,]/); return (m[m.length-1]||'').trim(); }
  function acDraw(){
    var q=lastToken();
    var existing=new Set(rowsOfLine().map(function(r){return r.id;}));
    var inField=new Set(tokens());
    var cs=POOL.filter(function(p){ return !existing.has(p.id) && !inField.has(String(p.id)) && (!q || (p.name+p.spec+p.id).indexOf(q)>=0); });
    acList.innerHTML = cs.length? cs.map(function(p){ return '<button data-pick="'+p.id+'">'+p.name+tempTag(p.temp)+'<span class="r2">規格ID '+p.id+'・'+p.spec+'・'+money(p.price)+'</span></button>'; }).join('')
      : '<div class="none">沒有可帶入的規格 ID</div>';
  }
  acIn.addEventListener('focus', function(){ acDraw(); ac.classList.add('is-open'); });
  acIn.addEventListener('input', function(){ acDraw(); ac.classList.add('is-open'); });
  // 點搜尋結果＝把該規格 ID 帶進欄位（取代最後一個未完成的 token），不直接加入
  acList.addEventListener('mousedown', function(e){ var b=e.target.closest('[data-pick]'); if(!b)return; e.preventDefault();
    var id=b.getAttribute('data-pick');
    var toks=tokens();
    var q=lastToken();
    if(q && toks.length && toks[toks.length-1]===q) toks.pop();  // 移除未完成的最後 token
    toks.push(id);
    acIn.value=toks.join(' ')+' ';
    acDraw(); acIn.focus();
  });
  document.addEventListener('click', function(e){ if(!ac.contains(e.target)) ac.classList.remove('is-open'); });

  $('la-add').addEventListener('click', function(){
    var toks=tokens(); if(!toks.length){ acIn.focus(); ac.classList.add('is-open'); acDraw(); return; }
    var existing=new Set(rowsOfLine().map(function(r){return r.id;}));
    var added=[], notfound=[], dup=[], seen=new Set();
    toks.forEach(function(t){
      if(seen.has(t)) return; seen.add(t);
      var p=POOL.find(function(x){ return String(x.id)===t; });
      if(!p){ notfound.push(t); return; }
      if(existing.has(p.id)){ dup.push(t); return; }
      added.push(it({id:p.id,pid:p.pid,img:p.img,name:p.name,spec:p.spec,price:p.price,temp:p.temp,subs:[]}));
      existing.add(p.id);
    });
    if(added.length){ var pos=$('la-add-pos').value;
      DATA[line] = pos==='start' ? added.concat(DATA[line]) : DATA[line].concat(added); markDirty(); }
    acIn.value=''; ac.classList.remove('is-open'); render();
    var msg = added.length? ('已加入 '+added.length+' 筆（'+($('la-add-pos').value==='start'?'加到最前':'加到最後')+'）') : '沒有加入任何規格';
    if(notfound.length) msg += '；查無：'+notfound.join('、');
    if(dup.length) msg += '；已存在：'+dup.join('、');
    window.gox&&window.gox.toast(msg);
  });

  // ── 表格 render ──
  function render(){
    var rows=visible();
    var body=$('la-body');
    if(!rows.length){ body.innerHTML='<tr><td colspan="17" class="la-empty">'+(filter.size?'此篩選下沒有加購品':'這條產線尚未設定加購品，用上方搜尋加入')+'</td></tr>'; syncBars(); return; }
    var full=rowsOfLine();
    body.innerHTML=rows.map(function(r){
      var idx=full.indexOf(r);
      return '<tr draggable="true" data-id="'+r.id+'"'+(r.display?'':' class="is-off"')+'>'
        + '<td class="cell-center"><input type="checkbox" class="la-pick" data-id="'+r.id+'"'+(selected.has(r.id)?' checked':'')+' style="width:16px;height:16px;accent-color:var(--gox-green);"></td>'
        + '<td class="cell-center"><div class="la-ord"><span class="la-drag" title="拖曳排序">⠿</span><span class="no">'+(idx+1)+'</span>'
          + '<button class="la-iconbtn" data-top="'+r.id+'" title="移到最前"'+(idx===0?' disabled':'')+'>↑</button>'
          + '<button class="la-iconbtn" data-bottom="'+r.id+'" title="移到最後"'+(idx===full.length-1?' disabled':'')+'>↓</button></div></td>'
        + '<td>'+thumb(r.img)+'</td>'
        + '<td><div class="la-pname">'+r.name+'</div><div class="la-pid">#'+r.pid+'</div></td>'
        + '<td><div class="la-pspec">'+r.spec+'</div><div class="la-pid">#'+r.id+'</div></td>'
        + '<td class="cell-right la-mono">'+money(r.price)+'</td>'
        + '<td class="cell-right la-mono">'+(r.disc?money(r.disc):'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-right la-mono la-stock'+(r.stock<=0?' is-zero':'')+'">'+r.stock+'</td>'
        + '<td class="cell-center">'+tempTag(r.temp)+'</td>'
        + '<td class="cell-center"><span class="gox-tag '+(r.display?'is-success':'')+'">'+(r.display?'上架':'下架')+'</span></td>'
        + '<td>'+subsCell(r)+'</td>'
        + '<td class="cell-right la-mono">'+(r.minPrice?money(r.minPrice):'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-center la-mono">'+(r.limit?r.limit+' 件':'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-center">'+(r.vip?'<span class="la-yes">VIP</span>':'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-center">'+(r.firstBuy?'<span class="la-yes">✓</span>':'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-center">'+(r.shipping?'<span class="la-yes">✓</span>':'<span class="la-dash">—</span>')+'</td>'
        + '<td class="cell-center"><div class="la-ops"><button class="la-linkbtn" data-editrule="'+r.id+'">編輯加購規則</button>'
          + '<button class="la-linkbtn" data-editsub="'+r.id+'">編輯子分類</button>'
          + '<button class="la-linkbtn is-danger" data-rm="'+r.id+'">移除</button></div></td></tr>';
    }).join('');
    syncBars();
  }
  function syncBars(){
    var n=selected.size; $('la-delcnt').textContent=n; $('la-del').disabled=n===0;
    var vis=visible();
    $('la-all').checked = vis.length>0 && vis.every(function(r){return selected.has(r.id);});
    $('la-all').indeterminate = n>0 && !$('la-all').checked;
  }

  // ── 表格互動 ──
  $('la-body').addEventListener('click', function(e){
    var pick=e.target.closest('.la-pick');
    if(pick){ var id=Number(pick.getAttribute('data-id')); if(pick.checked)selected.add(id); else selected.delete(id); syncBars(); return; }
    var top=e.target.closest('[data-top]'); if(top){ moveTo(Number(top.getAttribute('data-top')),'top'); return; }
    var bot=e.target.closest('[data-bottom]'); if(bot){ moveTo(Number(bot.getAttribute('data-bottom')),'bottom'); return; }
    var es=e.target.closest('[data-editsub]'); if(es){ openSubModal(Number(es.getAttribute('data-editsub'))); return; }
    var er=e.target.closest('[data-editrule]'); if(er){ openRuleModal(Number(er.getAttribute('data-editrule'))); return; }
    var rm=e.target.closest('[data-rm]'); if(rm){ var rid=Number(rm.getAttribute('data-rm')); DATA[line]=DATA[line].filter(function(r){return r.id!==rid;}); selected.delete(rid); markDirty(); render(); return; }
  });
  $('la-all').addEventListener('change', function(){ var vis=visible();
    if(this.checked) vis.forEach(function(r){selected.add(r.id);}); else vis.forEach(function(r){selected.delete(r.id);}); render();
  });
  $('la-del').addEventListener('click', function(){ DATA[line]=DATA[line].filter(function(r){return !selected.has(r.id);}); selected.clear(); markDirty(); render(); });
  $('la-save').addEventListener('click', function(){
    var btn=this;
    if(!dirty){ window.gox&&window.gox.toast('目前沒有變更'); return; }
    setStatus('saving'); btn.disabled=true;
    setTimeout(function(){ dirty=false; setStatus('clean'); btn.disabled=false;
      window.gox&&window.gox.toast('已儲存「'+LINES.find(function(l){return l[0]===line;})[1]+'」的加購清單'); }, 800);
  });

  function moveTo(id,where){ var arr=DATA[line]; var i=arr.findIndex(function(r){return r.id===id;}); if(i<0)return;
    var item=arr.splice(i,1)[0]; if(where==='top')arr.unshift(item); else arr.push(item); markDirty(); render(); }

  // ── 拖曳排序 ──
  var body=$('la-body');
  body.addEventListener('dragstart', function(e){ var tr=e.target.closest('tr[data-id]'); if(!tr)return; dragId=Number(tr.dataset.id); tr.classList.add('is-drag'); e.dataTransfer.effectAllowed='move'; });
  body.addEventListener('dragover', function(e){ if(dragId==null)return; e.preventDefault(); var tr=e.target.closest('tr[data-id]');
    body.querySelectorAll('.is-over').forEach(function(x){x.classList.remove('is-over');});
    if(tr && Number(tr.dataset.id)!==dragId) tr.classList.add('is-over'); });
  body.addEventListener('drop', function(e){ if(dragId==null)return; e.preventDefault(); var tr=e.target.closest('tr[data-id]');
    if(tr){ var targetId=Number(tr.dataset.id); var arr=DATA[line];
      var from=arr.findIndex(function(r){return r.id===dragId;}), to=arr.findIndex(function(r){return r.id===targetId;});
      if(from>=0&&to>=0&&from!==to){ var item=arr.splice(from,1)[0]; arr.splice(to,0,item); markDirty(); } }
    dragId=null; render(); });
  body.addEventListener('dragend', function(){ dragId=null; render(); });

  // ── 限定子分類 modal（依產線動態）──
  function openSubModal(id){ modalId=id; var r=DATA[line].find(function(x){return x.id===id;}); if(!r)return;
    $('la-modal-name').textContent=r.name;
    $('la-modal-subs').innerHTML=subcatsOfLine().map(function(s){ return '<label><input type="checkbox" value="'+s+'"'+(r.subs.indexOf(s)>=0?' checked':'')+'>'+s+'</label>'; }).join('');
    $('la-sub-modal').classList.remove('is-hidden');
  }
  $('la-modal-ok').addEventListener('click', function(){ var r=DATA[line].find(function(x){return x.id===modalId;}); if(r){
    r.subs=[...$('la-modal-subs').querySelectorAll('input:checked')].map(function(cb){return cb.value;}); markDirty(); }
    $('la-sub-modal').classList.add('is-hidden'); render();
  });

  // ── 編輯加購規則 modal（滿額限購＋限購數量）──
  var ruleId=null;
  function openRuleModal(id){ ruleId=id; var r=DATA[line].find(function(x){return x.id===id;}); if(!r)return;
    $('la-rule-name').textContent=r.name;
    $('la-rule-min').value=r.minPrice||'';
    $('la-rule-limit').value=r.limit||'';
    $('la-rule-modal').classList.remove('is-hidden');
  }
  $('la-rule-ok').addEventListener('click', function(){ var r=DATA[line].find(function(x){return x.id===ruleId;}); if(r){
    r.minPrice=Math.max(0, parseInt($('la-rule-min').value,10)||0);
    r.limit=Math.max(0, parseInt($('la-rule-limit').value,10)||0); markDirty(); }
    $('la-rule-modal').classList.add('is-hidden'); render();
  });

  renderChips(); render();
})();
</script>

</main>

<script>
/* ───── GoX Admin / gox-interactions.js ─────
   後台殼共用的「元件級互動」。
   由 build_prototype.py 自動內聯到輸出 HTML，呼叫者寫對 class 就會動。

   覆蓋範圍（你不用為這些再寫 JS）：
     - .gox-switch         click  → toggle .is-on
     - .gox-tab-btn        click  → 同 .gox-tab-group 內切 .is-active
     - .gox-menu-title     click  → toggle 父 .gox-menu-group .is-open + 箭頭
     - [data-gox-open]     click  → 顯示 #target modal（移除 .is-hidden）
     - [data-gox-close]    click  → 隱藏所屬 .gox-modal-overlay
     - .gox-modal-overlay  click  → 點背景關（除非有 data-gox-no-overlay-close）
     - .gox-icon-btn.is-confirm/.is-cancel click → 觸發 [data-gox-target] 的 confirm/cancel CustomEvent
     - .gox-menu-child     click  → 同 .gox-sidebar 內切 .is-active

   不覆蓋（你要自己寫）：
     - 篩選 / 排序 / 搜尋
     - 狀態機（pending → confirmed → done 之類）
     - 跨元件聯動
     - 表單送出 / 假 API 回傳
   ➜ 在 content_html 裡寫 <script>，用 DOMContentLoaded 包起來。
*/
(function () {
  'use strict';

  function on(el, ev, fn) { el.addEventListener(ev, fn); }
  function delegate(root, ev, selector, fn) {
    on(root, ev, (e) => {
      const t = e.target.closest(selector);
      if (t && root.contains(t)) fn(e, t);
    });
  }

  function init() {
    const root = document;

    // ── Switch ─────────────────────────────────
    delegate(root, 'click', '.gox-switch', (e, el) => {
      if (el.classList.contains('is-disabled')) return;
      el.classList.toggle('is-on');
      el.dispatchEvent(new CustomEvent('gox:switch', {
        bubbles: true,
        detail: { on: el.classList.contains('is-on') },
      }));
    });

    // ── Tab group ───────────────────────────────
    delegate(root, 'click', '.gox-tab-group .gox-tab-btn', (e, btn) => {
      const group = btn.closest('.gox-tab-group');
      group.querySelectorAll('.gox-tab-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const key = btn.dataset.tab;
      group.dispatchEvent(new CustomEvent('gox:tab', {
        bubbles: true,
        detail: { tab: key, btn },
      }));
      // 若有 data-tab，自動切 [data-tab-panel] 顯示
      if (key) {
        const scope = btn.closest('[data-tab-scope]') || document;
        scope.querySelectorAll('[data-tab-panel]').forEach((p) => {
          p.hidden = p.dataset.tabPanel !== key;
        });
      }
    });

    // ── Sidebar menu group 摺疊 ──────────────────
    delegate(root, 'click', '.gox-menu-title', (e, btn) => {
      const group = btn.closest('.gox-menu-group');
      if (!group) return;
      group.classList.toggle('is-open');
      const arrow = btn.querySelector('.gox-arrow');
      if (arrow) arrow.textContent = group.classList.contains('is-open') ? '▼' : '▶';
    });

    // ── Sidebar menu child active ────────────────
    delegate(root, 'click', '.gox-sidebar .gox-menu-child', (e, link) => {
      // 不阻止預設行為（讓 href 還能跳）；但若是 href="#" 純 demo，做 active 切換
      if (link.getAttribute('href') === '#') e.preventDefault();
      const side = link.closest('.gox-sidebar');
      side.querySelectorAll('.gox-menu-child.is-active').forEach((a) => a.classList.remove('is-active'));
      link.classList.add('is-active');
    });

    // ── Modal open ──────────────────────────────
    delegate(root, 'click', '[data-gox-open]', (e, btn) => {
      const sel = btn.dataset.goxOpen;
      const target = sel && document.querySelector(sel);
      if (target) target.classList.remove('is-hidden');
    });

    // ── Modal close（按鈕） ─────────────────────
    delegate(root, 'click', '[data-gox-close]', (e, btn) => {
      const modal = btn.closest('.gox-modal-overlay');
      if (modal) modal.classList.add('is-hidden');
    });

    // ── Modal close（點背景） ───────────────────
    delegate(root, 'click', '.gox-modal-overlay', (e, overlay) => {
      if (overlay.dataset.goxNoOverlayClose !== undefined) return;
      if (e.target === overlay) overlay.classList.add('is-hidden');
    });

    // ── ESC 關 modal ────────────────────────────
    on(document, 'keydown', (e) => {
      if (e.key !== 'Escape') return;
      const opens = document.querySelectorAll('.gox-modal-overlay:not(.is-hidden)');
      opens.forEach((m) => {
        if (m.dataset.goxNoOverlayClose === undefined) m.classList.add('is-hidden');
      });
    });

    // ── Icon button confirm / cancel ─────────────
    delegate(root, 'click', '.gox-icon-btn.is-confirm, .gox-icon-btn.is-cancel', (e, btn) => {
      const kind = btn.classList.contains('is-confirm') ? 'confirm' : 'cancel';
      const targetSel = btn.dataset.goxTarget;
      const target = targetSel ? document.querySelector(targetSel) : btn.closest('[data-gox-editable]');
      if (target) {
        target.dispatchEvent(new CustomEvent('gox:' + kind, { bubbles: true }));
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露給頁面級腳本使用（如「按下查詢」這種頁面級互動）
  window.gox = window.gox || {};
  window.gox.openModal  = (sel) => { const t = document.querySelector(sel); if (t) t.classList.remove('is-hidden'); };
  window.gox.closeModal = (sel) => { const t = document.querySelector(sel); if (t) t.classList.add('is-hidden'); };
  window.gox.toast = (msg) => {
    // 簡易 toast（自動消失）
    let host = document.querySelector('#gox-toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'gox-toast-host';
      host.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
      document.body.appendChild(host);
    }
    const t = document.createElement('div');
    t.className = 'gox-toast';
    t.textContent = msg;
    t.style.cssText = 'background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.2);';
    host.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
    setTimeout(() => t.remove(), 2200);
  };
})();

</script>
