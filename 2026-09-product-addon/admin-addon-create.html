<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>新增加購品 — 後台 demo</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ───── GoX Admin / base.css ─────
   後台殼共用 reset + 全域字型 + CSS 變數 token。
   color / spacing / radius 集中在 :root，後續元件一律 var(--gox-*) 取用，
   不要再回填 hex。 */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* ── 品牌綠 ── */
  --gox-green:           #4ba83b;   /* 主操作 / hover */
  --gox-green-hover:     #3d8c30;
  --gox-header-bg:       #D7F4DA;   /* header 淺綠底 */
  --gox-header-border:   #c2dfc4;

  /* ── 側欄深灰 ── */
  --gox-sider-bg:        #32323a;
  --gox-sider-sub-bg:    #28282e;
  --gox-sider-active-bg: #202025;
  --gox-sider-text:      #fff;
  --gox-sider-sub-text:  #cccccc;
  --gox-sider-active-text: bisque;

  /* ── 內容區 ── */
  --gox-content-bg:      #f1f2f7;
  --gox-card-bg:         #ffffff;
  --gox-card-border:     #e6e6e6;

  /* ── 文字 ── */
  --gox-text:            #333333;
  --gox-text-sub:        #666666;
  --gox-text-muted:      #888888;

  /* ── 語意色（補 antd primary #1677ff 之外）── */
  --gox-danger:          #dc4e43;   /* 主危險（與前台一致） */
  --gox-danger-soft:     #ff4d4f;   /* antd danger 替代值 */
  --gox-warning:         #fbbf24;
  --gox-info:            #2c98f0;
  --gox-success:         #52c41a;

  /* ── 元件尺寸 ── */
  --gox-header-h:        49px;
  --gox-sider-w:         160px;     /* Gift 170 + B2B 150 折衷 */
  --gox-radius:          4px;
  --gox-radius-lg:       6px;
  --gox-space-unit:      4px;

  /* ── 字型 / 字級 ── */
  --gox-font-family:     'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體',
                         -apple-system, BlinkMacSystemFont, sans-serif;
  --gox-font-size-base:  14px;
  --gox-font-size-sm:    13px;
  --gox-font-size-xs:    12px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
  color: var(--gox-text);
  background: var(--gox-content-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--gox-info); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 整個後台 wrapper（一定要包這層才能套色） */
.gox-page {
  min-height: 100vh;
  background: var(--gox-content-bg);
  color: var(--gox-text);
  font-family: var(--gox-font-family);
  font-size: var(--gox-font-size-base);
}

/* ───── GoX Admin / header.css ─────
   固定在頂端的淺綠 header：
     左：無毒農 logo（小張）
     中：breadcrumb（B2B管理 > 訂單管理）
     右：使用者快捷區（登出、通知；可選） */

.gox-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--gox-header-h);
  background: var(--gox-header-bg);
  border-bottom: 1px solid var(--gox-header-border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: var(--gox-font-family);
}

.gox-header .gox-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.gox-header .gox-logo img {
  height: 28px;
  width: auto;
  max-width: 120px;
  display: block;
}

/* ── breadcrumb ── */
.gox-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gox-text-sub);
  font-size: 15px;
  flex: 1;
  min-width: 0;
}
.gox-breadcrumb a {
  color: var(--gox-green);
  text-decoration: none;
}
.gox-breadcrumb a:hover { text-decoration: underline; }
.gox-breadcrumb .sep {
  color: var(--gox-text-muted);
  font-size: 12px;
}
.gox-breadcrumb strong {
  color: #000;
  font-weight: 700;
}

/* ── 右側使用者快捷區（可選）── */
.gox-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  font-size: var(--gox-font-size-sm);
}
.gox-header-right .gox-user {
  color: var(--gox-text);
}
.gox-header-right .gox-icon-btn {
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--gox-text-sub);
  padding: 4px 8px;
  font-family: inherit;
  font-size: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--gox-radius);
  white-space: nowrap;
}
.gox-header-right .gox-user { white-space: nowrap; }
.gox-header-right .gox-icon-btn:hover {
  background: rgba(0, 0, 0, .05);
  color: var(--gox-text);
}

/* ───── GoX Admin / sidebar.css ─────
   左側深灰固定側欄。支援：
     - 一級項目（可帶 badge 紅點）
     - 可摺疊群組（▶ / ▼）
     - 二級項目（active 高亮）
     - disabled 樣式 */

.gox-sidebar {
  width: var(--gox-sider-w);
  flex-shrink: 0;
  background: var(--gox-sider-bg);
  color: var(--gox-sider-text);
  padding: 8px 0;
  font-size: var(--gox-font-size-sm);
  overflow-y: auto;
  position: sticky;
  top: var(--gox-header-h);
  height: calc(100vh - var(--gox-header-h));
  font-family: var(--gox-font-family);
}

/* ── 一級項目 / 群組標題 ── */
.gox-sidebar .gox-menu-item,
.gox-sidebar .gox-menu-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  color: var(--gox-sider-text);
  background: transparent;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: var(--gox-font-size-sm);
  font-family: inherit;
  line-height: 1.5;
  user-select: none;
}
.gox-sidebar .gox-menu-item:hover,
.gox-sidebar .gox-menu-title:hover {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}

/* disabled（demo 未開放的入口） */
.gox-sidebar .gox-menu-item.is-disabled {
  cursor: default;
  color: #888;
}
.gox-sidebar .gox-menu-item.is-disabled:hover {
  background: transparent;
  color: #888;
}

/* 一級項目 active（無子項目、可直接點的頁面，例如「獨立平台」）
   字色用 !important 壓過腳本給一級項的 inline color:inherit，對齊二級 active 的 bisque */
.gox-sidebar .gox-menu-item.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text) !important;
  font-weight: 600;
}

/* 箭頭（▶ / ▼） */
.gox-sidebar .gox-arrow {
  display: inline-block;
  width: 12px;
  font-size: 9px;
  flex-shrink: 0;
  transition: transform .15s;
}

/* badge 紅點 */
.gox-sidebar .gox-badge {
  margin-left: auto;
  background: var(--gox-danger);
  color: #fff;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 11px;
  min-width: 16px;
  text-align: center;
  line-height: 16px;
}

/* ── 摺疊群組 ── */
.gox-sidebar .gox-menu-group.is-open .gox-menu-title {
  background: var(--gox-sider-sub-bg);
  color: var(--gox-sider-active-text);
}
.gox-sidebar .gox-menu-children {
  background: var(--gox-sider-sub-bg);
}

/* 二級項目 */
.gox-sidebar .gox-menu-child {
  display: block;
  padding: 8px 14px 8px 32px;
  color: var(--gox-sider-sub-text);
  text-decoration: none;
  font-size: var(--gox-font-size-sm);
}
.gox-sidebar .gox-menu-child:hover {
  background: #252530;
  color: var(--gox-sider-active-text);
  text-decoration: none;
}
.gox-sidebar .gox-menu-child.is-active {
  background: var(--gox-sider-active-bg);
  color: var(--gox-sider-active-text);
  font-weight: 600;
}

/* ───── GoX Admin / content.css ─────
   內容區共用元件：
     .gox-content / .gox-card / button / form / table / modal / tab / switch / icon-btn
   全部用 :root 變數，不直接寫 hex。 */

/* ── 主體佈局：header 下方的 sidebar + content ── */
.gox-body {
  display: flex;
  min-height: calc(100vh - var(--gox-header-h));
}
.gox-content {
  flex: 1;
  min-width: 0;          /* 讓子層 table overflow 正常 */
  padding: 16px;
  overflow-x: auto;
  background: var(--gox-content-bg);
}

/* ─────────────────────────────────────────────────
   Toolbox：工具型頁面的主要工作區容器
   預設 960px 限寬置中（表單、設定、編輯頁讀起來舒服）
   修飾詞依內容寬度需求調整
   ─────────────────────────────────────────────────
   何時用：
     - 系統設定、個人資料、單筆編輯、單一表單
     - 內容上下流式排列、欄位不多
   何時不用：
     - 列表頁（要滿寬度顯示表格）
     - 看板、儀表板（多欄並列）
     - 包含寬表格的編輯頁（會被切掉）
   範例：
     <main class="gox-content">
       <div class="gox-toolbox">  ← 用這個
         <h2>系統設定</h2>
         <div class="gox-card">…</div>
       </div>
     </main>
*/
.gox-toolbox {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.gox-toolbox.is-narrow { max-width: 720px; }   /* 表單少欄位、登入頁、設定密碼 */
.gox-toolbox.is-wide   { max-width: 1200px; }  /* 多欄表單、含中型表格 */
.gox-toolbox.is-fluid  { max-width: none; }    /* 內容太擠時退回滿寬 */

/* ─────────────────────────────────────────────────
   Card：後台主要的「白卡片」容器
   ───────────────────────────────────────────────── */
.gox-card {
  background: var(--gox-card-bg);
  border: 1px solid var(--gox-card-border);
  border-radius: var(--gox-radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.gox-card-title {
  margin: 0;
  padding: 12px 16px;
  background: var(--gox-card-bg);
  border-bottom: 1px solid var(--gox-card-border);
  font-size: 16px;
  font-weight: 600;
  color: var(--gox-text);
}
.gox-card-title.is-green {            /* 綠色強調標題（如「贈品設定」） */
  background: var(--gox-green);
  color: #fff;
  border-bottom: 0;
}
.gox-card-body { padding: 16px; }
.gox-card-body.is-table-padding { padding: 0; }     /* table 自己有 padding 時用 */

/* 卡片頂端列：左標題 / 右操作按鈕 */
.gox-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─────────────────────────────────────────────────
   Button
   ───────────────────────────────────────────────── */
.gox-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  line-height: 1.5;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.gox-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* 主操作 — 品牌綠 */
.gox-btn-primary {
  background: var(--gox-green);
  color: #fff;
  border-color: var(--gox-green);
}
.gox-btn-primary:hover:not(:disabled) { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }

/* 次操作 — 白底邊框 */
.gox-btn-default {
  background: #fff;
  color: var(--gox-text);
  border-color: #ccc;
}
.gox-btn-default:hover:not(:disabled) { background: #f5f5f5; border-color: var(--gox-green); color: var(--gox-green); }

/* 危險 */
.gox-btn-danger {
  background: #fff;
  color: var(--gox-danger);
  border-color: var(--gox-danger);
}
.gox-btn-danger:hover:not(:disabled) { background: var(--gox-danger); color: #fff; }

/* 列表內小按鈕（檢視 / 編輯 / 刪除） */
.gox-btn-op {
  display: inline-block;
  margin-right: 4px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  color: var(--gox-text);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.gox-btn-op:hover { background: #f5f5f5; text-decoration: none; }

/* ─────────────────────────────────────────────────
   Form
   ───────────────────────────────────────────────── */
.gox-form-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.gox-form-row > label {
  min-width: 110px;
  color: var(--gox-text);
  font-weight: 500;
}
.gox-input,
.gox-select,
.gox-textarea {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  background: #fff;
  color: var(--gox-text);
  line-height: 1.5;
  min-height: 32px;
  box-sizing: border-box;
}
.gox-input:focus,
.gox-select:focus,
.gox-textarea:focus {
  outline: 2px solid var(--gox-green);
  outline-offset: -1px;
  border-color: var(--gox-green);
}
.gox-input:disabled,
.gox-select:disabled,
.gox-textarea:disabled {
  background: #f5f5f5;
  color: #999;
  cursor: not-allowed;
}
.gox-textarea { min-height: 80px; resize: vertical; }

.gox-radio-group, .gox-checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.gox-hint {
  color: var(--gox-text-muted);
  font-size: var(--gox-font-size-xs);
}

/* ─────────────────────────────────────────────────
   Table
   ───────────────────────────────────────────────── */
.gox-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--gox-font-size-sm);
  background: #fff;
}
.gox-table th {
  background: #fafafa;
  border-bottom: 1px solid var(--gox-card-border);
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--gox-text-sub);
  white-space: nowrap;
}
.gox-table td {
  padding: 12px 8px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.gox-table tr:hover td { background: #fafafa; }
.gox-table .cell-center { text-align: center; }
.gox-table .cell-right { text-align: right; }
.gox-table .cell-ops { white-space: nowrap; }
.gox-table .row-error td { background: #fff1f0; }
.gox-table .row-error:hover td { background: #ffe0de; }

/* ─────────────────────────────────────────────────
   Tab（頁籤）
   ───────────────────────────────────────────────── */
.gox-tab-group {
  display: inline-flex;
  border: 1px solid #ccc;
  border-radius: var(--gox-radius);
  overflow: hidden;
}
.gox-tab-btn {
  padding: 6px 20px;
  background: #fff;
  border: 0;
  cursor: pointer;
  font-size: var(--gox-font-size-base);
  font-family: inherit;
  border-right: 1px solid #ccc;
  color: var(--gox-text);
}
.gox-tab-btn:last-child { border-right: 0; }
.gox-tab-btn.is-active {
  background: var(--gox-info);
  color: #fff;
}

/* ─────────────────────────────────────────────────
   Modal
   ───────────────────────────────────────────────── */
.gox-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.gox-modal-overlay.is-hidden { display: none; }
[hidden] { display: none !important; }
.gox-modal-box {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  min-width: 480px;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.gox-modal-box h4 { margin: 0 0 16px; font-size: 16px; }
.gox-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

/* ─────────────────────────────────────────────────
   Switch / Tag
   ───────────────────────────────────────────────── */
.gox-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  border-radius: 11px;
  border: 0;
  padding: 0;
  margin: 0;
  background: #d1d5db;
  cursor: pointer;
  transition: background .18s ease;
  vertical-align: middle;
}
.gox-switch.is-on { background: var(--gox-green); }
.gox-switch.is-disabled { opacity: .5; cursor: not-allowed; }
.gox-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .18s ease;
}
.gox-switch.is-on::after { transform: translateX(18px); }

.gox-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--gox-radius);
  font-size: var(--gox-font-size-xs);
  font-weight: 600;
  background: #f0f0f0;
  color: var(--gox-text-sub);
  border: 1px solid #e0e0e0;
}
.gox-tag.is-success { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
.gox-tag.is-info    { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-warning { background: #fffbe6; color: #d4b106; border-color: #ffe58f; }
.gox-tag.is-danger  { background: #fff1f0; color: var(--gox-danger); border-color: #ffccc7; }

/* 溫層快速 tag（兩專案都會用） */
.gox-tag.is-frozen  { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
.gox-tag.is-ambient { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }

/* ─────────────────────────────────────────────────
   Icon button（鉛筆 / 確認 / 取消）
   ───────────────────────────────────────────────── */
.gox-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--gox-radius);
  cursor: pointer;
  color: var(--gox-text-sub);
  font-size: 12px;
  font-family: inherit;
  transition: all .15s;
}
.gox-icon-btn:hover {
  background: #f0f4f8;
  color: var(--gox-info);
  border-color: #bcd4ea;
}
.gox-icon-btn.is-confirm { background: var(--gox-green); color: #fff; border-color: var(--gox-green); }
.gox-icon-btn.is-confirm:hover { background: var(--gox-green-hover); border-color: var(--gox-green-hover); }
.gox-icon-btn.is-cancel  { background: #fff; color: #999; border-color: #ccc; }
.gox-icon-btn.is-cancel:hover  { background: #f5f5f5; color: var(--gox-danger); border-color: var(--gox-danger); }

/* ─────────────────────────────────────────────────
   通用工具 class
   ───────────────────────────────────────────────── */
/* 顯示 / 隱藏切換用。以前每個產出頁都自己再宣告一次，收進來統一提供。 */
.is-hidden { display: none; }

</style>
</head>
<body>
<div class="gox-page">

<style>
  /* 新增加購品：綁定產品 → 規格設定 → 建立，比照禮物券新增流程 */
  .ac-step-hint { font-size: 12px; color: var(--gox-text-muted); margin: 0 0 16px; }

  .ac-bind-row { display: flex; gap: 8px; align-items: flex-start; }
  .ac-bind-row .gox-input { width: 200px; }
  .ac-bind-err { color: var(--gox-danger); font-size: 13px; margin-top: 8px; }
  .ac-bind-err.is-hidden { display: none; }

  .ac-product { display: none; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gox-card-border); }
  .ac-product.is-shown { display: flex; }
  .ac-pic {
    width: 116px; aspect-ratio: 4 / 3; height: auto; flex: none; align-self: flex-start; overflow: hidden; border-radius: var(--gox-radius);
    border: 1px solid var(--gox-card-border); background: #f7f7f7;
    display: flex; align-items: center; justify-content: center; color: var(--gox-text-muted); font-size: 12px;
  }
  .ac-pic img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--gox-radius); }
  .ac-pinfo { flex: 1; }
  .ac-pname { font-size: 15px; font-weight: 600; color: var(--gox-text); margin-bottom: 8px; }
  .ac-pmeta { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: var(--gox-text-sub); }
  .ac-pmeta div span { color: var(--gox-text-muted); margin-right: 4px; }
  .ac-tt { display:inline-block; font-size:11px; font-weight:600; line-height:1.6; border-radius:4px; padding:0 6px; }

<script>
(function () {
  'use strict';

  var PIC = {
    '88021': 'https://greenboxcdn.azureedge.net/products/Images/20250115163009.webp',
    '88105': 'https://greenboxcdn.azureedge.net/products/Images/20250115161945.webp'
  };
  var PRODUCTS = {
    '88021': { name: '台灣龍眼蜂蜜 小罐', line: '產地直送', temp: '常溫', specs: 2 },
    '88105': { name: '冷壓初榨橄欖油 250ml', line: '蔬果乾貨', temp: '常溫', specs: 1 },
    '88230': { name: '手工原味餅乾 綜合', line: '蔬果乾貨', temp: '常溫', specs: 3 },
    '88342': { name: '鮮乳坊 鮮奶 一瓶', line: '生鮮肉舖', temp: '冷藏', specs: 1 }
  };
  function tempCls(t){ return t==='冷藏'?'cold':(t==='冷凍'?'frozen':'normal'); }

  var bound = null;

  function setLocked(locked) {
    document.getElementById('ac-spec-body').classList.toggle('is-locked', locked);
    document.getElementById('ac-locked-msg').classList.toggle('is-hidden', !locked);
    document.getElementById('ac-create').disabled = locked;
  }

  function bind() {
    var pid = document.getElementById('ac-pid').value.trim();
    var err = document.getElementById('ac-bind-err');
    var box = document.getElementById('ac-product');
    var p = PRODUCTS[pid];
    if (!p) {
      err.textContent = pid ? ('找不到產品編號 ' + pid) : '請輸入產品 ID';
      err.classList.remove('is-hidden'); box.classList.remove('is-shown'); bound = null; setLocked(true); return;
    }
    err.classList.add('is-hidden'); bound = { pid: pid, p: p };
    document.getElementById('ac-pname').textContent = p.name + '（#' + pid + '）';
    document.getElementById('ac-pic-box').innerHTML = PIC[pid] ? '<img src="' + PIC[pid] + '" alt="' + p.name + '">' : '商品圖';
    document.getElementById('ac-pline').textContent = p.line;
    document.getElementById('ac-ptemp').innerHTML = '<span class="ac-tt ' + tempCls(p.temp) + '">' + p.temp + '</span>';
    document.getElementById('ac-pspecs').textContent = p.specs + ' 個';
    box.classList.add('is-shown'); setLocked(false);
    window.gox && window.gox.toast('已綁定「' + p.name + '」');
  }
  document.getElementById('ac-bind').addEventListener('click', bind);
  document.getElementById('ac-pid').addEventListener('keydown', function (e) { if (e.key === 'Enter') bind(); });

  function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
  document.getElementById('ac-create').addEventListener('click', function () {
    var desc = document.getElementById('ac-desc').value.trim();
    var price = document.getElementById('ac-price').value.trim();
    var stock = document.getElementById('ac-stock').value.trim();
    if (!desc) { window.gox.toast('請填寫規格描述'); document.getElementById('ac-desc').focus(); return; }
    if (!price) { window.gox.toast('請填寫產品原價'); document.getElementById('ac-price').focus(); return; }
    if (!stock) { window.gox.toast('請填寫庫存'); document.getElementById('ac-stock').focus(); return; }
    document.getElementById('ac-c-product').textContent = bound.p.name + '（#' + bound.pid + '）';
    document.getElementById('ac-c-desc').textContent = desc;
    document.getElementById('ac-c-price').textContent = money(Number(price));
    document.getElementById('ac-c-stock').textContent = stock;
    document.getElementById('ac-confirm').classList.remove('is-hidden');
  });
  document.getElementById('ac-c-ok').addEventListener('click', function () {
    document.getElementById('ac-confirm').classList.add('is-hidden');
    window.gox.toast('已建立加購品，接著設定折扣與掛載');
    setTimeout(function () { location.href = 'admin-addon-setting.html'; }, 900);
  });
  document.getElementById('ac-back').addEventListener('click', function () { location.href = 'admin-addon-list.html'; });

  setLocked(true);

  // 開發者面板
  document.addEventListener('DOMContentLoaded', function () {
    var devBar = document.getElementById('devbar');
    devBar.querySelector('.toggle').addEventListener('click', function () { devBar.classList.toggle('is-open'); });
    var devList = document.getElementById('dev-pids');
    devList.innerHTML = Object.keys(PRODUCTS).map(function (pid) {
      var dp = PRODUCTS[pid];
      return '<button type="button" data-pid="' + pid + '"><b>' + pid + '</b>' + dp.name + '<span>' + dp.line + '・' + dp.temp + '</span></button>';
    }).join('');
    devList.addEventListener('click', function (e) {
      var pb = e.target.closest('[data-pid]'); if (!pb) return;
      document.getElementById('ac-pid').value = pb.getAttribute('data-pid');
      bind(); devBar.classList.remove('is-open');
    });
  });
})();
</script>

</main>

<script>
/* ───── GoX Admin / gox-interactions.js ─────
   後台殼共用的「元件級互動」。
   由 build_prototype.py 自動內聯到輸出 HTML，呼叫者寫對 class 就會動。

   覆蓋範圍（你不用為這些再寫 JS）：
     - .gox-switch         click  → toggle .is-on
     - .gox-tab-btn        click  → 同 .gox-tab-group 內切 .is-active
     - .gox-menu-title     click  → toggle 父 .gox-menu-group .is-open + 箭頭
     - [data-gox-open]     click  → 顯示 #target modal（移除 .is-hidden）
     - [data-gox-close]    click  → 隱藏所屬 .gox-modal-overlay
     - .gox-modal-overlay  click  → 點背景關（除非有 data-gox-no-overlay-close）
     - .gox-icon-btn.is-confirm/.is-cancel click → 觸發 [data-gox-target] 的 confirm/cancel CustomEvent
     - .gox-menu-child     click  → 同 .gox-sidebar 內切 .is-active

   不覆蓋（你要自己寫）：
     - 篩選 / 排序 / 搜尋
     - 狀態機（pending → confirmed → done 之類）
     - 跨元件聯動
     - 表單送出 / 假 API 回傳
   ➜ 在 content_html 裡寫 <script>，用 DOMContentLoaded 包起來。
*/
(function () {
  'use strict';

  function on(el, ev, fn) { el.addEventListener(ev, fn); }
  function delegate(root, ev, selector, fn) {
    on(root, ev, (e) => {
      const t = e.target.closest(selector);
      if (t && root.contains(t)) fn(e, t);
    });
  }

  function init() {
    const root = document;

    // ── Switch ─────────────────────────────────
    delegate(root, 'click', '.gox-switch', (e, el) => {
      if (el.classList.contains('is-disabled')) return;
      el.classList.toggle('is-on');
      el.dispatchEvent(new CustomEvent('gox:switch', {
        bubbles: true,
        detail: { on: el.classList.contains('is-on') },
      }));
    });

    // ── Tab group ───────────────────────────────
    delegate(root, 'click', '.gox-tab-group .gox-tab-btn', (e, btn) => {
      const group = btn.closest('.gox-tab-group');
      group.querySelectorAll('.gox-tab-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const key = btn.dataset.tab;
      group.dispatchEvent(new CustomEvent('gox:tab', {
        bubbles: true,
        detail: { tab: key, btn },
      }));
      // 若有 data-tab，自動切 [data-tab-panel] 顯示
      if (key) {
        const scope = btn.closest('[data-tab-scope]') || document;
        scope.querySelectorAll('[data-tab-panel]').forEach((p) => {
          p.hidden = p.dataset.tabPanel !== key;
        });
      }
    });

    // ── Sidebar menu group 摺疊 ──────────────────
    delegate(root, 'click', '.gox-menu-title', (e, btn) => {
      const group = btn.closest('.gox-menu-group');
      if (!group) return;
      group.classList.toggle('is-open');
      const arrow = btn.querySelector('.gox-arrow');
      if (arrow) arrow.textContent = group.classList.contains('is-open') ? '▼' : '▶';
    });

    // ── Sidebar menu child active ────────────────
    delegate(root, 'click', '.gox-sidebar .gox-menu-child', (e, link) => {
      // 不阻止預設行為（讓 href 還能跳）；但若是 href="#" 純 demo，做 active 切換
      if (link.getAttribute('href') === '#') e.preventDefault();
      const side = link.closest('.gox-sidebar');
      side.querySelectorAll('.gox-menu-child.is-active').forEach((a) => a.classList.remove('is-active'));
      link.classList.add('is-active');
    });

    // ── Modal open ──────────────────────────────
    delegate(root, 'click', '[data-gox-open]', (e, btn) => {
      const sel = btn.dataset.goxOpen;
      const target = sel && document.querySelector(sel);
      if (target) target.classList.remove('is-hidden');
    });

    // ── Modal close（按鈕） ─────────────────────
    delegate(root, 'click', '[data-gox-close]', (e, btn) => {
      const modal = btn.closest('.gox-modal-overlay');
      if (modal) modal.classList.add('is-hidden');
    });

    // ── Modal close（點背景） ───────────────────
    delegate(root, 'click', '.gox-modal-overlay', (e, overlay) => {
      if (overlay.dataset.goxNoOverlayClose !== undefined) return;
      if (e.target === overlay) overlay.classList.add('is-hidden');
    });

    // ── ESC 關 modal ────────────────────────────
    on(document, 'keydown', (e) => {
      if (e.key !== 'Escape') return;
      const opens = document.querySelectorAll('.gox-modal-overlay:not(.is-hidden)');
      opens.forEach((m) => {
        if (m.dataset.goxNoOverlayClose === undefined) m.classList.add('is-hidden');
      });
    });

    // ── Icon button confirm / cancel ─────────────
    delegate(root, 'click', '.gox-icon-btn.is-confirm, .gox-icon-btn.is-cancel', (e, btn) => {
      const kind = btn.classList.contains('is-confirm') ? 'confirm' : 'cancel';
      const targetSel = btn.dataset.goxTarget;
      const target = targetSel ? document.querySelector(targetSel) : btn.closest('[data-gox-editable]');
      if (target) {
        target.dispatchEvent(new CustomEvent('gox:' + kind, { bubbles: true }));
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露給頁面級腳本使用（如「按下查詢」這種頁面級互動）
  window.gox = window.gox || {};
  window.gox.openModal  = (sel) => { const t = document.querySelector(sel); if (t) t.classList.remove('is-hidden'); };
  window.gox.closeModal = (sel) => { const t = document.querySelector(sel); if (t) t.classList.add('is-hidden'); };
  window.gox.toast = (msg) => {
    // 簡易 toast（自動消失）
    let host = document.querySelector('#gox-toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'gox-toast-host';
      host.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
      document.body.appendChild(host);
    }
    const t = document.createElement('div');
    t.className = 'gox-toast';
    t.textContent = msg;
    t.style.cssText = 'background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.2);';
    host.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
    setTimeout(() => t.remove(), 2200);
  };
})();

</script>
