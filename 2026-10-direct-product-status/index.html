<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<!--
  DemoShares 交接對照 | 產地直送上下架呈現優化 demo 目錄
  portal 無對應正式站 view（純 demo 索引頁，工程不需照抄）。
  子頁：
    前台：product-list.html、product-detail.html
    測試：status-test.html
-->
<meta charset="UTF-8">
<title>產地直送上下架呈現優化 demo 索引</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:56px 20px;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.7;color:#1a1a1a;background:#fafbfb}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:30px;margin:0 0 4px;color:#4ba83b}
  .sub{color:#999;font-size:14px;margin:0 0 32px}
  .side{margin-bottom:40px}
  .side>h2{font-size:20px;font-weight:700;color:#1a1a1a;margin:0 0 16px;padding-left:12px;border-left:4px solid #4ba83b}
  .entries{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:760px){.entries{grid-template-columns:1fr}}
  .entry{display:flex;flex-direction:column;background:#fff;border:1px solid #e0e4e6;border-radius:4px;padding:20px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
  .entry:hover{border-color:#4ba83b;box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px)}
  .entry .name{font-size:16px;font-weight:700;color:#4ba83b;margin-bottom:4px}
  .entry .desc{font-size:13px;color:#595757;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>產地直送上下架呈現優化・demo</h1>
  <p class="sub">2026-10</p>

  <section class="side">
    <h2>前台</h2>
    <div class="entries">
      <a class="entry" href="product-list.html"><span class="name">列表頁｜分類與搜尋可見性</span><span class="desc">還原產地直送列表；搜尋可找到產季與停售商品。</span></a>
      <a class="entry" href="product-detail.html"><span class="name">商品頁｜狀態蓋圖與購買按鈕</span><span class="desc">搜尋可進商品頁；依狀態顯示蓋圖、產期文字與不可購買按鈕。</span></a>
    </div>
  </section>

  <section class="side">
    <h2>測試</h2>
    <div class="entries">
      <a class="entry" href="status-test.html"><span class="name">測試台｜後台欄位與前台連動</span><span class="desc">填寫日期、狀態與原因，比較子分類及搜尋區塊的呈現。</span></a>
    </div>
  </section>
</div>
</body>
</html>
