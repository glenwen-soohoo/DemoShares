<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<!--
  DemoShares 交接對照 | APP 商品頁｜上下架狀態呈現
  改的是既有介面：App 商品詳情頁  screen src/screens/ProductDetailScreen/ProductDetailScreen.tsx
  真相來源：D:\GreenBox\fruit_app\src（2026-10-19 讀）

  這次要動的檔（改既有 3 支 ／ 新建 2 項）：
    [改既有] fruit_app src/screens/ProductDetailScreen/ProductShoppingTab.tsx   底部購買列；現在只吃 disabled 布林，要改吃狀態物件才能顯示原因
    [改既有] fruit_app src/screens/ProductDetailScreen/ProductDetailScreen.tsx  傳狀態給購買列（現在是 disabled={!data?.IsAvailable}），商品圖上加狀態遮罩
    [改既有] fruit_app src/components/AddToCartModal.tsx                        規格選擇視窗的按鈕；商品層級狀態要排在規格庫存前面
    [新建]   API 回傳的商品前台狀態欄位                                          App 現在只拿得到 IsAvailable 布林，沒有任何狀態文案欄位
    [新建]   App 的到貨提醒（開賣通知我）                                        ⚠ fruit_app 目前完全沒有這個功能，不是改字是新功能
    [只參考] fruit_app src/utils/constant.ts                                    theme primary #4BA83B / red #FF4040 / bgColor #F2F2F2，沿用不改

  畫面重點：左下情境面板可切七種狀態，並切「現況」與「改版後」對照。
  現況欄的重點是：不管什麼原因，App 底部按鈕一律只有「補貨中」三個字。
-->
<meta charset="UTF-8">
<title>APP 商品頁上下架狀態 (demo)</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 手機框與內容版型依 fruit_app src/screens/ProductDetailScreen 還原。
     色票 fruit_app theme：primary #4BA83B、red #FF4040、bgColor #F2F2F2、停用 #C6C6C6。 */
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#c9ccce;color:#000;
       display:flex;justify-content:center;padding:24px 0;min-height:100vh}

  .app{width:390px;height:min(812px,calc(100vh - 48px));background:#F2F2F2;border-radius:28px;overflow:hidden;
       box-shadow:0 12px 40px rgba(0,0,0,.22);position:relative;display:flex;flex-direction:column}
  .statusbar{flex:0 0 34px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700}
  .sb-icons{display:flex;align-items:flex-end;gap:4px}
  .sb-icons i{display:block;width:4px;background:#000;border-radius:1px}
  .sb-icons b{margin-left:4px;width:22px;height:11px;border:1.5px solid #000;border-radius:2px;position:relative}
  .sb-icons b::after{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:#000;border-radius:1px}
  .appbar{flex:0 0 48px;background:#fff;display:flex;align-items:center;padding:0 4px}
  .appbar button{width:40px;height:40px;border:0;background:none;font-size:28px;line-height:1;color:#000;font-family:inherit}
  .appbar .title{flex:1;text-align:center;font-size:16px;font-weight:600}
  .appbar .spacer{width:40px}

  .scroll{flex:1;overflow-y:auto;padding-bottom:76px}

  /* 商品圖與狀態遮罩 */
  .hero{position:relative;width:100%;aspect-ratio:4/3;background:#ddd}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .stamp{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;padding:16px;
         background:rgba(26,26,26,.6);color:#fff;pointer-events:none}
  .stamp.on{display:flex}
  .stamp-label{display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:80%;
               padding:8px 16px;border:1px solid #fff;border-radius:4px;font-size:20px;font-weight:700;line-height:1.5;
               text-align:center;transform:rotate(-8deg);text-shadow:0 1px 2px rgba(0,0,0,.24)}
  .stamp-season{font-size:14px;font-weight:500}

  .card{background:#fff;border-radius:8px;margin:12px;padding:16px}
  .place{font-size:12px;color:#595757}
  .name{font-size:17px;font-weight:600;line-height:1.5;margin:8px 0}
  .price{font-size:20px;font-weight:700;color:#FF4040}
  .price s{font-size:14px;font-weight:400;color:#999;margin-left:8px}
  .tags{display:flex;gap:4px;margin-top:8px}
  .tag{font-size:12px;padding:2px 8px;border-radius:4px;color:#fff}
  .tag.temp{background:#ff8e88}
  .tag.cat{background:#4BA83B}
  .headline{font-size:16px;font-weight:600;margin:0 0 8px}
  .specline{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-top:1px solid #eee}
  .specline:first-of-type{border-top:0}
  .remind{font-size:13px;color:#595757;line-height:1.8}

  /* 到貨提醒入口（改版後才有，App 目前沒有這個功能） */
  .notify{display:none;margin:12px;padding:12px;border-radius:8px;background:#fff;border:1px solid #FF4040;
          color:#FF4040;font-size:15px;font-weight:600;text-align:center}
  .notify.on{display:block}
  .notify small{display:block;margin-top:4px;font-size:12px;font-weight:400;color:#999}

  /* 底部固定購買列：fruit_app ProductShoppingTab，整列 68、按鈕 40、圓角 24、字 17 */
  .buybar{position:absolute;left:0;right:0;bottom:0;height:68px;background:rgba(255,255,255,.72);
          backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;
          padding:8px 16px;gap:8px}
  .cartbtn{width:40px;height:40px;border-radius:20px;border:1.5px solid #4BA83B;background:#fff;
           display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;flex:0 0 auto}
  .buybtn{flex:1;height:40px;border:0;border-radius:24px;background:#FF4040;color:#fff;font-size:17px;font-weight:600;font-family:inherit}
  .buybtn.off{background:#C6C6C6}

  /* 規格選擇視窗：fruit_app AddToCartModal，從底部拉起 */
  .sheetmask{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;z-index:5}
  .sheetmask.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:16px;z-index:6;
         transform:translateY(100%);transition:transform .25s ease;max-height:76%;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .sheet h3{margin:0 0 12px;font-size:16px}
  .specopt{border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:8px;font-size:14px}
  .specopt.sel{border-color:#4BA83B;background:#f3faf1}
  .specopt .row{display:flex;justify-content:space-between;align-items:center}
  .sheetbtn{width:100%;height:48px;border:0;border-radius:8px;background:#FF4040;color:#fff;font-size:18px;font-weight:600;font-family:inherit;margin-top:8px}
  .sheetbtn.off{background:#C6C6C6}

  /* 情境面板：框外，一看就知道不是 App 畫面的一部分 */
  .panel{position:fixed;left:16px;bottom:16px;z-index:50;background:#fff;border:1px solid #e0e4e6;border-radius:4px;
         padding:16px;width:260px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .panel h2{margin:0 0 12px;font-size:15px;color:#4ba83b}
  .panel .grp{margin-bottom:12px}
  .panel .grp:last-child{margin-bottom:0}
  .panel label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
  .panel input{accent-color:#4ba83b;margin:0}
  .panel .sub{color:#595757;font-size:12px;margin:0 0 4px}
  .panel hr{border:0;border-top:1px solid #e0e4e6;margin:12px 0}

  @media (max-width:480px){
    body{display:block;margin:0;padding:0;background:#F2F2F2}
    .app{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
    .statusbar{display:none}
    .panel{left:8px;right:8px;bottom:8px;width:auto}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i><b></b></span>
  </div>
  <header class="appbar">
    <button aria-label="返回">‹</button>
    <div class="title">商品詳情</div>
    <div class="spacer"></div>
  </header>

  <div class="scroll">
    <div class="hero">
      <img id="heroImg" alt="">
      <div class="stamp" id="stamp"><div class="stamp-label"><span id="stampText"></span><span class="stamp-season" id="stampSeason"></span></div></div>
    </div>

    <div class="card">
      <div class="place">產地：台南麻豆</div>
      <div class="name" id="pName"></div>
      <div class="price">$679 <s>$879</s></div>
      <div class="tags"><span class="tag temp">常溫</span><span class="tag cat">產地直送</span></div>
    </div>

    <div class="notify" id="notify"><span id="notifyText">開賣通知我</span></div>

    <div class="card">
      <div class="headline">商品規格</div>
      <div class="specline"><span>1 箱（5斤裝）</span><span>$679</span></div>
      <div class="specline"><span>1 箱（10斤裝）</span><span>$1,238</span></div>
    </div>

    <div class="card">
      <div class="headline">常溫運費</div>
      <div class="specline"><span>滿 999 免運</span><span>$150</span></div>
    </div>

    <div class="card">
      <div class="headline">貼心叮嚀</div>
      <div class="remind">預購商品，備註10下旬陸續出貨<br>收到後請立即果品檢查，並冷藏保存</div>
    </div>
  </div>

  <div class="buybar">
    <div class="cartbtn">🛒</div>
    <button class="buybtn" id="buyBtn">加入購物車</button>
  </div>

  <div class="sheetmask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <h3>選擇規格</h3>
    <div class="specopt sel"><div class="row"><span>1 箱（5斤裝）</span><span>$679</span></div><div style="color:#595757;font-size:12px;margin-top:4px">剩餘 8 箱</div></div>
    <div class="specopt"><div class="row"><span>1 箱（10斤裝）</span><span>$1,238</span></div><div style="color:#595757;font-size:12px;margin-top:4px">剩餘 10 箱</div></div>
    <button class="sheetbtn" id="sheetBtn">加入購物車</button>
  </div>
</div>

<div class="panel">
  <h2>情境切換</h2>
  <div class="grp">
    <p class="sub">商品狀態</p>
    <label><input type="radio" name="st" value="normal">正常販售</label>
    <label><input type="radio" name="st" value="seasonEnded">產季結束</label>
    <label><input type="radio" name="st" value="seasonNotStarted">產季未到</label>
    <label><input type="radio" name="st" value="weatherPaused" checked>氣候因素暫停接單</label>
    <label><input type="radio" name="st" value="supplyPaused">供貨不足，暫停接單</label>
    <label><input type="radio" name="st" value="discontinued">本商品已停止販售</label>
    <label><input type="radio" name="st" value="saleNotStarted">未開賣</label>
    <label><input type="radio" name="st" value="soldOut">已售完</label>
  </div>
  <hr>
  <div class="grp">
    <p class="sub">版本</p>
    <label><input type="radio" name="ver" value="now">現況的 App</label>
    <label><input type="radio" name="ver" value="next" checked>改版後</label>
  </div>
</div>

<script>
(function(){
  var IMGS = JSON.parse(document.getElementById('imgs').textContent);
  var PID = { normal:'25458', seasonEnded:'26668', seasonNotStarted:'56416',
              weatherPaused:'73310', supplyPaused:'59303', discontinued:'59348',
              saleNotStarted:'73310', soldOut:'73310' };

  // 遮罩文字：跟 Web demo 同一套
  var STAMP = { seasonEnded:['產季結束'], seasonNotStarted:['產季未到'],
                weatherPaused:['氣候因素','暫停接單'], supplyPaused:['供貨不足','暫停接單'],
                discontinued:['本商品已','停止販售'] };

  // 改版後的底部按鈕文案
  var NEXT = { normal:'加入購物車', seasonEnded:'產季已結束，開賣通知我', seasonNotStarted:'開賣通知我',
               weatherPaused:'開賣通知我', supplyPaused:'開賣通知我', discontinued:'已停止販售',
               saleNotStarted:'尚未開始販售', soldOut:'開賣通知我' };

  // 改版後的規格視窗按鈕；未開賣沿用 App 既有的「於 X 開放訂購」
  var OPEN_AT = '於 2026/11/15 12:00 開放訂購';
  var NEXT_SHEET = { normal:'加入購物車', seasonEnded:'結束販售', seasonNotStarted:'結束販售',
                     weatherPaused:'暫停販售', supplyPaused:'暫停販售', discontinued:'結束販售',
                     saleNotStarted:OPEN_AT, soldOut:'補貨中' };

  // 現況：底部一律補貨中，規格視窗照 AddToCartModal 四種
  var NOW_SHEET = { normal:'加入購物車', seasonEnded:'補貨中', seasonNotStarted:'補貨中',
                    weatherPaused:'補貨中', supplyPaused:'補貨中', discontinued:'補貨中',
                    saleNotStarted:OPEN_AT, soldOut:'補貨中' };

  var el = function(id){ return document.getElementById(id); };
  function render(){
    var st = document.querySelector('input[name=st]:checked').value;
    var next = document.querySelector('input[name=ver]:checked').value === 'next';
    var img = IMGS[PID[st]];
    el('heroImg').src = img.data;
    el('heroImg').alt = img.name;
    el('pName').textContent = img.name;

    // 遮罩只在改版後出現
    var lines = next ? STAMP[st] : null;
    el('stamp').classList.toggle('on', !!lines);
    if (lines) {
      el('stampText').innerHTML = lines.join('<br>');
      el('stampSeason').textContent = st === 'seasonNotStarted' ? '預計11月中旬採收' : '';
    }

    var buyable = st === 'normal';
    var btnText = next ? NEXT[st] : (buyable ? '加入購物車' : '補貨中');
    el('buyBtn').textContent = btnText;
    el('buyBtn').classList.toggle('off', !buyable && !(next && /通知/.test(btnText)));

    el('notify').classList.toggle('on', next && /通知/.test(btnText));
    if (/通知/.test(btnText)) el('notifyText').textContent = btnText;

    var sheetText = (next ? NEXT_SHEET : NOW_SHEET)[st];
    el('sheetBtn').textContent = sheetText;
    el('sheetBtn').classList.toggle('off', sheetText !== '加入購物車');
  }

  document.querySelectorAll('.panel input').forEach(function(i){ i.addEventListener('change', render); });
  el('buyBtn').addEventListener('click', function(){
    if (el('buyBtn').classList.contains('off')) return;
    el('sheet').classList.add('on'); el('sheetMask').classList.add('on');
  });
  el('sheetMask').addEventListener('click', function(){
    el('sheet').classList.remove('on'); el('sheetMask').classList.remove('on');
  });
  render();
})();
</script>
</body>
</html>
