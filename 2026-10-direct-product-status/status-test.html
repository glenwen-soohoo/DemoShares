<style>@layer base {
    .exclude-display-none {
        display: none;
    }
}

@keyframes slideFadeIn {
    0% {
        opacity: 0;
        transform: translateX(-1rem);
    }

    100% {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideFadeOut {
    0% {
        opacity: 1;
        transform: translateX(0);
    }

    100% {
        opacity: 0;
        transform: translateX(-1rem);
    }
}

@keyframes rotateOriginal {
    0% {
        transform: rotate(180deg);
    }

    100% {
        transform: rotate(0deg);
    }
}

@keyframes rotateReverse {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(180deg);
    }
}

@layer components {
    .exclude-slide-fade-in {
        animation: slideFadeIn 0.3s ease-in-out;
        transform-origin: top;
        animation-fill-mode: forwards;
    }

    .exclude-slide-fade-out {
        animation: slideFadeOut 0.3s ease-in-out;
        transform-origin: top;
        animation-fill-mode: forwards;
        pointer-events: none;
    }

    .rotate-original {
        animation: rotateOriginal 0.3s ease-in-out;
        transform-origin: center;
        animation-fill-mode: forwards;
    }

    .rotate-reverse {
        animation: rotateReverse 0.3s ease-in-out;
        transform-origin: center;
        animation-fill-mode: forwards;
    }
}</style>

    /* 主選單 / 購物車按鈕點擊後焦點殘留的 :focus outline 抑制（這幾個是 platform CDN React 元件，
       outline 形狀會被內部 absolute dropdown 撐大、視覺礙眼，所以滑鼠 click 整個關掉）。
       購物車按鈕在 _PartialLayoutHeader.cshtml 內依版型有三個 id：
         #cartbtn（手機 m-gb-cart-btn）、#web-cart-btn（桌機）、#groupCartBtn（團購首頁）
       #shopping-cart 是 cart/index.js React mount 點，用 descendant 一併覆蓋裡面 a/button。
       詳見 D:\Obsidian\GreenBox\02_一般需求\202605_彈窗壓縮優化與首頁選單active殘留\首頁選單active殘留排查.md */
    #navbar a:focus:not(:focus-visible),
    #shopping-cart :focus:not(:focus-visible),
    #cartbtn:focus:not(:focus-visible),
    #web-cart-btn:focus:not(:focus-visible),
    #groupCartBtn:focus:not(:focus-visible) {
        outline: none;
    }

    /* 關閉瀏覽器在連結 / 按鈕 / 表單元素上的預設 focus 外框（含偶發黑框；常見於滑鼠點擊後被
       :focus-visible 判定為「需顯示焦點」而冒出的黑色 outline，例如商品圖片連結 .example-image-link、
       購買 <button>、slick 切換箭頭）。站上雖有 :focus{outline:0} reset，但部分元件因載入順序 / 外掛
       腳本未被擋住，這條放在全站皆載入的 header <style>、特異性 (0,1,1) 高於 reset，可確實覆蓋。
       下面會員中心兩處規則特異性更高 ((0,2,0)/(0,2,1))，仍保留品牌綠外框，不受這條影響。 */
    a:focus,
    button:focus,
    input:focus,
    select:focus,
    textarea:focus,
    [tabindex]:focus,
    .example-image-link:focus {
        outline: none;
    }

    /* focus outline 只保留在「會員中心入口」與「會員中心左側選單」兩處，使用品牌綠 #98cd90，
       滑鼠 click + 鍵盤 Tab 都顯示，作為「點到了」的反饋。
       其餘全站連結（商品卡、看更多等）的 focus outline 維持 styleNew.css reset 的關閉狀態
       （:focus{outline:0} / a{outline:none}），避免滑鼠點擊後殘留綠框。
       本組 selector 特異性（.member-wrap-link:focus = 0,2,0；.left_menu a:focus = 0,2,1）皆高於 reset，故能正確覆蓋。
       border-radius 讓 outline 圓角；Chrome 94+ / Firefox 88+ / Safari 16.4+ 會跟著 outline 一起渲染圓角。 */
    .member-wrap-link:focus,
    .left_menu a:focus {
        outline: 2px solid #98cd90;
        outline-offset: 2px;
        border-radius: 4px;
    }
</style>

    #examine_modal .report_banner img { display: block; margin: 0 auto; }
    /* 質譜快速篩檢報告專用章：排在農藥表下方、靠右、上下留白、半透明 */

      /* modal 寬度鎖死不超視窗（防 slick 撐寬）、固定高度（兩 tab 同大小）、不滑動 */
      /* 手機：絕對定位釘死 modal（header 下方 110 到底部留 24，左右各 12），

      #examine_modal .modal-dialog { position: fixed !important; top: 110px !important; bottom: 24px !important; left: 12px !important; right: 12px !important; margin: 0 !important; width: auto !important; max-width: none !important; }

    /* slick：容器限寬+裁切顯示單張；track 絕不可限寬（否則 4 張無法橫排會垂直堆疊撐爆 modal） */
    #examine_modal .report_banner, #examine_modal .slick-list { max-width: 100%; }

    #examine_modal .slick-prev { left: 2px; }
    #examine_modal .slick-next { right: 2px; }

<body>
<div class="ds-lab">
<header class="ds-lab-header"><h1>產地直送狀態測試台</h1><nav class="ds-links"><a href="index.html">demo 目錄</a><a href="product-list.html" target="_blank">前台列表 <i class="fa fa-external-link" aria-hidden="true"></i></a><a id="detail-link" target="_blank">商品詳細頁 <i class="fa fa-external-link" aria-hidden="true"></i></a></nav></header>
<main class="ds-lab-workspace">
<aside class="ds-lab-controls">
<form id="controls">
<section><div class="ds-lab-section-heading"><h2>商品設定<span class="ds-lab-note">商品層級，以 大白柚 為例</span></h2>
<label class="ds-lab-check"><input id="Display" type="checkbox">上架</label></div>
<div class="ds-lab-product-fields">
<label class="ds-lab-field"><span>快速到貨-類別</span><select id="Type2"><option value="2">七十二小時</option><option value="0">其他一般子分類</option><option value="6">不顯示</option></select></label>
<div class="ds-lab-field"><label for="RemindText" class="ds-lab-group-label">上架提醒事項</label><div class="ds-lab-reminder"><span>預計</span><textarea id="RemindText" name="RemindText" rows="1"></textarea><span>採收</span></div></div>
</div></section>
<section><div class="ds-lab-section-heading"><h2>產品標籤<span class="ds-lab-note">商品層級，以後台最新紀錄，今日時間為準</span></h2><label class="ds-lab-check"><input id="hasTag" type="checkbox">有產品標籤紀錄</label></div>
<fieldset id="record-fields" aria-label="最新產品標籤紀錄"><div class="ds-lab-record-row"><label class="ds-lab-field"><span>日期</span><input id="EventDate" type="date" required></label>
<label class="ds-lab-field"><span>狀態</span><select id="Status" name="Status" required><option>正常上架</option><option>正常下架</option><option>提早上架</option><option>提早下架</option><option>未上架</option></select></label></div>
<div class="ds-lab-group-label">原因</div><div id="reasons" class="ds-lab-reasons"></div><p id="picked-reasons" class="ds-lab-picked" aria-live="polite"></p></fieldset>
</section>
<section><div class="ds-lab-section-heading"><h2>規格設定<span class="ds-lab-note">規格層級，每個規格各一組</span></h2></div>
<div class="ds-lab-product-fields">
<div class="ds-lab-sale-times"><label class="ds-lab-field"><span>開始販售時間</span><input id="StartTime" type="datetime-local" step="60" required></label><label class="ds-lab-field"><span>結束販售時間</span><input id="EndTime" type="datetime-local" step="60" required></label></div>
<div class="ds-lab-stock-group"><div class="ds-lab-group-label">可售庫存（箱）</div><div id="stock-fields" class="ds-lab-stock-fields"></div></div></div>
<p class="ds-lab-picked">正式系統每個規格各有一組販售時間，測試台這一組同時套用到大白柚的兩個規格；庫存本來就是逐規格填。</p></section>
<p id="form-error" class="ds-lab-error" role="alert" hidden></p>
</form>
</aside>
<div class="ds-lab-previews">
<section class="ds-lab-band"><div class="ds-lab-band-heading"><h2 id="category-title">首頁/產品頁列表</h2><span id="category-count"></span></div>
<div class="ds-lab-incomplete" hidden>尚未填寫完畢</div>
<div id="product-category" class="campaign"><div class="ant-app css-ni1kz0"><div id="category-grid" class="grid grid-cols-12 gap-y-6 gap-x-4 md:gap-8"></div><p id="category-empty" class="ds-lab-empty" hidden>目前沒有商品</p></div></div></section>
<section class="ds-lab-band"><div class="ds-lab-band-heading ds-lab-search-heading"><h2>搜尋結果</h2><span id="search-count"></span>
<form id="search-form" class="ds-lab-search-form" role="search"><input type="search" id="search-query" value="大白柚" placeholder="商品名稱或 ID" aria-label="搜尋測試商品"><button type="submit" aria-label="搜尋"><i class="fa fa-search" aria-hidden="true"></i></button></form></div>
<div class="ds-lab-incomplete" hidden>尚未填寫完畢</div>
<div id="search-page" class="campaign"><div class="ant-app css-ni1kz0"><div id="search-normal" class="container-tw mb-10"><div id="search-normal-grid" class="grid grid-cols-12 gap-x-4 gap-y-6 md:gap-8"></div></div><div id="search-unavailable" class="container-tw mb-10 bg-gray-100 py-4"><h3 class="my-0 mb-4 text-2xl font-bold">缺貨中</h3><div id="search-unavailable-grid" class="grid grid-cols-12 gap-x-4 gap-y-6 md:gap-8"></div></div><p id="search-empty" class="ds-lab-empty" hidden>查無商品</p></div></div></section>
<div class="ds-lab-purchase-row">
<section class="ds-lab-band ds-lab-detail-band"><div class="ds-lab-band-heading"><h2>商品詳細頁：規格與購買</h2></div><div class="ds-lab-incomplete" hidden>尚未填寫完畢</div><div id="detail-purchase" class="ds-lab-purchase"></div></section>
<section class="ds-lab-band ds-lab-detail-band"><div class="ds-lab-band-heading"><h2>快速購買視窗</h2></div><div class="ds-lab-incomplete" hidden>尚未填寫完畢</div><div id="quick-preview" class="ds-lab-quick"></div></section>
</div>
</div>
</main>
</div>

202110260129101.jpg\" style=\"width: 100%; height: 99%;\">\u003cbr>\n\u003cbr>\n\u003cbig style=\"color:#000;font-size:16px;\">\u003cspan style=\"font-size: 16px;\">切開來看，茂谷柳丁的肉色更橘、果肉更厚、多汁，纖維也比較細，容易咀嚼，比傳統柳丁更多了一股柳橙的香氣。\u003c/span>\u003c/big>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"來自雲林古坑，獨特的「茂谷柳丁」，外觀有如傳統柳丁一樣黃澄澄，果肉像是茂谷柑一樣帶有夕陽般的橘色，外觀風味兼具，口感也結合了兩者的優點，清甜又多汁，是市場上潛力新秀，吸引饕客紛紛嘗鮮!  也因為皮薄汁多容易造成落果及裂果，因此需要農友細心的照顧，才能造就累累的果實。\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110260130441.jpg\" style=\"width: 99%; height: 99%;\">\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">茂谷柳丁\u003cbr>\n-&nbsp;外觀、風味一次滿足\u003c/h2>\n\u003cspan style=\"color:#000000;font-size:16px;\">獨特的茂谷柳丁，外觀有如傳統柳丁一樣黃澄澄，果肉像是茂谷柑一樣帶有夕陽般的橘色，外觀風味兼具，口感也結合了兩者的優點，清甜又多汁，是市場上潛力新秀，吸引饕客紛紛嘗鮮!\u003c/span>\u003cbr>\n\u003cbr>\n\u003cspan style=\"font-size: 16px;\">\u003cimg alt=\"來自雲林古坑，獨特的「茂谷柳丁」，外觀有如傳統柳丁一樣黃澄澄，果肉像是茂谷柑一樣帶有夕陽般的橘色，外觀風味兼具，口感也結合了兩者的優點，清甜又多汁，是市場上潛力新秀，吸引饕客紛紛嘗鮮!  也因為皮薄汁多容易造成落果及裂果，因此需要農友細心的照顧，才能造就累累的果實。\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110260418251.jpg\" style=\"width: 99%;\">\u003c/span>\u003cbr>\n\u003cbr>\n\u003cspan style=\"color:#000000;font-size:16px;\">但同時，也因為皮薄汁多容易造成落果及裂果，因此需要農友細心的照顧，才能造就累累的果實。\u003c/span>\u003cbr>\n\u003cbr>\n\u003cspan style=\"font-size: 16px;\">\u003cimg alt=\"來自雲林古坑，獨特的「茂谷柳丁」，外觀有如傳統柳丁一樣黃澄澄，果肉像是茂谷柑一樣帶有夕陽般的橘色，外觀風味兼具，口感也結合了兩者的優點，清甜又多汁，是市場上潛力新秀，吸引饕客紛紛嘗鮮!  也因為皮薄汁多容易造成落果及裂果，因此需要農友細心的照顧，才能造就累累的果實。\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110260418561.jpg\" style=\"width: 99%;\">\u003c/span>\n\n\u003cdiv style=\"text-align: center;\">\u003cspan style=\"color:#ff0000;\">\u003cspan style=\"font-size: 16px;\">部分果皮外觀有凸起狀，屬正常基因現象，不影響果肉請安心食用。\u003c/span>\u003c/span>\u003c/div>\n\u003cspan style=\"color:#ff0000;\">\u003cspan style=\"font-size: 16px;\"> \u003c/span>\u003c/span>\u003cspan style=\"font-size: 16px;\">\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202111120603471.jpg\" styl  r=\"1.5\">\u003c/circle>\u003cpath d=\"M2 3h3l2.4 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L22 7H6\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"acb-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">入\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">購\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 3;\">物\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 4;\">車\u003c/span>\u003c/span>\u003cspan class=\"acb-success\">\u003csvg class=\"acb-check\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12l4 4 10-10\">\u003c/path>\u003c/svg>\u003cspan class=\"acb-success-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">已\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">入\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv class=\"product-modal-content\">\u003ch5 style=\"text-align: center;\">\u003cspan style=\"color:#e74c3c;\">\u003cstrong>＊此為預購商品，預計於10月下旬開始採收，無法久候者請斟酌購買\u003c/strong>\u003c/span>\u003c/h5>\n\n\u003ch2 style=\"color:#0000cd;font-size:24px;font-weight:bolder;\">秋季限定的恩賜：富貴甜柿\u003c/h2>\n\u003cspan style=\"color:#000;font-size:16px;\">甜柿，是秋季限定的經典水果，果肉細膩緻密，風味香甜美味，可謂是深秋最受眾人擁戴的當季聖果。\u003cbr>\n\u003cbr>\n台灣的甜柿品種以次郎、富有、花御所為主，種植範圍以台灣中部的山陵地區，海拔較高的地區溫差較大，種出來的甜柿品質特別好，色澤飽滿、果肉細膩，最重要的爽脆香甜的好滋味，喇當大叔總說甜柿正是「上天的恩賜」呢！\u003cbr>\n\u003cbr>\n\u003cimg alt=\"喇當大叔 甜柿 柿子 馬烈霸 南投仁愛 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080859241.jpg\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"喇當大叔 甜柿 柿子 馬烈霸 南投仁愛 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080859411.jpg\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"喇當大叔 甜柿 柿子 馬烈霸 南投仁愛 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080901171.jpg\" style=\"width: 99%;\">\u003c/span>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">來自馬烈霸的高山日本甜柿\u003c/h2>\n\u003cspan style=\"color:#000;font-size:16px;\">當天氣漸涼，就是甜柿陸續採收的季節，山上的部落無論男女也跟著忙碌起來，採收他們照料多年的高山甜柿。\u003cbr>\n\u003cbr>\n馬烈霸部落，位於台灣中心的高海拔地區，在高達海拔1800公尺的群山之間，南投縣仁愛鄉盛產多種天然鮮美的高山蔬果，「甜柿」也是主角之一，產期約為每年10月底至12月底，是部落秋天的主角。\u003cbr>\n\u003cbr>\n\u003cimg alt=\"喇當大叔 甜柿 柿子 馬烈霸 南投仁愛 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080900071.jpg\" style=\"width: 99%;\">\u003c/span>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">\u003cimg alt=\"喇當大叔 甜柿 柿子 馬烈霸 南投仁愛 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080900291.jpg\" style=\"width: 99%;\">\u003c/span>\u003c/div>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">學知\"柿\"，安心吃\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230911233620.webp\" style=\"width: 99%;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230911483648.webp\" style=\"width: 99%;\">\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">富有？次郎？甜柿品種大解密！\u003c/p>\n\u003cspan style=\"color:#000000;font-size:16px;\">台灣的甜柿品種主要來自日本，產地以台中、南投為主，甜柿的產期約有2個多月，期間會有不同的品種輪流登場，品種差異不大，通常只有專業的農友分的出來，但無論哪一種還是藏不住通紅柿子的清爽脆甜！\u003cbr>\n\u003cbr>\n但美麗的品種名，很值得大家認識，以下是無毒農的貼心整理：\u003cbr>\n\u003cbr>\n（一）富有：果形豐圓，果皮呈紅黃色，果肉細緻多汁又甜美，果頂稍微凹入，成熟期較晚。\u003cbr>\n（二）次郎：果形扁平，果皮呈黃紅色，果頂有明顯的四條橫溝，質細但口感扎實，果汁較少，甜度較高，橫切面較方。\u003cbr>\n（三）花御所：果形略微扁圓，果皮呈深黃色，肉質極緻密多汁，可惜栽培不易，因此產量較低。\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030335571.jpg\" style=\"width: 99%;\" title=\"甜柿品種\">\n\u003ch2 style=\"color:#0000cd;font-size:24px;font-weight:bolder;\">柿子果肉黑黑的能吃嗎？\u003c/h2>\n\n\u003cp>\u003cspan style=\"color:#000000;font-size:16px;\">果肉若有黑點有兩種可能，其一是「熟透了」，柿子中的單寧物質，在成熟的過程中轉換成糖，才會出現黑點；其二是「氧化」導致，柿子切開後接觸到空氣，果肉裡的鞣酸及鐵與空氣結合形成黑點，但這兩種狀況皆能安心食用唷！\u003c/span>\u003c/p>\n\n\u003cp>\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2026/202610010223142083.webp\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030336461.jpg\" style=\"width: 99%;\" title=\"柿子保存\">\u003cbr>\n\u003cimg alt=\" 甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030337181.jpg\" style=\"width: 99%;\" title=\"柿子食用\">\u003cbr>\n\u003cbr>\n\u003ca href=\"http://greenbox.tw/Blog/BlogPostNew/6598/\">【延伸閱讀】柿子品種傻傻分不清楚！甜柿、澀柿原來這樣分？\u003c/a>\u003cbr>\n\u003ca href=\"http://greenbox.tw/Blog/BlogPostNew/6622/\">【延伸閱讀】柿子營養價值原來這麼多！？柿子不能跟什麼一起吃？\u003c/a>\u003c/p>\n\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv>\u003cp class=\"mt-0 mb-1\">商品品名：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">商品重(容)量：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">內容物名稱(成分)：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">原產地：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">投保產品責任險字號：泰安產物07字第062214B11213號\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv tabindex=\"0\" style=\"width: 0px; height: 0px; overflow: hidden; outline: none;\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>","56416":"\u003cdiv class=\"ant-modal-root css-5oxn3q\">\u003cdiv class=\"ant-modal-mask\" style=\"z-index: 10000;\">\u003c/div>\u003cdiv tabindex=\"-1\" class=\"ant-modal-wrap ant-modal-centered\" style=\"z-index: 10000;\">\u003cdiv role=\"dialog\" aria-modal=\"true\" class=\"ant-modal css-5oxn3q product-modal\" style=\"position: relative; width: 360px;\">\u003cdiv tabindex=\"0\" style=\"outline: none;\">\u003cdiv class=\"ant-modal-content\">\u003cdiv class=\"ant-modal-body\">\u003cdi 03c/span>\u003cspan class=\"acb-success\">\u003csvg class=\"acb-check\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12l4 4 10-10\">\u003c/path>\u003c/svg>\u003cspan class=\"acb-success-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">已\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">入\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv class=\"product-modal-content\">\u003ch4 style=\"text-align: center;\">\u003cspan style=\"color:#e74c3c;\">\u003cstrong>＊此為預購商品，預計於10月下旬開始採收，無法久候者請斟酌購買\u003c/strong>\u003c/span>\u003c/h4>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">秋季限定 高山日本甜柿\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">當天氣漸涼，也到了甜柿採收的季節，細緻的果肉、甜美的味道，可是深秋限定的高檔水果！甜柿色澤飽滿亮麗，果皮紅橘色且飽含光澤，一口咬下感受果肉細緻，清脆爽口的聲音伴隨著香甜滋味蔓延開來，是不少人每年必吃的美味！\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110070953041.jpg\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110070953331.jpg\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110070953531.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">精品典雅版\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">農友精心設計兩款禮盒，滿足大家送禮自用兩相宜的需求，保證大器送禮，安心享用！精品款的深綠色背景隱約閃耀著金黃色光芒，更是凸顯日本甜柿這樣的高檔美味，絕對是送禮送進心坎裡！\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿禮盒\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011040307471.jpg\" style=\"width: 99%;\" title=\"甜柿禮盒\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110071015571.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">簡約自用版\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"font-size: 16px;\">簡約款禮盒將秋日的繽紛色彩暈染開來，襯托出當季水果的繽多元，活潑清爽的配色正適合秋季果物，讓您從裡到外感受到柿子帶來的驚艷香甜。\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"柿子禮盒\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011040331521.jpg\" style=\"width: 99%;\" title=\"柿子禮盒\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110071016211.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">高甜度柿子的獨家配方\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">位處800-1000公尺的高海拔地區，這裡是溫帶水果的天堂。從山下帶來涼爽的冷空氣，日夜溫差大，白天陽光\u003c/span>\u003cspan style=\"font-size: 16px;\">日照時間長，傍晚溫度驟降，成了得天獨厚的孕育柿子的寶地，\u003c/span>\u003cspan style=\"font-size: 16px;\">讓這裡的甜柿更容易累積糖分，甜度高！\u003cbr>\n\u003cbr>\n緊鄰源源不絕的烏石坑溪，天然清澈的水源給予果樹適當的灌溉滋養，因此採收下來品質特別好\u003c/span>\u003cspan style=\"color:#000;font-size:16px;\">，口感也更清脆，\u003c/span>\u003cspan style=\"font-size: 16px;\">每逢秋季就是美味豐收的食刻，將天地精華鎖住於此，也難怪\u003c/span>\u003cspan style=\"color:#000;font-size:16px;\">深受市場喜愛，讓人忍不住一口接一口！\u003cbr>\n\u003cbr>\n\u003cimg alt=\"溫帶水果,甜柿\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202010101304021.jpg\" style=\"width: 99%;\">\u003c/span>\u003c/div>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">學知\"柿\"，安心吃\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230911233620.webp\" style=\"width: 99%;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230911483648.webp\" style=\"width: 99%;\">\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">富有？次郎？甜柿品種大解密！\u003c/p>\n\u003cspan style=\"color:#000000;font-size:16px;\">台灣的甜柿品種主要來自日本，產地以台中、南投為主，甜柿的產期約有2個多月，期間會有不同的品種輪流登場，品種差異不大，通常只有專業的農友分的出來，但無論哪一種還是藏不住通紅柿子的清爽脆甜！\u003cbr>\n\u003cbr>\n但美麗的品種名，很值得大家認識，以下是無毒農的貼心整理：\u003cbr>\n\u003cbr>\n（一）富有：果形豐圓，果皮呈紅黃色，果肉細緻多汁又甜美，果頂稍微凹入，成熟期較晚。\u003cbr>\n（二）次郎：果形扁平，果皮呈黃紅色，果頂有明顯的四條橫溝，質細但口感扎實，果汁較少，甜度較高，橫切面較方。\u003cbr>\n（三）花御所：果形略微扁圓，果皮呈深黃色，肉質極緻密多汁，可惜栽培不易，因此產量較低。\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030335571.jpg\" style=\"width: 99%;\" title=\"甜柿品種\">\n\u003ch2 style=\"color:#0000cd;font-size:24px;font-weight:bolder;\">柿子果肉黑黑的能吃嗎？\u003c/h2>\n\n\u003cp>\u003cspan style=\"color:#000000;font-size:16px;\">果肉若有黑點有兩種可能，其一是「熟透了」，柿子中的單寧物質，在成熟的過程中轉換成糖，才會出現黑點；其二是「氧化」導致，柿子切開後接觸到空氣，果肉裡的鞣酸及鐵與空氣結合形成黑點，但這兩種狀況皆能安心食用唷！\u003c/span>\u003c/p>\n\n\u003cp>\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2026/202610010223142083.webp\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030336461.jpg\" style=\"width: 99%;\" title=\"柿子保存\">\u003cbr>\n\u003cimg alt=\" 甜柿 柿子 日本 次郎 富有 花御所\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030337181.jpg\" style=\"width: 99%;\" title=\"柿子食用\">\u003cbr>\n\u003cbr>\n\u003ca href=\"http://greenbox.tw/Blog/BlogPostNew/6598/\">【延伸閱讀】柿子品種傻傻分不清楚！甜柿、澀柿原來這樣分？\u003c/a>\u003cbr>\n\u003ca href=\"http://greenbox.tw/Blog/BlogPostNew/6622/\">【延伸閱讀】柿子營養價值原來這麼多！？柿子不能跟什麼一起吃？\u003c/a>\u003c/p>\n\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv>\u003cp class=\"mt-0 mb-1\">商品品名：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">商品重(容)量：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">內容物名稱(成分)：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">原產地：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">投保產品責任險字號：泰安產物07字第062214B11213號\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv tabindex=\"0\" style=\"width: 0px; height: 0px; overf 04); padding: 5px 10px; text-align: left;\">\u003cspan style=\"font-size:16px;\">\u003ca href=\"/Products/ItemDetail/26401\" target=\"_blank\">・梨山蜜蘋果｜良森果園\u003c/a>\u003cbr>\n\u003ca href=\"/Products/ItemDetail/59303\" target=\"_blank\">・梨山蜜蘋果｜果樂園農場\u003c/a>\u003cbr>\n\u003ca href=\"/Products/ItemDetail/25006\" target=\"_blank\">・梨山蜜蘋果｜甜莃果園\u003c/a>\u003cbr>\n\u003ca href=\"/Products/ItemDetail/63323\" target=\"_blank\">・梨山蜜蘋果｜林山果原\u003c/a>\u003c/span>\u003c/div>\n\n\u003cdiv style=\"text-align: center;\">\u003ca class=\"ckeditor-anchor-btn\" href=\"http://greenbox.tw/Home/Search?key=%E6%96%87%E6%97%A6&amp;type=0\">點我買 梨山蜜蘋果\u003c/a>\u003c/div>\n\n\u003chr>\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">&nbsp;\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510290315222697.webp\" style=\"width: 99%;\">\u003c/p>\n\n\u003cp style=\"font-weight: bolder; text-align: center;\">\u003cspan style=\"font-size: 16px;\">農友的隱藏版大果 (與硬幣的比例尺)\u003c/span>\u003c/p>\n\n\u003cp style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">&nbsp;\u003c/p>\n\n\u003ch2 style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">\u003cspan style=\"font-size: 24px; font-weight: bolder;\">台灣本土蜜蘋果，甜蜜爽口\u003c/span>\u003c/h2>\n\u003cspan style=\"color:#000;font-size:16px;\">台中梨山是台灣本土高山蘋果的故鄉，從秋天開始陪伴大家度過冬天，從秋香、金冠、青龍採收到最甜美的「蜜蘋果」。\u003cbr>\n\u003cbr>\n\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110080801491.jpg\" style=\"width: 99%; height: 99%;\" title=\"梨山蜜蘋果\">\u003cbr>\n\u003cbr>\n蜜蘋果，源自於日本的高貴品種，日人賦予它美麗優雅的名字，又稱「惠」，果型飽滿，口感清脆，風味甜美，在台灣有一群忠實的朋友，每年就等這一味！\u003c/span>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">蜜線的秘密\u003c/h2>\n\u003cspan style=\"color:#000;font-size:16px;\">海拔約1800公尺的果樂園，位處梨山高海拔地區，蜜線的產生，是在溫度低於六度時，蘋果把自身澱粉轉化為醣，以避免凍傷所產生的生理現象！\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"蜜蘋果\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110290826521.jpg\" style=\"width: 99%; height: 99%;\">\u003cbr>\n\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\">所以\u003cstrong style=\"color:#0000FF;font-size:16px;\">「結蜜」\u003c/strong>是蜜蘋果愈挫愈勇的痕跡，沿著果核散布著晶瑩剔透的蜜腺，但其實蜜腺的多寡跟甜度口感並沒有關係唷！產期越晚，因氣溫的關係，蜜腺就會相對的多。\u003cbr>\n\u003cbr>\n\u003cimg alt=\"蜜蘋果\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110290835211.jpg\" style=\"width: 99%; height: 99%;\">\u003cbr>\n\u003cbr>\n但是沒看到蜜線也千萬別失望，表示蘋果已經將它甜蜜均勻的分佈在果肉裡面，甜香四溢，令人垂延欲滴!\u003c/span>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">不上蠟、天生天養、順天適地\u003c/h2>\n\n\u003cp>\u003cspan style=\"color:#000;font-size:16px;\">台灣高山蘋果產量稀少且珍貴，沒有外銷，自然就不需為了長期保存而為蘋果上蠟了，有時蘋果外觀會有一種油油的看似像上蠟的錯覺，那其實是蘋果自行產生的一種油質，這種油質是一種醣類，經常發生在甜度高、成熟度高的水果，只要用清水沖洗，便可直接帶皮享用，更加營養唷~\u003c/span>\u003cbr>\n\u003cbr>\n\u003cimg alt=\"蜜蘋果\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202110290827451.jpg\" style=\"width: 100%;\">\u003c/p>\n\n\u003cp>\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202511060727284139.webp\" style=\"width: 99%;\">\u003c/p>\n\n\u003cp style=\"text-align: center;\">隱藏版13A大果 對比照\u003c/p>\n\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv>\u003cp class=\"mt-0 mb-1\">商品品名：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">商品重(容)量：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">內容物名稱(成分)：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">原產地：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">投保產品責任險字號：泰安產物07字第062214B11213號\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv tabindex=\"0\" style=\"width: 0px; height: 0px; overflow: hidden; outline: none;\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>","59348":"\u003cdiv class=\"ant-modal-root css-5oxn3q\">\u003cdiv class=\"ant-modal-mask\" style=\"z-index: 10000;\">\u003c/div>\u003c L22 7H6\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"acb-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">入\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">購\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 3;\">物\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 4;\">車\u003c/span>\u003c/span>\u003cspan class=\"acb-success\">\u003csvg class=\"acb-check\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12l4 4 10-10\">\u003c/path>\u003c/svg>\u003cspan class=\"acb-success-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">已\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">入\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv class=\"product-modal-content\">\u003ch3 style=\"text-align: center;\">\u003cstrong>\u003cspan style=\"color:#e74c3c;\">預購商品預計11/10開始採收出貨，恕無法指定出貨時間\u003c/span>\u003c/strong>\u003c/h3>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">秋季限定 高山日本甜柿\u003c/h2>\n\n\u003cdiv style=\"text-align: justify;\">\u003cspan style=\"color:#000;font-size:16px;\">當天氣漸涼，也到了甜柿採收的季節，細緻的果肉、甜美的味道，是深秋限定的高檔水果。\u003cbr>\n\u003cbr>\n台灣的甜柿品種來自日本，產地以台中、南投為主，種植海拔較高，採收下來品質特別好，顏色是飽滿的紅橘色，果肉細緻多汁、脆而香甜，是不少人每年必吃的美味！\u003c/span>\u003c/div>\n\n\u003cdiv>\u003cbr>\n\u003cimg alt=\"甜柿,日本甜柿,梨山,小農,無毒農,柿子\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011110615481.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003cdiv style=\"text-align: justify;\">\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\">位處800-1\u003c/span>\u003cspan style=\"font-size: 16px;\">000公尺的高海拔地區，這裡是溫帶水果的天堂。從山下帶來涼爽的冷空氣，日夜溫差大，讓這裡的甜柿更容易累積糖分，口感也更清脆，因此深受市場喜愛！\u003c/span>\u003c/div>\n\n\u003cdiv>\u003cbr>\n\u003cimg alt=\"甜柿,日本甜柿,梨山,小農,無毒農,柿子\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011200307521.jpg\" style=\"width: 99%;\" title=\"甜柿,日本甜柿,梨山,小農,無毒農,柿子\">\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿,日本甜柿,梨山,小農,無毒農,柿子\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011110614461.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230919115812.webp\" style=\"width: 99%;\">\u003cimg src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510230919274262.webp\" style=\"width: 99%;\">\u003cbr>\n\u003cbr>\n富有？次郎？甜柿品種大解密！\u003c/h2>\n\u003cspan style=\"font-size: 16px; margin: 0px; padding: 0px; border: 0px; outline: 0px; vertical-align: baseline; background: 0px 0px rgb(255, 255, 255); -webkit-font-smoothing: antialiased; color: rgb(51, 51, 51);\">台灣的甜柿品種主要來自日本，產地以台中、南投為主，\u003c/span>\u003cspan style=\"font-size: 16px; margin: 0px; padding: 0px; border: 0px; outline: 0px; vertical-align: baseline; background: 0px 0px rgb(255, 255, 255); -webkit-font-smoothing: antialiased;\">甜柿的產期約有2個多月，期間會有不同的品種輪流登場，品種差異不大，通常只有專業的農友分的出來，但無論哪一種還是藏不住通紅柿子的清爽脆甜！\u003c/span>\u003cbr>\n\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\">但美麗的品種名，很值得大家認識，以下是無毒農的貼心整理：\u003cbr>\n\u003cbr>\n（一）富有：果形豐圓，果皮呈紅黃色，果肉細緻多汁又甜美，果頂稍微凹入，成熟期較晚。\u003cbr>\n（二）次郎：果形扁平，果皮呈黃紅色，果頂有明顯的四條橫溝，質細但口感扎實，果汁較少，甜度較高，橫切面較方。\u003cbr>\n（三）花御所：果形略微扁圓，果皮呈深黃色，肉質極緻密多汁，可惜栽培不易，因此產量較低。\u003cbr>\n\u003cbr>\n\u003cimg alt=\"甜柿品種\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202011030335571.jpg\" style=\"width: 99%;\" title=\"甜柿品種\">\u003c/span>\n\n\u003ch2 style=\"color:#0000CD;font-size:24px;font-weight:bolder;\">柿子果肉黑黑的能吃嗎？\u003c/h2>\n\n\u003cdiv style=\"text-align: justify;\">\u003cspan style=\"color:#000;font-size:16px;\">果肉若有黑點有兩種可能，其一是「熟透了」，柿子中的單寧物質，在成熟的過程中轉換成糖，才會出現黑點；其二是「氧化」導致，柿子切開後接觸到空氣，果肉裡的鞣酸及鐵與空氣結合形成黑點，但這兩種狀況皆能安心食用唷！\u003c/span>\u003c/div>\n\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\"> ">\u003cspan class=\"acb-char\" style=\"--i: 0;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">入\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">購\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 3;\">物\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 4;\">車\u003c/span>\u003c/span>\u003cspan class=\"acb-success\">\u003csvg class=\"acb-check\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12l4 4 10-10\">\u003c/path>\u003c/svg>\u003cspan class=\"acb-success-label\">\u003cspan class=\"acb-char\" style=\"--i: 0;\">已\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 1;\">加\u003c/span>\u003cspan class=\"acb-char\" style=\"--i: 2;\">入\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv class=\"product-modal-content\">\u003cp style=\"text-align: center;\">\u003cspan style=\"color:#e74c3c;\">＊此為預購商品，\u003cspan style=\"background-color:#ffff00;\">預計於10月下旬\u003c/span>開始採收，無法久候者請斟酌購買\u003c/span>\u003c/p>\n\n\u003ch2 style=\"color:#0000cd;font-size:24px;font-weight:bolder;\">一口爆汁的暢快體驗：爆汁大白柚\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">中秋節品嚐過無數的文旦(柚子)後，就是迎來大白柚的產季。大白柚是文旦柚、紅柚中的大哥級存在，無論是外型還是果肉，顆顆渾圓飽滿、汁水多到會滴滿手！咬下那瞬間的爆汁感，彷彿整個秋天的甜美都在嘴裡綻放。\u003c/span>\u003c/div>\n\n\u003cdiv style=\"text-align: center;\">\u003cbr>\n\u003cimg alt=\"大白柚,麻豆白柚,柚子,晶讚柚園\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202010080755301.jpg\" style=\"width: 99%;\">\u003c/div>\n\n\u003cdiv>\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\">大白柚天生外型渾圓碩大，果皮較為平滑，存放一段時間後，果皮會從淡黃轉為深黃色。沉甸甸的份量一隻手拿都還有些吃力，晶瑩剔透的果肉，厚實又多汁，一顆的份量就有十分滿足！\u003c/span>\u003c/div>\n\n\u003cdiv style=\"text-align: center;\">\u003cbr>\n\u003cspan style=\"font-size: 16px; background-color: rgb(255, 255, 255);\">\u003cimg alt=\"大白柚\" src=\"https://greenboxcdn.azureedge.net/upload/Product_3033/202010140614161.jpg\" style=\"width: 99%;\">\u003c/span>\u003c/div>\n\n\u003cdiv>\u003cbr>\n\u003cspan style=\"color:#000;font-size:16px;\">此外，大白柚也是優質的天然健康食品，富含膳食纖維與維他命C，是入秋最健康的滋味，好吃又香甜！\u003c/span>\u003c/div>\n\n\u003cdiv style=\"text-align: center;\">\u003cbr>\n\u003cspan style=\"font-size: 16px; background-color: rgb(255, 255, 255);\">\u003cimg alt=\"5012柚意思白柚,大白柚\" src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510070422294864.webp\" style=\"width: 99%;\">\u003c/span>\u003c/div>\n\n\u003ch2 style=\"color: rgb(0, 0, 205); font-size: 24px; font-weight: bolder;\">甘甜清香的秋日盛果\u003c/h2>\n\n\u003cdiv>\u003cspan style=\"color:#000;font-size:16px;\">吃過大白柚的人少，過了中秋佳節送禮的熱潮，種植大白柚的人就不如文旦來得這麼多，在市場上更是罕見，主要的產區還是集中於台南麻豆。\u003c/span>\u003c/div>\n\n\u003cdiv style=\"text-align: center;\">\n\u003cp data-sr-id=\"3\">\u003cbr>\n\u003cimg alt=\"5012白柚,大白柚,麻豆白柚,柚子\" src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510070423480184.webp\" style=\"width: 99%;\">\u003c/p>\n\n\u003cp data-sr-id=\"3\" style=\"text-align: left;\">\u003cspan style=\"color:#000;font-size:16px;\">外型渾圓飽滿的大白柚，汁囊晶瑩剔透、果肉純白細緻，纖維少、甜度高，一顆就能全家共享。剛採收時帶有微微酸香，放上幾日後酸味漸退、轉為甘醇。此刻正值嚐鮮時機，一期一會，錯過就要再等一年！\u003c/span>\u003c/p>\n\n\u003cp data-sr-id=\"3\" style=\"text-align: left;\">\u003cspan style=\"color:#000;font-size:16px;\">\u003cimg alt=\"\" src=\"https://greenboxcdn.azureedge.net/upload/resources_2025/202510070613528851.webp\" style=\"width: 99%;\">\u003c/span>\u003c/p>\n\u003c/div>\n\u003c/div>\u003cdiv class=\"ant-divider css-5oxn3q ant-divider-horizontal\" role=\"separator\">\u003c/div>\u003cdiv>\u003cp class=\"mt-0 mb-1\">商品品名：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">商品重(容)量：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">內容物名稱(成分)：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">原產地：如上述所示\u003c/p>\u003cp class=\"mt-0 mb-1\">投保產品責任險字號：泰安產物07字第062214B11213號\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv tabindex=\"0\" style=\"width: 0px; height: 0px; overflow: hidden; outline: none;\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>"},"reports":{"25458":{"SelfStructured":null,"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202610070155562536_fc6676c8-fe9e-4787-8ba3-f06811f99d4f.png"],"ThirdImages":[]},"26668":{"SelfStructured":{"VendorName":"喇當大叔","SampleName":"柿","ProductName":"甜柿","AnalysisDate":"2026/10/07","LabName":"舒果農(無毒農)企業有限公司","Pesticides":[{"PesticideNameCn":"待克利","PesticideNameEn":"Difenoconazole","DetectedConcentration":0.01,"ToleranceLimit":1,"IsExceeded":false}]},"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202609230935023757_d70eac84-a7aa-43a1-9e90-4b4707206b30.png"],"ThirdImages":[]},"56416":{"SelfStructured":null,"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202609240149234469_fb0c16ca-f7c9-410c-b3c6-3a5f8da91212.png"],"ThirdImages":[]},"59303":{"SelfStructured":null,"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202610060149022302_81a6c5c4-5237-432d-8632-b1c7d38970ef.png"],"ThirdImages":[]},"59348":{"SelfStructured":null,"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202610130132295449_70e7fdda-9e58-4f27-8efb-3ac5116ce599.png"],"ThirdImages":[]},"73310":{"SelfStructured":{"VendorName":"5012柚意思","SampleName":"柚子","ProductName":"柚子","AnalysisDate":"2026/09/23","LabName":"舒果農(無毒農)企業有限公司","Pesticides":[{"PesticideNameCn":"待克利","PesticideNameEn":"Difenoconazole","DetectedConcentration":0.03,"ToleranceLimit":0.6,"IsExceeded":false},{"PesticideNameCn":"芬佈賜","PesticideNameEn":"Fenbutatin-oxide","DetectedConcentration":0.04,"ToleranceLimit":2,"IsExceeded":false}]},"SelfImages":["https://fruitbox.blob.core.windows.net/product/examine_report_self/2026/202610050212405682_9440e245-4267-477c-bb06-efbbbac913de.png"],"ThirdImages":[]}}}</script><script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('ds-data').textContent);
  const KEY = 'direct-product-status-v3';
  const params = new URLSearchParams(location.search);
  const baseline = params.has('baseline');
  const pageType = document.documentElement.dataset.demoPage;
  const catalog = data.products;
  const demoIds = data.demoIds;
  const selectedId = params.get('id') || demoIds[0];
  function todayDate(){const parts=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]));return parts.year+'-'+parts.month+'-'+parts.day;}
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const base = product => ({hasTag:false,Display:true,Type2:product.subCategoryId,StartTime:(product.startTime||todayDate()+'T00:00').slice(0,16),EndTime:'2100-01-01T23:59',EventDate:'2026-10-06',Status:'正常上架',RemindText:'',reasons:[]});
  const presets = {
    normal: {},
    weatherPaused: {hasTag:true,Type2:1,reasons:['天氣 / 氣候類|颱風']},
    supplyPaused: {hasTag:true,Type2:1,reasons:['農友 / 供應鏈類|供貨量不足']},
    seasonEnded: {hasTag:true,Type2:6,EventDate:'2026-10-06',reasons:['產季自然週期類|產季結束']},
    seasonNotStarted: {hasTag:true,Type2:6,EventDate:'2026-09-01',RemindText:'11月中旬',reasons:['產季自然週期類|產季結束']},
    discontinued: {hasTag:true,Type2:6,reasons:['農友 / 供應鏈類|農友終止合作']}
  };
  function initial() {
    const states = ['weatherPaused','supplyPaused','seasonEnded','seasonNotStarted','discontinued','normal'];
    return {today:todayDate(),monthRule:'30days',products:Object.fromEntries(demoIds.map((id,i)=>[id,{...base(catalog.find(p=>String(p.id)===id)),...presets[states[i]],Status:i===5?'正常上架':'正常下架'}]))};
  }
  function read() {
    try { const saved=JSON.parse(localStorage.getItem(KEY)); if(saved?.products) return {...saved,today:todayDate(),monthRule:'30days',products:Object.fromEntries(Object.entries(saved.products).filter(([id])=>catalog.some(p=>String(p.id)===id)).map(([id,input])=>[id,{...base(catalog.find(p=>String(p.id)===id)),...input}]))}; } catch {}
    return initial();
  }
  let state = read();
  let renderTest = null;
  const productById = id => catalog.find(p=>String(p.id)===String(id));
  const inputById = id => ({...base(productById(id)),...(!baseline?state.products[id]:{})});
  // Demo-only overrides represent each ProductDetail.StockAmt, not total OriginStockAmt.
  const stockForSpec=(id,specId)=>inputById(id).specStockAmt?.[specId]??data.productSpecs?.[id]?.find(spec=>spec.id===String(specId))?.stock;
  function hasStock(id){const specs=data.productSpecs?.[id];return specs?.length?specs.some(spec=>stockForSpec(id,spec.id)>0):!productById(id).isSoldOut;}
  function salePeriod(id){
    const input=inputById(id),product=productById(id);
    const taipeiTime=value=>Date.parse(value+(value.length===16?':00':'')+'+08:00');
    const start=taipeiTime(input.StartTime),end=taipeiTime(input.EndTime);
    const now=Date.now();
    return now<start?'notStarted':now>=end||(!state.products[id]&&product.isExpired)?'ended':'selling';
  }
  function reasonPriority(reason){
    if(/農友終止合作|轉作 \/ 改種其他品項/.test(reason))return 0;
    if(reason.startsWith('天氣 / 氣候類|'))return 1;
    if(reason.startsWith('農友 / 供應鏈類|')||reason.startsWith('平台營運類|'))return 2;
    return 3;
  }
  function tagStatus(id) {
    const input=inputById(id);
    const available=hasStock(id);
    const result={status:'normal',labelText:available?'':'已售完',buttonText:available?(Number(input.Type2)===6?'結束販售':'加入菜籃'):'已售完',canAddToCart:available&&Number(input.Type2)!==6,showInList:Number(input.Type2)!==6,showInSearch:true,showProductPage:true,seasonText:null,canNotify:false};
    if(!input.Display) return {...result,status:'hidden',labelText:'',canAddToCart:false,showInList:false,showInSearch:false,showProductPage:false};
    if(!input.hasTag) return result;
    const reasons=input.reasons || [];
    if(reasons.some(r=>reasonPriority(r)===0)) return {...result,status:'discontinued',labelText:'本商品已停止販售',buttonText:'結束販售',canAddToCart:false,showInList:false};
    if(Number(input.Type2)!==6) {
      if(reasons.some(r=>reasonPriority(r)===1)) return {...result,status:'weatherPaused',labelText:'氣候因素暫停接單',buttonText:'暫停販售',canAddToCart:false,showInList:true};
      if(reasons.some(r=>reasonPriority(r)===2)) return {...result,status:'supplyPaused',labelText:'供貨不足，暫停接單',buttonText:'暫停販售',canAddToCart:false,showInList:true};
    }
    const [y,m,d]=input.EventDate.split('-').map(Number);
    const event=Date.UTC(y,m-1,d);
    const boundary=event+30*86400000;
    const now=Date.parse(todayDate()+'T00:00:00Z');
    const upcoming=now>=boundary && Boolean(input.RemindText.trim());
    return {...result,status:upcoming?'seasonNotStarted':'seasonEnded',labelText:upcoming?'產季未到':'產季結束',buttonText:upcoming?'尚未開始販售':'結束販售',seasonText:upcoming?input.RemindText.trim():null,canAddToCart:false,canNotify:true,showInList:false};
  }
  function status(id){
    const result=tagStatus(id);
    if(result.status!=='normal')return result;
    const period=salePeriod(id);
    if(period==='notStarted')return {...result,status:'saleNotStarted',labelText:'尚未開始販售',buttonText:'尚未開始販售',canAddToCart:false};
    if(period==='ended')return {...result,status:'saleEnded',labelText:'結束販售',buttonText:'結束販售',canAddToCart:false};
    return result;
  }
  function purchaseState(id,specId,mode='detail'){
    const result=tagStatus(id),period=salePeriod(id),stock=specId===undefined?(hasStock(id)?1:0):stockForSpec(id,specId);
    const blocked=(text,code)=>({...result,status:code,buttonText:text,canAddToCart:false});
    const hiddenCategory=()=>Number(inputById(id).Type2)===6;
    if(result.status==='hidden')return result;
    if(mode==='card'){
      if(result.status!=='normal')return result;
      if(stock<=0)return blocked('已售完','soldOut');
      if(period==='ended'||hiddenCategory())return blocked('結束販售','saleEnded');
      return {...result,buttonText:'購買',canAddToCart:true};
    }
    if(mode==='quick'){
      if(result.status!=='normal')return result;
      if(stock<=0)return blocked('已售完','soldOut');
      if(period==='notStarted')return blocked('即將販售','saleNotStarted');
      if(period==='ended'||hiddenCategory())return blocked('結束販售','saleEnded');
      return {...result,buttonText:'加入購物車',canAddToCart:true};
    }
    if(period==='notStarted')return blocked('倒數開放訂購','countdown');
    if(result.status!=='normal')return result;
    if(period==='ended'||hiddenCategory())return blocked('結束販售','saleEnded');
    if(stock<=0)return blocked('已售完','soldOut');
    return {...result,buttonText:'加入菜籃',canAddToCart:true};
  }
  function save() {
    try { localStorage.setItem(KEY,JSON.stringify(state)); } catch {}
    window.dispatchEvent(new Event('ds-state-change'));
    document.querySelectorAll('iframe').forEach(frame=>frame.contentWindow?.postMessage({type:'ds-state',state},'*'));
    if(window.opener) window.opener.postMessage({type:'ds-state',state},'*');
  }
  // postMessage also keeps file:// previews linked where browser storage is isolated.
  window.addEventListener('message',event=>{
    if(event.data?.type==='ds-state' && event.data.state?.products) {state=event.data.state;try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}apply();}
    if(event.data?.type==='ds-ready' && pageType==='test') event.source.postMessage({type:'ds-state',state},'*');
  });
  window.addEventListener('storage',event=>{if(event.key===KEY){state=read();apply();}});
  window.addEventListener('focus',()=>{state=read();apply();});
  const clockSignature=()=>todayDate()+'|'+catalog.map(product=>salePeriod(String(product.id))).join('|');
  let lastClockSignature=clockSignature();
  setInterval(()=>{renderCountdowns();const signature=clockSignature();if(signature!==lastClockSignature){lastClockSignature=signature;state.today=todayDate();apply();}},1000);
  function notifyDialog(id) {
    const dialog=modal('開賣通知我','<form id="ds-notification"><label>電子信箱<input type="email" name="email" required autocomplete="email"></label><button type="submit">訂閱到貨提醒</button></form>');
    dialog.querySelector('form').onsubmit=event=>{event.preventDefault();localStorage.setItem('ds-notification-'+id,dialog.querySelector('input').value);dialog.innerHTML='<h2>已登記到貨提醒</h2><button type="button">關閉</button>';dialog.querySelector('button').onclick=()=>dialog.close();};
  }
  function remindLink(detail,purchase) {
    const host=detail.querySelector('[data-pid][data-pdid]')||detail;
    let link=host.querySelector('.ds-remind-link');
    if(!link){link=document.createElement('a');link.className='example-image-link Remind-link ds-remind-link';link.href='javascript:void(0)';host.append(link);}
    link.hidden=!purchase.canNotify;
    link.innerHTML=purchase.canNotify?'<i class="fa fa-bell"></i>'+esc(purchase.labelText+'，開賣通知我'):'';
  }
  const taipeiMs=value=>Date.parse(value+(value.length===16?':00':'')+'+08:00');
  const saleStart=id=>taipeiMs(inputById(id).StartTime);
  const pad2=n=>n<10?'0'+n:String(n);
  function renderCountdowns(){
    document.querySelectorAll('[data-ds-countdown]').forEach(el=>{
      const total=Math.max(0,Math.floor((Number(el.dataset.dsCountdown)-Date.now())/1000));
      const d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),s=total%60;
      const text=el.dataset.dsStyle==='card'
        ?'倒數 '+(d*24+h)+' : '+pad2(m)+' : '+pad2(s)+' 開賣'
        :'倒數 '+d+'天'+pad2(h)+'時'+pad2(m)+'分'+pad2(s)+'秒 開放訂購';
      if(el.tagName==='INPUT')el.value=text;else el.textContent=text;
    });
  }
  function cardCountdown(cover,id,result){
    let bar=cover.querySelector(':scope > .ds-countdown-card');
    if(result.status==='hidden'||salePeriod(id)!=='notStarted'){if(bar)bar.remove();return;}
    if(!bar){bar=document.createElement('span');bar.className='ds-countdown-card';cover.style.position='relative';cover.append(bar);}
    bar.dataset.dsCountdown=String(saleStart(id));bar.dataset.dsStyle='card';
  }
  function stamp(container, result) {
    container.querySelectorAll(':scope > .ds-status-stamp').forEach(el=>el.remove());
    if(result.status==='normal'||result.status==='hidden'||result.status==='saleNotStarted') return;
    container.style.position='relative';
    const label=document.createElement('div'); label.className='ds-status-stamp';label.dataset.status=result.status;
    const lines=result.status==='weatherPaused'?['氣候因素','暫停接單']:result.status==='supplyPaused'?['供貨不足','暫停接單']:result.status==='discontinued'?['本商品已','停止販售']:[result.labelText];
    const text=document.createElement('div');text.className='ds-status-label';

    document.getElementById('stock-fields').innerHTML=data.productSpecs[fixedId].map(spec=>'<label class="ds-lab-field"><span>'+esc(spec.name)+'</span><input type="number" min="0" step="1" required data-stock-spec="'+spec.id+'" aria-label="'+esc(spec.name)+' 可售庫存"></label>').join('');
    const categories=['天氣 / 氣候類','病蟲害類','產季自然週期類','農友 / 供應鏈類','平台營運類','品質類'];
    const reasons=['天氣 / 氣候類|颱風','天氣 / 氣候類|豪雨 / 淹水','農友 / 供應鏈類|供貨量不足','農友 / 供應鏈類|出貨延遲','農友 / 供應鏈類|農友終止合作','農友 / 供應鏈類|轉作 / 改種其他品項','平台營運類|欠單過多','平台營運類|熱銷完售','產季自然週期類|產季結束','產季自然週期類|產季開始','品質類|品質不符','病蟲害類|病蟲害'];
    document.getElementById('reasons').innerHTML=categories.map(category=>'<fieldset class="ds-lab-reason-group"><legend>'+esc(category)+'</legend>'+reasons.filter(reason=>reason.startsWith(category+'|')).map(reason=>'<label><input type="checkbox" name="reason" value="'+esc(reason)+'">'+esc(reason.split('|')[1])+'</label>').join('')+'</fieldset>').join('');
    function picked(){
      const selected=[...form.querySelectorAll('[name=reason]:checked')].map(el=>el.value);
      const seasonal=Number(document.getElementById('Type2').value)===6;
      const tiers=new Map();
      selected.forEach(reason=>{
        const priority=reasonPriority(reason),rank=seasonal&&priority!==0?3:priority;
        const [category,name]=reason.split('|');
        const label=priority===0?category+'（'+name+'）':category;
        if(!tiers.has(rank))tiers.set(rank,new Set());tiers.get(rank).add(label);
      });
      if(document.getElementById('hasTag').checked&&seasonal)tiers.set(.5,new Set(['快速到貨類別：不顯示']));
      const order=[...tiers].sort(([a],[b])=>a-b).map(([,labels])=>labels.size>1?'（'+[...labels].join(' = ')+'）':[...labels][0]);
      const result=status(fixedId);
      const label=!inputsValid?'尚未填寫完畢':result.status==='hidden'?'下架不顯示':result.labelText||(seasonal?'結束販售':'正常販售');
      if(!document.getElementById('hasTag').checked)order.splice(0,order.length,'無產品標籤紀錄');
      if(!document.getElementById('Display').checked)order.unshift('未勾選上架');
      const summary=document.getElementById('picked-reasons');
      const final=document.createElement('strong');final.textContent='「'+label+'」：';
      summary.replaceChildren(final,document.createTextNode(order.join(' > ')||'尚未選擇原因'));
      if(!inputsValid)return;
      const period=salePeriod(fixedId);
      if(period!=='selling'&&result.status!=='hidden'){
        const specId=document.querySelector('#detail-purchase .spec-btn.active')?.id.replace('spec-pd-','');
        const purchase=purchaseState(fixedId,specId),line=document.createElement('span');line.className='ds-lab-purchase-result';
        const tagged=document.getElementById('hasTag').checked;
        line.textContent='按鈕「'+purchase.buttonText+'」：'+(period==='notStarted'?'尚未到開始販售時間 > '+(tagged?'產品標籤':'庫存'):(tagged?'產品標籤 > ':'')+'已到結束販售時間 > 庫存');summary.append(line);
      }
      if(result.canNotify){const notify=document.createElement('span');notify.className='ds-lab-purchase-result';notify.textContent='另有「開賣通知我」入口：產季結束與產季未到都顯示，不受販售時間影響';summary.append(notify);}
    }
    function recordEnabled(){const enabled=document.getElementById('hasTag').checked;document.getElementById('EventDate').required=enabled;document.getElementById('EventDate').disabled=!enabled;document.getElementById('Status').disabled=!enabled;document.querySelector('.ds-lab-record-row').classList.toggle('is-disabled',!enabled);}
    function cardHtml(id,hidePrice=false){
      const template=document.createElement('template');template.innerHTML=data.cards[id];const card=template.content.firstElementChild;
      if(hidePrice){const buttons=card.querySelector('.product-item');buttons.previousElementSibling.hidden=true;buttons.parentElement.classList.add('justify-end');}
      card.querySelectorAll('a[href*="/Products/ItemDetail/"]').forEach(link=>{link.href='product-detail.html?id='+id;});
      return card.outerHTML;
    }
    function syncFields(){
      const input=inputById(fixedId);
      document.getElementById('hasTag').checked=input.hasTag;document.getElementById('Display').checked=input.Display;
      document.getElementById('Type2').value=[2,6].includes(Number(input.Type2))?String(input.Type2):'0';
      ['StartTime','EndTime','EventDate','RemindText'].forEach(key=>document.getElementById(key).value=input[key]);
      document.getElementById('Status').value=input.Status||(input.hasTag?'正常下架':'正常上架');
      document.querySelectorAll('[name=reason]').forEach(el=>el.checked=input.hasTag&&input.reasons.includes(el.value));
      form.querySelectorAll('[data-stock-spec]').forEach(el=>el.value=stockForSpec(fixedId,el.dataset.stockSpec));
      inputsValid=true;document.getElementById('form-error').hidden=true;
      recordEnabled();output();
    }
    function output(){
      lastClockSignature=clockSignature();
      picked();
      document.querySelectorAll('.ds-lab-incomplete').forEach(el=>el.hidden=inputsValid);
      ['product-category','search-page','detail-purchase','quick-preview','category-count','search-count'].forEach(id=>document.getElementById(id).hidden=!inputsValid);
      if(!inputsValid)return;
      const visible=testIds.filter(id=>status(id).showInList);
      document.getElementById('category-grid').innerHTML=visible.map(id=>cardHtml(id)).join('');
      document.getElementById('category-count').textContent=visible.length+' 個商品';document.getElementById('category-empty').hidden=visible.length>0;
      patchCards(false,document.getElementById('product-category'));
      const q=document.getElementById('search-query').value.trim().toLowerCase();
      const matches=testIds.filter(id=>status(id).showInSearch&&(!q||productById(id).name.toLowerCase().includes(q)||id===q));
      const normal=matches.filter(id=>status(id).showInList),unavailable=matches.filter(id=>!status(id).showInList);
      document.getElementById('search-normal-grid').innerHTML=normal.map(id=>cardHtml(id)).join('');
      document.getElementById('search-unavailable-grid').innerHTML=unavailable.map(id=>cardHtml(id,true)).join('');
      document.getElementById('search-normal').hidden=normal.length===0;document.getElementById('search-unavailable').hidden=unavailable.length===0;
      document.getElementById('search-count').textContent=matches.length+' 個商品';document.getElementById('search-empty').hidden=matches.length>0;
      patchCards(true,document.getElementById('search-page'));
      document.getElementById('detail-link').href='product-detail.html?id='+fixedId;
      detailStatus(fixedId,document.getElementById('detail-purchase'));
      quickPreview(fixedId,document.getElementById('quick-preview'));
    }
    function updateInputs(event){
      const wasValid=inputsValid;
      if(event?.target.name==='reason'&&event.target.checked)document.getElementById('hasTag').checked=true;
      if(event?.target.id==='hasTag'&&!event.target.checked)form.querySelectorAll('[name=reason]').forEach(el=>el.checked=false);
      recordEnabled();
      const stockInputs=[...form.querySelectorAll('[data-stock-spec]')];
      const stockValid=stockInputs.every(el=>el.value!==''&&Number.isSafeInteger(Number(el.value))&&Number(el.value)>=0);
      const input={hasTag:document.getElementById('hasTag').checked,Display:document.getElementById('Display').checked,Type2:Number(document.getElementById('Type2').value),StartTime:document.getElementById('StartTime').value,EndTime:document.getElementById('EndTime').value,EventDate:document.getElementById('EventDate').value,Status:document.getElementById('Status').value,RemindText:document.getElementById('RemindText').value,reasons:[...form.querySelectorAll('[name=reason]:checked')].map(el=>el.value),specStockAmt:Object.fromEntries(stockInputs.map(el=>[el.dataset.stockSpec,Number(el.value)]))};
      const today=todayDate(),monthRule='30days';
      const timeValid=Boolean(input.StartTime&&input.EndTime&&input.StartTime<input.EndTime&&document.getElementById('StartTime').validity.valid&&document.getElementById('EndTime').validity.valid);
      inputsValid=Boolean(stockValid&&timeValid&&(!input.hasTag||(input.EventDate&&input.Status&&input.reasons.length)));
      const error=document.getElementById('form-error');error.hidden=inputsValid;error.textContent='尚未填寫完畢：'+(!stockValid?'庫存請填寫 0 或正整數。':!timeValid?'請填寫開始、結束販售時間，結束須晚於開始。':'請填寫日期、狀態，並至少選擇一個原因。');
      if(!inputsValid){output();return;}
      if(JSON.stringify(state.products[fixedId])===JSON.stringify(input)&&state.today===today&&state.monthRule===monthRule){if(!wasValid)output();return;}
      state.products[fixedId]=input;state.today=today;state.monthRule=monthRule;save();
    }
    form.addEventListener('input',updateInputs);
    form.addEventListener('change',updateInputs);
    form.addEventListener('submit',e=>e.preventDefault());
    document.getElementById('search-form').onsubmit=e=>{e.preventDefault();output();};document.getElementById('search-query').oninput=output;
    window.addEventListener('ds-state-change',output);renderTest=output;
    syncFields();
    window.dsTest={status,purchaseState,read:()=>state};
  }
  function apply(){
    lastClockSignature=clockSignature();
    if(pageType==='test'&&renderTest)renderTest();
    if(pageType==='list'){if(params.get('view')==='search')searchCards();else patchCards();}
    if(pageType==='detail')detailStatus();
    const quick=document.getElementById('ds-quick');
    if(quick){const id=quick.dataset.productId;if(id&&!status(id).canAddToCart)quick.remove();}
  }
  if(pageType==='test')test();
  else {
    if(pageType==='list'&&params.get('view')==='search')document.getElementById('RenderBody').innerHTML=data.search;
    if(pageType==='detail'){
      if(!data.details[selectedId]){document.getElementById('RenderBody').textContent='查無商品';return;}
      document.getElementById('RenderBody').innerHTML=data.details[selectedId];initGallery();
    }
    setupShell();apply();
    window.addEventListener('ds-state-change',apply);
    if(window.parent!==window)window.parent.postMessage({type:'ds-ready'},'*');
    window.dsDemo={status,read:()=>state};
  }
})();
</script>
</body>
</html>
