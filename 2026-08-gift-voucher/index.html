<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>禮物券 demo 索引</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 60px 20px;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    font-size: 16px; line-height: 1.7; color: #333; background: #f1f2f7;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 14px; margin: 0 0 32px; }

  .entries { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 760px) { .entries { grid-template-columns: 1fr; } }
  .entry {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
    padding: 36px 20px; text-decoration: none; color: inherit; text-align: center;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .entry:hover { border-color: #4ba83b; box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-2px); }
  .entry-icon {
    width: 56px; height: 56px; border-radius: 50%; background: #eef7ec; color: #4ba83b;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    margin-bottom: 14px;
  }
  .entry-name { font-size: 18px; font-weight: 600; color: #4ba83b; margin-bottom: 4px; }
  .entry-desc { font-size: 14px; color: #666; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">

  <h1>禮物券 demo</h1>
  <p class="sub">2026-08</p>

  <div class="entries">
    <a class="entry" href="admin-gift-list.html">
      <div class="entry-icon">後</div>
      <div class="entry-name">後台</div>
      <div class="entry-desc">禮物與禮物券的管理介面</div>
    </a>
    <a class="entry" href="member-center-new2.html">
      <div class="entry-icon">員</div>
      <div class="entry-name">前台會員中心</div>
      <div class="entry-desc">客人看到與使用禮物券的地方</div>
    </a>
    <a class="entry" href="checkout-cart.html">
      <div class="entry-icon">車</div>
      <div class="entry-name">加入購物車</div>
      <div class="entry-desc">禮物進購物車後的樣子與金額計算</div>
    </a>
  </div>

</div>
</body>
</html>
